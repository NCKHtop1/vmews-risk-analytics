name: FinQuery research feeds shadow QA
on:
  pull_request:
    paths:
      - 'financial-report/scripts/research_feeds_shadow.py'
      - 'financial-report/scripts/research_feeds_shadow_test.py'
      - '.github/workflows/finquery-research-feeds-shadow.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * 1-5'
permissions:
  contents: read
concurrency:
  group: finquery-research-feeds-shadow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: |
          python -m py_compile financial-report/scripts/research_feeds_shadow.py financial-report/scripts/research_feeds_shadow_test.py
          python -m unittest discover -s financial-report/scripts -p research_feeds_shadow_test.py -v
  shadow-probe:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: |
          python financial-report/scripts/research_feeds_shadow.py --output /tmp/finquery-research-shadow/research-feed-status.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/finquery-research-shadow/research-feed-status.json'))
          assert d['mode']=='SHADOW_ONLY' and d['publicServingEnabled'] is False
          assert d['forecastInputsChanged'] is False and d['strategyInputsChanged'] is False
          assert all(x.get('publicationEligible', False) is False for x in d['sources'].values())
          print('FINQUERY RESEARCH SHADOW CHECK PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: finquery-research-shadow
          path: /tmp/finquery-research-shadow/research-feed-status.json
          retention-days: 7
