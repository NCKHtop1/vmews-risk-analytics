name: FinQuery system contract audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/system_contract_audit.py'
      - 'scripts/system_contract_audit_test.py'
      - '.github/workflows/system-contract-audit.yml'
  schedule:
    - cron: '10,40 2-8 * * 1-5'
    - cron: '20 9 * * 1-5'
  workflow_run:
    workflows:
      - Deploy VMEWS Pages
      - Refresh live HOSE Core + Liquid prices
      - Refresh live HOSE minute candles
      - Refresh market news stream
      - Refresh FinQuery macro snapshot
      - Refresh FinQuery market universe
      - Refresh financial reports for CDN
      - Refresh investment insights
      - SoluTION.AI independent live prices
      - SoluTION.AI independent core forecast
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finquery-system-contract-audit
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit-test system contract logic
        working-directory: scripts
        run: python system_contract_audit_test.py

      - uses: actions/checkout@v4
        with:
          ref: financial-market-data
          path: _market-data
          sparse-checkout: market

      - uses: actions/checkout@v4
        with:
          ref: financial-report-data
          path: _financial-data
          sparse-checkout: data

      - uses: actions/checkout@v4
        with:
          ref: financial-insights-data
          path: _insight-data
          sparse-checkout: data

      - uses: actions/checkout@v4
        with:
          ref: solution-ai-live-data
          path: _solution-live
          sparse-checkout: solution-ai

      - uses: actions/checkout@v4
        with:
          ref: solution-ai-core-data
          path: _solution-core
          sparse-checkout: data

      - name: Recompute all production data contracts
        run: |
          python scripts/system_contract_audit.py \
            --market-dir _market-data/market \
            --financial-dir _financial-data/data \
            --insights-dir _insight-data/data \
            --solution-live _solution-live/solution-ai/live.json \
            --solution-core-dir _solution-core/data \
            --repo-root . \
            --report-json /tmp/system-contract.json

      - name: Verify Pages generation after a Pages deployment
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Deploy VMEWS Pages' && github.event.workflow_run.conclusion == 'success'
        shell: bash
        env:
          EXPECTED_CODE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          token="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BASE='https://nckhtop1.github.io/vmews-risk-analytics/financial-report'
          curl -fsSL --max-time 20 "$BASE/deployment.json?contract=$token" -o /tmp/deployment.json
          curl -fsSL --max-time 20 "$BASE/market/quotes.json?contract=$token" -o /tmp/public-quotes.json
          curl -fsSL --max-time 20 "$BASE/market/strategy-indicators.json?contract=$token" -o /tmp/public-strategy.json
          curl -fsSL --max-time 20 "$BASE/market/risk-monitor.json?contract=$token" -o /tmp/public-risk.json
          EXPECTED_CODE_SHA="$EXPECTED_CODE_SHA" python - <<'PY'
          import json,os,re
          d=json.load(open('/tmp/deployment.json'))
          expected=os.environ['EXPECTED_CODE_SHA']
          assert d.get('code')==expected,(d.get('code'),expected)
          for key in ('financialData','insightData','marketData'):
              assert re.fullmatch(r'[0-9a-f]{40}',str(d.get(key) or '')),(key,d.get(key))
          q=json.load(open('/tmp/public-quotes.json'))
          s=json.load(open('/tmp/public-strategy.json'))
          r=json.load(open('/tmp/public-risk.json'))
          source=q.get('latestSourceTime')
          assert source and s.get('sourceTime')==source and r.get('sourceTime')==source,(source,s.get('sourceTime'),r.get('sourceTime'))
          assert r.get('inputSignature'),r.get('version')
          print({'productionDeployment':'PASS','code':d.get('code'),'marketSourceTime':source,'riskCoverage':(r.get('coverage') or {}).get('quotes')})
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finquery-system-contract
          path: /tmp/system-contract.json
          retention-days: 7
