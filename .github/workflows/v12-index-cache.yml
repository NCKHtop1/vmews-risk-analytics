name: V12 VNINDEX benchmark cache
on:
  workflow_dispatch:
  push:
    branches: [forecast-v12-methodfix]
    paths:
      - 'scripts/build_vnindex_cache_v12.py'
      - '.github/workflows/v12-index-cache.yml'
      - 'v12-index-trigger.txt'
permissions:
  contents: write
concurrency:
  group: vmews-v12-index-cache
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V12_MIN_ROWS: '520'
      V12_VNSTOCK_INTERVAL: '3.25'
      V12_MAX_RAW_RETURN_GUARD: '0.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip', cache-dependency-path: requirements-v12.txt}
      - run: pip install --disable-pip-version-check -q -r requirements-v12.txt
      - name: Build and validate VNINDEX snapshot
        run: PYTHONPATH=scripts python scripts/build_vnindex_cache_v12.py
      - name: Validate cache contract
        run: |
          python - <<'PY'
          import json
          z=json.load(open('data/vnindex-v12.json',encoding='utf-8'));s=z['summary'];assert z['version'].startswith('VMEWS-VNINDEX-CACHE-12');assert s['rows']>=520;assert s['duplicateDates']==0;assert s['maxAbsLogJump']<=.12;print('VNINDEX CACHE CONTRACT PASS',s,z['sourceAudit'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-vnindex-cache-${{ github.run_id }}
          retention-days: 30
          path: data/vnindex-v12.json
      - name: Persist audited benchmark cache
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vnindex-v12.json
          git commit -m 'Publish audited VNINDEX benchmark cache [v12-index-data]'
          git pull --rebase origin forecast-v12-methodfix
          git push origin HEAD:forecast-v12-methodfix
