name: V11 canonical risk sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v11-canonical-risk-sync.yml'
permissions:
  contents: write
concurrency:
  group: v11-canonical-risk-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore canonical VMEWS 4.2 market scan
        run: |
          git show 52d0124f0e87e00ba42a06859770bd6b28dcf5a1:data/market-scan.json > data/market-scan.json
          python - <<'PY'
          import json
          z=json.load(open('data/market-scan.json',encoding='utf-8'))
          assert z['version']=='VMEWS-MARKET-SCAN-4.2.0',z['version']
          assert z['thresholds']['canonicalPolicy']=='VMEWS-ALERT-POLICY-4.0.0'
          assert len(z.get('monitorUniverse') or [])>=200
          print('CANONICAL MARKET SCAN PASS',z['version'],z['modelDate'],len(z.get('monitorUniverse') or []))
          PY
      - name: Rebuild V11 dashboard against canonical risk scan
        run: |
          pip install -q numpy
          python scripts/build_dashboard_v11.py
          python - <<'PY'
          import json
          d=json.load(open('data/forecast-dashboard-v11.json',encoding='utf-8'))
          assert d['modelVersion']=='VMEWS-FORECAST-11.0.0'
          assert d['counts']['symbols']>=380,d['counts']
          assert d['canonicalRiskCoverage']>=220,d['canonicalRiskCoverage']
          assert all(float(x.get('liquidity30',0))>=500_000_000 for x in d['lists']['yellow'])
          assert all(float(x.get('liquidity30',0))>=500_000_000 for x in d['lists']['red'])
          print('V11 DASHBOARD CANONICAL RISK PASS',d['counts'],d['canonicalRiskCoverage'])
          PY
      - name: Use mutable main data endpoint from immutable CDN shell
        run: |
          sed -i 's#https://cdn.githubraw.com/NCKHtop1/vmews-risk-analytics/main#https://raw.githubusercontent.com/NCKHtop1/vmews-risk-analytics/main#g' forecast-final-v11.js
          node --check forecast-final-v11.js
          grep -q 'https://raw.githubusercontent.com/NCKHtop1/vmews-risk-analytics/main' forecast-final-v11.js
      - name: Validate original VMEWS live governance remains intact
        run: |
          node --check research-live-v6.js
          node --check research-honesty-v4.js
          node --check research-pooled-v5.js
          node --check research-app.js
          python - <<'PY'
          import json,pathlib
          h=open('research-final.html',encoding='utf-8').read()
          m=json.load(open('data/market-scan.json',encoding='utf-8'))
          p=json.load(open('data/pooled-hose/current-scores.json',encoding='utf-8'))
          t=json.load(open('data/live-track/track-record.json',encoding='utf-8'))
          q=json.load(open('data/live-track/integrity.json',encoding='utf-8'))
          assert 'VMEWS-LIVE-6.0-' in h
          assert m['version']=='VMEWS-MARKET-SCAN-4.2.0'
          assert m['modelDate']==p['modelAsOf']==q['marketModelDate']==q['pooledModelDate'],(m['modelDate'],p['modelAsOf'],q)
          assert q['status']=='PASS' and q['sameCompletedEod'] is True and q['marketContextImputed'] is False
          assert t['version']=='VMEWS-LIVE-MONITOR-1.0.0' and t['archivedSnapshots']>=1
          snap=pathlib.Path(f"data/live-track/snapshots/{m['modelDate']}.json")
          assert snap.exists(),snap
          print('ORIGINAL VMEWS GOVERNANCE PASS',m['modelDate'])
          PY
      - name: Persist canonical risk, V11 dashboard and live data source
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/market-scan.json data/forecast-dashboard-v11.json forecast-final-v11.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize V11 canonical risk and live data source [v11-risk-sync]'
          git pull --rebase origin main
          git push origin HEAD:main
