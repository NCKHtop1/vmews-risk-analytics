name: Forecast V12 immutable CDN smoke

on:
  pull_request:
    paths:
      - 'forecast-final.html'
      - 'forecast-final-v12.js'
      - 'forecast-live-leaders-v14.js'
      - 'data/forecast-model-v12.json'
      - 'data/forecast-dashboard-v12.json'
      - 'data/forecast-market-v13.json'
      - 'data/release-audit-v20.json'
      - 'data/phase-gates-v12.json'
      - 'scripts/forecast_v18_frontend_runtime_test.mjs'
      - '.github/workflows/forecast-v12-cdn-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'forecast-final.html'
      - 'forecast-final-v12.js'
      - 'forecast-live-leaders-v14.js'
      - 'data/forecast-model-v12.json'
      - 'data/forecast-dashboard-v12.json'
      - 'data/forecast-market-v13.json'
      - 'data/release-audit-v20.json'
      - 'data/phase-gates-v12.json'
      - 'scripts/forecast_v18_frontend_runtime_test.mjs'
      - '.github/workflows/forecast-v12-cdn-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wait for immutable CDN edge
        run: sleep 10
      - name: Verify immutable CDN assets and production contracts
        env:
          ROOT: https://cdn.githubraw.com/NCKHtop1/vmews-risk-analytics/${{ github.sha }}
        run: |
          set -euo pipefail
          for f in forecast-final.html forecast-final-v12.js forecast-live-leaders-v14.js data/forecast-model-v12.json data/forecast-dashboard-v12.json data/forecast-market-v13.json data/release-audit-v20.json data/phase-gates-v12.json; do
            curl --fail --silent --show-error --retry 7 --retry-delay 4 "$ROOT/$f" -o "/tmp/$(basename "$f")"
          done
          grep -Fq '<title>SoluTION.AI define market. · Dự báo cổ phiếu HOSE</title>' /tmp/forecast-final.html
          grep -q 'forecast-final-v12.js' /tmp/forecast-final.html
          grep -q 'priceValidated' /tmp/forecast-final-v12.js
          grep -q 'directionValidated' /tmp/forecast-final-v12.js
          node --check /tmp/forecast-live-leaders-v14.js
          grep -Fq '__VMEWS_BUILD_LEADERBOARD__' /tmp/forecast-live-leaders-v14.js
          grep -Fq 'CDN_PATH[2]' /tmp/forecast-final-v12.js
          ! grep -Fq '/main/data' /tmp/forecast-final-v12.js
          ! grep -q 'vmews-risk-analytics-sojd.vercel.app' /tmp/forecast-final-v12.js
          python - <<'PY'
          import json
          g=json.load(open('/tmp/phase-gates-v12.json'))
          m=json.load(open('/tmp/forecast-model-v12.json'))
          d=json.load(open('/tmp/forecast-dashboard-v12.json'))
          market=json.load(open('/tmp/forecast-market-v13.json'))
          release=json.load(open('/tmp/release-audit-v20.json'))
          assert g['status']=='PASS',g
          assert g.get('failed')==0,g
          assert m['promotion']['status']=='PASS',m['promotion']
          assert len(d.get('symbols',{}))==403,len(d.get('symbols',{}))
          assert market.get('version')=='VMEWS-MARKET-FORECAST-39.0.0',market.get('version')
          assert d.get('modelVersion')==market.get('version'),d.get('modelVersion')
          p=market['model']['promotion']
          promoted={int(value) for value in p.get('directPriceHorizons') or []}
          review={int(value) for value in p.get('reviewHorizons') or []}
          assert p.get('status')=='PASS',p
          assert len(promoted)>=3,p
          assert promoted | review == set(range(1,6)),p
          assert promoted.isdisjoint(review),p
          assert int(p.get('preferredRankingHorizon') or 0) in promoted,p
          assert release.get('status')=='PASS',release
          assert release.get('version') in {'VMEWS-RELEASE-AUDIT-20.1.0','VMEWS-RELEASE-AUDIT-20.2.0'},release.get('version')
          assert not release.get('blockers'),release.get('blockers')
          assert not release.get('warnings'),release.get('warnings')
          assert release.get('price',{}).get('crossSource',{}).get('status')=='PASS',release.get('price')
          for h in map(str,range(1,6)):
              z=market['model']['horizons'][h]
              price_pass=z.get('priceStatus')=='PASS'
              assert price_pass == (int(h) in promoted),(h,z.get('priceStatus'),promoted)
              assert (not price_pass) == (int(h) in review),(h,z.get('priceStatus'),review)
              if price_pass:
                  assert z.get('walkForwardAudit',{}).get('status')=='PASS',h
              assert z.get('magnitudeGate',{}).get('status')=='PASS',h
              assert z.get('magnitudeGate',{}).get('invalidExecutableQuotes')==0,h
          print('V39 IMMUTABLE CDN CONTRACT PASS',market['version'],'symbols',len(d['symbols']))
          PY
      - name: Verify browser runtime contracts
        run: node --test scripts/forecast_v18_frontend_runtime_test.mjs
