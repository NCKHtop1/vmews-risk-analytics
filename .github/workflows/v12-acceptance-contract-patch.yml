name: V12 acceptance contract patch
on:
  push:
    branches: [forecast-v12-methodfix]
    paths: ['.github/workflows/v12-acceptance-contract-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add active-flow governance to Phase 4
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/v12_acceptance.py');s=p.read_text(encoding='utf-8')
          changes=[
          ("flowdb=load('flow-v12.json',4);flowaudit=load('flow-audit-v12.json',4)",
           "flowdb=load('flow-v12.json',4);flowaudit=load('flow-audit-v12.json',4);activeaudit=load('active-flow-audit-v12.json',4)"),
          ("(4,'flow-v12.json',flowdb),(4,'flow-audit-v12.json',flowaudit)]",
           "(4,'flow-v12.json',flowdb),(4,'flow-audit-v12.json',flowaudit),(4,'active-flow-audit-v12.json',activeaudit)]"),
          ("regime_req=['breadth1'",
           "active_like=[x for x in features if any(k in x.lower() for k in ['activebuy','activesell','aggressor','unmatchedbuy','unmatchedsell','difvolumebuysell'])];active_cert=activeaudit.get('certified') is True and activeaudit.get('numericalFeaturesEnabled') is True;active_abstain=activeaudit.get('status')=='ABSTAIN' and activeaudit.get('certified') is False and activeaudit.get('numericalFeaturesEnabled') is False and not active_like;check(4,'active/aggressor flow is either PIT-certified or explicit ABSTAIN',active_cert or active_abstain,{'audit':activeaudit,'activeFeatures':active_like});regime_req=['breadth1'"),
          ("'version':'VMEWS-PHASE-GATES-12.5.0'","'version':'VMEWS-PHASE-GATES-12.6.0'")]
          for old,new in changes:
              if old not in s:raise SystemExit(f'PATCH TARGET NOT FOUND: {old[:160]}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8');compile(s,'scripts/v12_acceptance.py','exec');print('V12 ACTIVE-FLOW PHASE4 CONTRACT PASS')
          PY
      - name: Persist acceptance patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v12_acceptance.py
          git commit -m 'Gate Phase 4 on active-flow certification or explicit abstention'
          git pull --rebase origin forecast-v12-methodfix
          git push origin HEAD:forecast-v12-methodfix
