name: V12 certify committed frozen source
on:
  workflow_dispatch:
  push:
    branches: [forecast-v12-methodfix]
    paths: ['v12-certify-frozen-source-trigger.txt']
permissions:
  contents: write
concurrency:
  group: vmews-v12-certify-frozen-source
  cancel-in-progress: true
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Pin certification source
        run: echo "V12_CERT_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Recompute stronger source gates offline
        run: |
          python -m py_compile scripts/v12_certify_frozen_source.py scripts/v12_frozen_ca_cohort_audit.py
          python scripts/v12_frozen_ca_cohort_audit.py
          python scripts/v12_certify_frozen_source.py
      - name: Publish certified manifest only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin forecast-v12-methodfix
          test "$(git rev-parse origin/forecast-v12-methodfix)" = "$V12_CERT_SOURCE_SHA" || { echo 'BRANCH ADVANCED; refusing stale certification'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v12-frozen-source-manifest.json data/v12-frozen-ca-cohort-audit.json
          git commit -m 'Certify immutable V12 source on original-deep CA cohort [no-full]'
          git push origin HEAD:forecast-v12-methodfix
