name: FinQuery Strategy Intelligence CI

on:
  pull_request:
    paths:
      - 'financial-report/frontend/strategy-*.js'
      - 'financial-report/frontend/alert-center.js'
      - 'financial-report/frontend/research-agent.js'
      - 'financial-report/frontend/index.html'
      - 'financial-report/frontend/market.css'
      - 'financial-report/scripts/test_strategy_intelligence.cjs'
      - '.github/workflows/strategy-intelligence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strategy-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check financial-report/frontend/strategy-engine.js
          node --check financial-report/frontend/strategy-intelligence-core.js
          node --check financial-report/frontend/strategy-intelligence.js
          node --check financial-report/frontend/alert-center.js
          node --check financial-report/frontend/research-agent.js
      - name: Core regression tests
        run: node financial-report/scripts/test_strategy_intelligence.cjs
      - name: HTML integration contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('financial-report/frontend/index.html','utf8');
          for(const token of [
            'AI Strategy Agent',
            'strategy-intelligence-core.js',
            'strategy-intelligence.js',
            'sai-top-strategies',
            'sai-opportunities',
            'sai-investment-view',
            'Strategy Builder & Screener'
          ]){
            if(!html.includes(token))throw new Error('Missing Strategy Agent integration token: '+token);
          }
          const coreIndex=html.indexOf('strategy-intelligence-core.js');
          const uiIndex=html.indexOf('strategy-intelligence.js');
          const engineIndex=html.indexOf('strategy-engine.js');
          if(!(engineIndex<coreIndex&&coreIndex<uiIndex))throw new Error('Strategy script load order invalid');
          console.log('Strategy Agent HTML contract OK');
          NODE
