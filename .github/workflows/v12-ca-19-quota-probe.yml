name: V12 CA 19 quota-safe probe
on:
  push:
    branches: [tmp-v12-detached-do-not-use]
    paths:
      - 'v12-ca-19-quota-probe-trigger.txt'
permissions:
  contents: write
  actions: read
concurrency:
  group: vmews-v12-ca-19-quota-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      V12_MIN_ROWS: '520'
      V12_VNSTOCK_INTERVAL: '6.50'
      V12_MAX_RAW_RETURN_GUARD: '0.12'
      V12_CROSS_SOURCE_MAD_LIMIT: '0.003'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-v12.txt
      - run: pip install --disable-pip-version-check -q -r requirements-v12.txt
      - name: Compile exact production capture and quota probe
        run: python -m py_compile scripts/v12_data_sources.py scripts/v12_corporate_actions.py scripts/v12_source_capture.py scripts/v12_source_capture_methodfix.py scripts/v12_reference_resilience.py scripts/v12_ca_19_quota_probe.py
      - name: Preserve unchanged CA regressions
        run: PYTHONPATH=scripts python scripts/v12_corporate_actions_test.py
      - name: Probe 19 unresolved original-deep symbols
        run: PYTHONPATH=scripts python scripts/v12_ca_19_quota_probe.py
      - name: Persist exact diagnostic on staging branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v12-ca-19-quota-probe.json
          git commit -m 'Publish staging CA 19 quota probe result [no-full]'
          git push origin HEAD:tmp-v12-detached-do-not-use
      - name: Upload exact per-symbol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-ca-19-quota-probe-${{ github.run_id }}
          path: data/v12-ca-19-quota-probe.json
          if-no-files-found: error
          retention-days: 7
