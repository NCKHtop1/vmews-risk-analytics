name: Market realtime freshness guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'financial-report/**'
      - '.github/workflows/market-*.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/solution-ai-*.yml'
  schedule:
    # Lightweight heartbeat. GitHub can delay/drop individual cron events, so
    # a 5-minute guard gives several chances to recover before news exceeds 20m.
    - cron: '*/5 * * * *'
  workflow_run:
    # A second independent recovery chain: when either the live-intelligence
    # job or the generic FinQuery market watchdog finishes, re-check the
    # published snapshots. Fresh data is a no-op; stale data is re-dispatched.
    workflows:
      - Refresh FinQuery prices and company news
      - Refresh market news stream
      - Refresh live HOSE Core + Liquid prices
      - Refresh live HOSE minute candles
      - SoluTION.AI independent live prices
      - Deploy VMEWS Pages
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: market-realtime-freshness-recovery
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Detect stale snapshots and restart their publishers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, math, os, subprocess, urllib.request
          from datetime import datetime, timezone, timedelta
          now=datetime.now(timezone.utc)
          local=now.astimezone(timezone(timedelta(hours=7)))
          mins=local.hour*60+local.minute
          active=local.weekday()<5 and (540<=mins<=690 or 775<=mins<=915)
          base='https://raw.githubusercontent.com/'+os.environ['GH_REPO']+'/financial-market-data/market/'
          def get(file):
              with urllib.request.urlopen(base+file+'?guard='+str(int(now.timestamp())),timeout=15) as r:
                  return json.load(r)
          def age(value):
              t=datetime.fromisoformat(str(value).replace('Z','+00:00'))
              if t.tzinfo is None: raise ValueError('Timestamp has no timezone')
              minutes=(now-t).total_seconds()/60
              if minutes < -5: raise ValueError('Future timestamp')
              return minutes
          def trigger(workflow):
              # Never cancel a collector that is already running or queued.
              raw=subprocess.check_output(['gh','api',f'repos/{os.environ["GH_REPO"]}/actions/workflows/{workflow}/runs?per_page=10'],text=True)
              runs=json.loads(raw).get('workflow_runs',[])
              if any(r.get('status') in ('queued','in_progress','waiting','pending','requested') for r in runs):
                  print(workflow, 'already active'); return
              subprocess.run(['gh','workflow','run',workflow,'--ref','main'],check=True)
              print('Recovery dispatched:',workflow)
          stale=[]
          try:
              n=get('news-latest.json')
              company=get('news-company-latest.json')
              stories=get('news-stories.json')
              semantic=get('news-semantic-health.json')
              if n.get('status')!='ok' or not n.get('items') or age(n.get('checkedAt'))>20:
                  raise ValueError('News older than 20 minutes or unavailable')
              if company.get('status')!='ok' or company.get('selection')!='per_symbol_latest' or not company.get('items') or not company.get('companyCounts'):
                  raise ValueError(f'Company news index invalid: coverage={company.get("companyCoverage")} items={len(company.get("items") or [])}')
              if str(company.get('checkedAt'))!=str(n.get('checkedAt')) or age(company.get('checkedAt'))>20:
                  raise ValueError('Company news index stale or not aligned with latest news')
              if n.get('newsIntelligenceVersion')!='v2':
                  raise ValueError('News Intelligence V2 marker missing')
              if stories.get('status')!='ok' or int(stories.get('storyCount') or 0)<=0:
                  raise ValueError(f'News story index invalid: {stories.get("status")} / {stories.get("storyCount")}')
              if int(semantic.get('criticalViolations') or 0)!=0:
                  raise ValueError(f'News semantic gate failed: {semantic.get("violations")}')
              if str(semantic.get('checkedAt') or '')!=str(n.get('checkedAt') or ''):
                  raise ValueError('Semantic health snapshot not aligned with news heartbeat')
              health=n.get('sourceHealth') or {}
              if int(health.get('healthy') or 0)<3:
                  raise ValueError(f'News source health too low: {health}')
              luat=n.get('luatVietnamDirect') or {}
              if int(luat.get('expectedParsers') or 0)!=4 or int(luat.get('parserHealthy') or 0)<3:
                  raise ValueError(f'LuatVietnam direct parser health insufficient: {luat}')
              if luat.get('status')!='ok':
                  raise ValueError(f'LuatVietnam direct source degraded/unavailable: {luat}')
              source_map={str(x.get('name') or ''):x for x in (n.get('sources') or [])}
              live24=source_map.get('24HMoney Live') or {}
              symbol24=source_map.get('24HMoney Symbol') or {}
              if live24.get('status')=='error':
                  raise ValueError(f'24HMoney Live parser/source degraded: {live24}')
              if live24.get('parser')!='24hmoney-live-v3':
                  raise ValueError(f'24HMoney Live parser version invalid: {live24.get("parser")}')
              if int(live24.get('articleAnchors') or 0)>0 and int(live24.get('items') or 0)==0:
                  raise ValueError(f'24HMoney Live has current article anchors but parsed 0 items: {live24}')
              if symbol24.get('status')=='error':
                  raise ValueError(f'24HMoney Symbol parser/source degraded: {symbol24}')
              if symbol24.get('parser')!='24hmoney-symbol-v5':
                  raise ValueError(f'24HMoney Symbol parser version invalid: {symbol24.get("parser")}')
              attempted=max(1,int(symbol24.get('symbolsAttempted') or 0))
              reachable=int(symbol24.get('symbolsReachable') or 0)
              if reachable < math.ceil(attempted*.70):
                  raise ValueError(f'24HMoney Symbol reachability too low: {reachable}/{attempted}')
              print('News age/coverage:',round(age(n['checkedAt']),1),'company symbols',company.get('companyCoverage'),'source health',health,'luat',luat,'24hmoney',{k:(source_map.get(k) or {}).get('items') for k in ('24HMoney Live','24HMoney Symbol')})
          except Exception as e:
              print('::warning::News freshness:',e); stale.append('market-news-live.yml')
          if active:
              try:
                  intraday=get('intraday-status.json')
                  expected_i=max(1,int(intraday.get('expected') or 0))
                  required_i=max(1,int(intraday.get('required') or math.ceil(expected_i*.90)))
                  success_i=int(intraday.get('success') or 0)
                  session_expected=int(intraday.get('sessionExpected') or 0)
                  session_required=int(intraday.get('sessionRequired') or (math.ceil(session_expected*.90) if session_expected else 0))
                  session_fresh=int(intraday.get('sessionFresh') if intraday.get('sessionFresh') is not None else success_i)
                  session_bad=session_expected>0 and session_fresh<session_required
                  if intraday.get('status')!='ok' or success_i<required_i or session_bad or age(intraday.get('checkedAt'))>20:
                      raise ValueError(f'intraday stale/partial: fetch={success_i}/{expected_i}, session={session_fresh}/{session_expected}, required={session_required}')
                  print('Intraday age/coverage:',round(age(intraday['checkedAt']),1),f'fetch {success_i}/{expected_i}',f'session {session_fresh}/{session_expected}')
              except Exception as e:
                  print('::warning::Intraday freshness:',e); stale.append('market-intraday-live.yml')
              try:
                  q=get('quotes.json')
                  s=get('technical-signals.json')
                  strategy=get('strategy-indicators.json')
                  risk=get('risk-monitor.json')
                  market_cal=get('market-risk-calibration.json')
                  w=get('watch-today.json')
                  drivers=get('drivers.json')
                  ps=get('prices-status.json')
                  expected=max(1,int(q.get('expected') or 0))
                  fresh=[v for v in q.get('quotes',{}).values() if v.get('status')!='retained' and age(v.get('sourceTime') or v.get('collectedAt'))<=18]
                  if q.get('status')!='ok' or len(fresh)<math.ceil(expected*.90):
                      raise ValueError(f'Fresh quotes below 90%: {len(fresh)}/{expected}')
                  if age(q.get('checkedAt'))>10 or age(q.get('latestSourceTime'))>18:
                      raise ValueError('Quote publisher heartbeat/sourceTime is stale')
                  for label,d in [('scanner',s),('strategy',strategy),('watch',w)]:
                      if d.get('status')!='ok' or age(d.get('checkedAt'))>10 or d.get('sourceTime')!=q.get('latestSourceTime'):
                          raise ValueError(label+' stale or not aligned with quotes')
                  scanner_rows=s.get('symbols') or {}
                  watch_items=w.get('items') or []
                  for item in watch_items:
                      symbol=str(item.get('symbol') or '').upper()
                      row=scanner_rows.get(symbol) or {}
                      if not symbol or row.get('cadence')!='LIVE_15M':
                          raise ValueError(f'watch item {symbol or "<missing>"} is absent from current live scanner')
                      if str(item.get('barDate') or '')!=str(row.get('barDate') or ''):
                          raise ValueError(f'watch/scanner barDate mismatch for {symbol}')
                      if item.get('bias')!=row.get('bias'):
                          raise ValueError(f'watch/scanner bias mismatch for {symbol}: {item.get("bias")} != {row.get("bias")}')
                      for field in ('rsi14','volumeRatio20'):
                          watch_value=item.get(field)
                          scanner_value=row.get(field)
                          expected_value=round(float(scanner_value),2) if isinstance(scanner_value,(int,float)) else scanner_value
                          if watch_value!=expected_value:
                              raise ValueError(f'watch/scanner {field} mismatch for {symbol}: {watch_value} != {expected_value}')
                  today=local.date().isoformat()
                  fresh_symbols={str(v.get('symbol') or '').upper() for v in fresh if v.get('symbol')}
                  required_today=max(1,math.ceil(len(fresh_symbols)*.90))
                  scanner_today=sum(1 for symbol in fresh_symbols if str(((s.get('symbols') or {}).get(symbol) or {}).get('barDate') or '')==today)
                  strategy_today=sum(1 for symbol in fresh_symbols if str(((strategy.get('symbols') or {}).get(symbol) or {}).get('barDate') or '')==today)
                  if scanner_today<required_today:
                      raise ValueError(f'scanner live barDate coverage below 90%: {scanner_today}/{len(fresh_symbols)} for {today}')
                  if strategy_today<required_today:
                      raise ValueError(f'strategy live barDate coverage below 90%: {strategy_today}/{len(fresh_symbols)} for {today}')
                  risk_cov=risk.get('coverage') or {}
                  risk_score=(risk.get('overall') or {}).get('score')
                  if risk.get('status')!='ok' or age(risk.get('generatedAt'))>10 or risk.get('sourceTime')!=q.get('latestSourceTime'):
                      raise ValueError('risk monitor stale or not aligned with quotes')
                  if int(risk_cov.get('quotes') or 0)<math.ceil(expected*.90) or not isinstance(risk_score,(int,float)) or not 0<=risk_score<=100:
                      raise ValueError(f'risk monitor invalid: coverage={risk_cov} score={risk_score}')
                  if str(risk.get('methodVersion') or '')!='FINQUERY-RISK-RULES-2.0':
                      raise ValueError(f"unexpected risk method version: {risk.get('methodVersion')}")
                  if market_cal.get('status')!='ok' or market_cal.get('forSession')!=str(risk.get('sourceDate') or ''):
                      raise ValueError(f'market risk calibration unavailable/stale: {market_cal.get("status")} {market_cal.get("forSession")}')
                  high=next((x for x in ((market_cal.get('backtest') or {}).get('thresholds') or []) if int(x.get('threshold') or 0)==85),None)
                  if not high or not bool((market_cal.get('backtest') or {}).get('stateValidated')) or int(high.get('signals') or 0)<12 or not (0.05<=float(high.get('signalRate') or 0)<=0.25) or float(high.get('currentStateGapPct') or 0)>-0.40:
                      raise ValueError(f'market risk backtest gate failed: {high}')
                  groups=risk.get('breadthGroups') or {}
                  if sum(len(groups.get(k) or []) for k in ('advancing','declining','unchanged'))!=int(risk_cov.get('quotes') or 0):
                      raise ValueError('risk breadth drilldown coverage incomplete')
                  if not all('advancePct' in x and 'declinePct' in x and isinstance(x.get('memberRows'),list) for x in (risk.get('sectors') or [])):
                      raise ValueError('bidirectional sector heatmap contract incomplete')
                  funds=risk.get('fundMonitor') or {}
                  if funds.get('status')!='ok' or funds.get('source')!='FMARKET' or int(funds.get('symbols') or 0)<=0:
                      raise ValueError(f'fund holdings context unavailable: {funds.get("status")} {funds.get("source")}')
                  if funds.get('previousAsOf') and funds.get('comparisonMode')!='LAST_MEANINGFUL_HOLDING_CHANGE':
                      raise ValueError(f'fund comparison mode invalid: {funds.get("comparisonMode")}')
                  if len(risk.get('timeline') or [])<2 or (risk.get('trend') or {}).get('previousScore') is None:
                      raise ValueError('risk monitor comparison history is incomplete')
                  if len(risk.get('contributions') or [])!=5:
                      raise ValueError('risk monitor contribution breakdown is incomplete')
                  cal=risk.get('sectorCalibration') or {}
                  if cal.get('status')!='ok' or int(cal.get('totalSectors') or 0)<8:
                      raise ValueError(f'sector calibration unavailable: {cal}')
                  if not all('threshold' in x and 'alertEligible' in x and isinstance(x.get('memberRows'),list) for x in (risk.get('sectors') or [])):
                      raise ValueError('sector heatmap contract incomplete')
                  if ps.get('status')!='ok' or age(ps.get('checkedAt'))>10 or ps.get('latestSourceTime')!=q.get('latestSourceTime'):
                      raise ValueError('prices-status stale or not aligned with quotes')
                  driver_symbols=drivers.get('symbols') or {}
                  if age(drivers.get('generatedAt'))>10 or len(driver_symbols)<math.ceil(expected*.90):
                      raise ValueError(f'drivers stale/incomplete: {len(driver_symbols)}/{expected}')
                  print('Market pipeline freshness OK',{
                      'quotes':len(fresh),'expected':expected,
                      'sourceTime':q.get('latestSourceTime'),
                      'scanner':s.get('coverage'),'strategy':strategy.get('coverage'),
                      'scannerToday':scanner_today,'strategyToday':strategy_today,
                      'watch':len(w.get('items') or []),'risk':risk_score,'drivers':len(driver_symbols)
                  })
              except Exception as e:
                  print('::warning::Market freshness:',e); stale.append('market-price-live.yml')
          # SoluTION.AI has a dedicated data branch, but GitHub cron can be
          # delayed or dropped. Reuse this proven market guard as an independent
          # recovery path and validate the real market source timestamp, not
          # merely the snapshot generation timestamp.
          try:
              solution_url='https://raw.githubusercontent.com/'+os.environ['GH_REPO']+'/solution-ai-live-data/solution-ai/live.json?guard='+str(int(now.timestamp()))
              with urllib.request.urlopen(solution_url,timeout=15) as r:
                  sol=json.load(r)
              generated=datetime.fromisoformat(str(sol.get('generatedAt') or '').replace('Z','+00:00')).astimezone(timezone.utc)
              source=datetime.fromisoformat(str(sol.get('sourceTime') or '').replace('Z','+00:00')).astimezone(timezone.utc)
              generated_age=(now-generated).total_seconds()/60
              source_age=(now-source).total_seconds()/60
              source_day=source.astimezone(timezone(timedelta(hours=7))).date()
              sol_active=local.weekday()<5 and ((8*60+55)<=mins<=(11*60+40) or (12*60+55)<=mins<=(15*60+10))
              base_ok=(sol.get('scope')=='solution-ai' and sol.get('status')=='ok' and int(sol.get('coverage') or 0)>=500 and -5<=generated_age and -5<=source_age and source<=generated+timedelta(minutes=5))
              if sol_active:
                  sol_fresh=base_ok and generated_age<=6 and source_age<=25 and source_day==local.date()
                  sol_policy='LIVE'
              elif local.weekday()<5 and mins>=11*60+40:
                  sol_fresh=base_ok and source_day==local.date()
                  sol_policy='SAME_DAY_SESSION'
              else:
                  sol_fresh=base_ok and source_age<=96*60
                  sol_policy='LAST_COMPLETED_SESSION'
              if not sol_fresh:
                  raise ValueError(f'SoluTION live stale: policy={sol_policy} generatedAge={generated_age:.1f}m sourceAge={source_age:.1f}m sourceDay={source_day} coverage={sol.get("coverage")}')
              print('SoluTION live freshness OK',{'policy':sol_policy,'generatedAgeMin':round(generated_age,1),'sourceAgeMin':round(source_age,1),'coverage':sol.get('coverage')})
          except Exception as e:
              print('::warning::SoluTION live freshness:',e); stale.append('solution-ai-live-price.yml')

          for workflow in stale: trigger(workflow)
          if stale:
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('Stale data detected; recovery requested (completion is verified on the next guard run): '+', '.join(stale)+'\n')
          PY
