name: Market realtime freshness guard

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 2-8 * * 1-5'

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check latest market snapshot freshness
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://raw.githubusercontent.com/NCKHtop1/vmews-risk-analytics/financial-market-data/market/quotes.json'
          with urllib.request.urlopen(url, timeout=10) as r:
              data=json.load(r)
          print('Market snapshot checked:', data.get('checkedAt'))
          if data.get('status') != 'ok':
              raise SystemExit('Market snapshot status is not ok')
          PY
