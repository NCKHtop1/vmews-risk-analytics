name: Market realtime freshness guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'financial-report/**'
      - '.github/workflows/market-*.yml'
      - '.github/workflows/pages.yml'
  schedule:
    # Lightweight heartbeat. GitHub can delay/drop individual cron events, so
    # a 5-minute guard gives several chances to recover before news exceeds 20m.
    - cron: '*/5 * * * *'
  workflow_run:
    # A second independent recovery chain: when either the live-intelligence
    # job or the generic FinQuery market watchdog finishes, re-check the
    # published snapshots. Fresh data is a no-op; stale data is re-dispatched.
    workflows:
      - Refresh FinQuery prices and company news
      - Refresh market news stream
      - Refresh live HOSE Core + Liquid prices
      - Deploy VMEWS Pages
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: market-realtime-freshness-recovery
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Detect stale snapshots and restart their publishers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, math, os, subprocess, urllib.request
          from datetime import datetime, timezone, timedelta
          now=datetime.now(timezone.utc)
          local=now.astimezone(timezone(timedelta(hours=7)))
          mins=local.hour*60+local.minute
          active=local.weekday()<5 and (540<=mins<=690 or 775<=mins<=915)
          base='https://raw.githubusercontent.com/'+os.environ['GH_REPO']+'/financial-market-data/market/'
          def get(file):
              with urllib.request.urlopen(base+file+'?guard='+str(int(now.timestamp())),timeout=15) as r:
                  return json.load(r)
          def age(value):
              t=datetime.fromisoformat(str(value).replace('Z','+00:00'))
              if t.tzinfo is None: raise ValueError('Timestamp has no timezone')
              minutes=(now-t).total_seconds()/60
              if minutes < -5: raise ValueError('Future timestamp')
              return minutes
          def trigger(workflow):
              # Never cancel a collector that is already running or queued.
              raw=subprocess.check_output(['gh','api',f'repos/{os.environ["GH_REPO"]}/actions/workflows/{workflow}/runs?per_page=10'],text=True)
              runs=json.loads(raw).get('workflow_runs',[])
              if any(r.get('status') in ('queued','in_progress','waiting','pending','requested') for r in runs):
                  print(workflow, 'already active'); return
              subprocess.run(['gh','workflow','run',workflow,'--ref','main'],check=True)
              print('Recovery dispatched:',workflow)
          stale=[]
          try:
              n=get('news.json')
              if n.get('status')!='ok' or not n.get('items') or age(n.get('checkedAt'))>20:
                  raise ValueError('News older than 20 minutes or unavailable')
              print('News age minutes:',round(age(n['checkedAt']),1))
          except Exception as e:
              print('::warning::News freshness:',e); stale.append('market-news-live.yml')
          if active:
              try:
                  q=get('quotes.json')
                  s=get('technical-signals.json')
                  strategy=get('strategy-indicators.json')
                  risk=get('risk-monitor.json')
                  w=get('watch-today.json')
                  drivers=get('drivers.json')
                  ps=get('prices-status.json')
                  expected=max(1,int(q.get('expected') or 0))
                  fresh=[v for v in q.get('quotes',{}).values() if v.get('status')!='retained' and age(v.get('sourceTime') or v.get('collectedAt'))<=18]
                  if q.get('status')!='ok' or len(fresh)<math.ceil(expected*.90):
                      raise ValueError(f'Fresh quotes below 90%: {len(fresh)}/{expected}')
                  if age(q.get('checkedAt'))>10 or age(q.get('latestSourceTime'))>18:
                      raise ValueError('Quote publisher heartbeat/sourceTime is stale')
                  for label,d in [('scanner',s),('strategy',strategy),('watch',w)]:
                      if d.get('status')!='ok' or age(d.get('checkedAt'))>10 or d.get('sourceTime')!=q.get('latestSourceTime'):
                          raise ValueError(label+' stale or not aligned with quotes')
                  today=local.date().isoformat()
                  fresh_symbols={str(v.get('symbol') or '').upper() for v in fresh if v.get('symbol')}
                  required_today=max(1,math.ceil(len(fresh_symbols)*.90))
                  scanner_today=sum(1 for symbol in fresh_symbols if str(((s.get('symbols') or {}).get(symbol) or {}).get('barDate') or '')==today)
                  strategy_today=sum(1 for symbol in fresh_symbols if str(((strategy.get('symbols') or {}).get(symbol) or {}).get('barDate') or '')==today)
                  if scanner_today<required_today:
                      raise ValueError(f'scanner live barDate coverage below 90%: {scanner_today}/{len(fresh_symbols)} for {today}')
                  if strategy_today<required_today:
                      raise ValueError(f'strategy live barDate coverage below 90%: {strategy_today}/{len(fresh_symbols)} for {today}')
                  risk_cov=risk.get('coverage') or {}
                  risk_score=(risk.get('overall') or {}).get('score')
                  if risk.get('status')!='ok' or age(risk.get('generatedAt'))>10 or risk.get('sourceTime')!=q.get('latestSourceTime'):
                      raise ValueError('risk monitor stale or not aligned with quotes')
                  if int(risk_cov.get('quotes') or 0)<math.ceil(expected*.90) or not isinstance(risk_score,(int,float)) or not 0<=risk_score<=100:
                      raise ValueError(f'risk monitor invalid: coverage={risk_cov} score={risk_score}')
                  if ps.get('status')!='ok' or age(ps.get('checkedAt'))>10 or ps.get('latestSourceTime')!=q.get('latestSourceTime'):
                      raise ValueError('prices-status stale or not aligned with quotes')
                  driver_symbols=drivers.get('symbols') or {}
                  if age(drivers.get('generatedAt'))>10 or len(driver_symbols)<math.ceil(expected*.90):
                      raise ValueError(f'drivers stale/incomplete: {len(driver_symbols)}/{expected}')
                  print('Market pipeline freshness OK',{
                      'quotes':len(fresh),'expected':expected,
                      'sourceTime':q.get('latestSourceTime'),
                      'scanner':s.get('coverage'),'strategy':strategy.get('coverage'),
                      'scannerToday':scanner_today,'strategyToday':strategy_today,
                      'watch':len(w.get('items') or []),'risk':risk_score,'drivers':len(driver_symbols)
                  })
              except Exception as e:
                  print('::warning::Market freshness:',e); stale.append('market-price-live.yml')
          for workflow in stale: trigger(workflow)
          if stale:
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('Stale data detected; recovery requested (completion is verified on the next guard run): '+', '.join(stale)+'\n')
          PY
