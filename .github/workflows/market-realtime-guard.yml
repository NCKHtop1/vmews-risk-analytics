name: Market realtime freshness guard

on:
  workflow_dispatch:
  schedule:
    # Run shortly after the dedicated price workflow.
    - cron: '10,25,40,55 2-8 * * 1-5'

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check latest market snapshot freshness
        run: |
          python - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone, timedelta

          VN=timezone(timedelta(hours=7))
          now=datetime.now(timezone.utc)
          local=now.astimezone(VN)
          minutes=local.hour*60+local.minute
          active=local.weekday()<5 and ((9*60<=minutes<=11*60+40) or (12*60+55<=minutes<=15*60+15))
          if not active:
              print('Outside VN live-session guard window:', local.isoformat())
              raise SystemExit(0)

          base='https://raw.githubusercontent.com/NCKHtop1/vmews-risk-analytics/financial-market-data/market/'
          with urllib.request.urlopen(base+'quotes.json', timeout=10) as r:
              data=json.load(r)
          with urllib.request.urlopen(base+'technical-signals.json', timeout=10) as r:
              scanner=json.load(r)

          coverage=int(data.get('coverage') or 0)
          latest=data.get('latestSourceTime')
          print('Market snapshot:', data.get('checkedAt'), 'status=',data.get('status'),'coverage=',coverage,'latest=',latest,'providers=',data.get('providers'))
          if data.get('status') != 'ok':
              raise SystemExit('Market snapshot status is not ok')
          if coverage < 90:
              raise SystemExit(f'Current-session coverage too low: {coverage}/100')
          if not latest:
              raise SystemExit('Missing latestSourceTime')

          stamp=datetime.fromisoformat(str(latest).replace('Z','+00:00')).astimezone(timezone.utc)
          if stamp.astimezone(VN).date()!=local.date():
              raise SystemExit(f'Market source is not from current VN session: {stamp.astimezone(VN).date()}')
          age=(now-stamp).total_seconds()/60
          if age>30:
              raise SystemExit(f'Market source is stale by {age:.1f} minutes')
          scan_coverage=int(scanner.get('coverage') or 0)
          scan_time=scanner.get('sourceTime')
          print('Technical scanner:',scanner.get('status'),'coverage=',scan_coverage,'matches=',scanner.get('matchCount'),'source=',scan_time)
          if scanner.get('status')!='ok' or scan_coverage<90:
              raise SystemExit(f'Technical scanner coverage too low: {scan_coverage}/100')
          if not scan_time or str(scan_time)!=str(latest):
              raise SystemExit(f'Technical scanner sourceTime does not match live market source: {scan_time} != {latest}')
          PY
