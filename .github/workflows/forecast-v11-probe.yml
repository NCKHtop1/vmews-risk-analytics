name: Forecast V11 data probe
on:
  push:
    branches: [forecast-v11-production]
    paths:
      - 'scripts/probe_v11_sources.py'
      - '.github/workflows/forecast-v11-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests beautifulsoup4 pandas lxml
      - run: python scripts/probe_v11_sources.py
