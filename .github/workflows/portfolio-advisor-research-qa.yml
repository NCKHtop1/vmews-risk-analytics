name: FinQuery Portfolio Advisor research QA
on:
  pull_request:
    paths:
      - 'financial-report/scripts/portfolio_advisor_*.cjs'
      - 'financial-report/scripts/build_portfolio_advisor.cjs'
      - 'financial-report/frontend/portfolio-advisor-*'
      - 'financial-report/frontend/strategy-engine.js'
      - 'financial-report/frontend/strategy-intelligence-core.js'
      - 'financial-report/frontend/portfolio-intelligence.js'
      - 'financial-report/frontend/index.html'
      - 'financial-report/scripts/build_cdn.py'
      - 'financial-report/tests/portfolio_advisor_research.test.cjs'
      - '.github/workflows/portfolio-advisor-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quant-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax and deterministic research gates
        run: |
          node --check financial-report/scripts/portfolio_advisor_core.cjs
          node --check financial-report/scripts/portfolio_advisor_proxy.cjs
          node --check financial-report/scripts/build_portfolio_advisor.cjs
          node --check financial-report/frontend/portfolio-advisor-ui.js
          node --check financial-report/frontend/strategy-engine.js
          node --check financial-report/frontend/strategy-intelligence-core.js
          node --test financial-report/tests/portfolio_advisor_research.test.cjs
          node --test financial-report/tests/portfolio_advisor_ui.test.cjs
      - name: Existing strategy and Portfolio regression
        run: |
          node financial-report/scripts/test_strategy_intelligence.cjs
          node --test financial-report/tests/strategy_engine.test.cjs
          node --test financial-report/tests/portfolio_rebalance.test.cjs
          node --test financial-report/tests/portfolio_intelligence.test.cjs
      - name: Portfolio bundling and no-order integrity
        run: |
          python financial-report/scripts/build_cdn.py
          grep -q "FINQUERY-PORTFOLIO-ADVISOR-UI-1.0" financial-report/index.html
          grep -q 'data-portfolio-tab="advisor"' financial-report/index.html
          ! grep -q 'src="portfolio-advisor-ui.js"' financial-report/index.html
