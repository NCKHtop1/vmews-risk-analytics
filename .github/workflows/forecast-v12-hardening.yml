name: Forecast V12 final-candidate hardening

on:
  workflow_dispatch:
  push:
    branches: [forecast-v12-hardening]
    paths:
      - 'scripts/v12_*.py'
      - 'scripts/v12_train_parts/**'
      - 'scripts/train_forecast_v12.py'
      - 'forecast-final-v12.js'
      - 'forecast-final.html'
      - 'requirements-v12.txt'
      - '.github/workflows/forecast-v12-hardening.yml'
      - 'v12-hardening-trigger.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: vmews-v12-hardening
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[v12-hard-data]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      V12_MIN_ROWS: '520'
      V12_VNSTOCK_INTERVAL: '3.15'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-v12.txt
      - name: Install V12 dependencies
        run: pip install --disable-pip-version-check -q -r requirements-v12.txt
      - name: Compile assembled hardening source
        run: |
          python -m py_compile scripts/v12_data_sources.py scripts/v12_universe.py scripts/v12_entity.py scripts/v12_entity_test.py scripts/v12_evidence.py scripts/v12_flow.py scripts/v12_source_probe.py scripts/v12_acceptance.py scripts/v12_static_smoke.py scripts/train_forecast_v12.py
          python - <<'PY'
          from pathlib import Path
          parts=sorted((Path('scripts')/'v12_train_parts').glob('*.pyinc'))
          code='\n'.join(p.read_text(encoding='utf-8') for p in parts)
          compile(code,'v12-hardening-assembled.py','exec')
          print('V12 HARDENING SYNTAX PASS',len(parts),len(code),[p.name for p in parts])
          PY
      - name: Entity adversarial tests
        run: PYTHONPATH=scripts python scripts/v12_entity_test.py
      - name: Restore real V11 historical evidence seed
        uses: actions/download-artifact@v4
        with:
          name: forecast-v11-final-evidence-31790884093
          path: /tmp/v11-seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: NCKHtop1/vmews-risk-analytics
          run-id: 31790884093
      - name: Install evidence seed
        run: |
          mkdir -p data/v12-seed
          for f in sentiment-v11.json flow-v11.json market-scan.json; do src=$(find /tmp/v11-seed -name "$f" -type f | head -1); test -n "$src"; cp "$src" "data/v12-seed/$f"; done
      - name: VNStock-first source probe
        run: PYTHONPATH=scripts python scripts/v12_source_probe.py
      - name: Train full hardening model and sealed audit
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=scripts python scripts/train_forecast_v12.py 2>&1 | tee data/v12-training.log
      - name: Assert training artifacts before acceptance
        run: |
          python - <<'PY'
          from pathlib import Path
          expected=['forecast-model-v12.json','forecast-current-v12.json','forecast-dashboard-v12.json','forecast-backtest-v12.json','data-audit-v12.json']
          rows={x:(Path('data')/x).stat().st_size if (Path('data')/x).exists() else None for x in expected}
          print('V12 MATERIALIZED OUTPUTS',rows)
          missing=[k for k,v in rows.items() if v is None or v<100]
          if missing: raise SystemExit('missing/invalid V12 outputs before acceptance: '+str(missing))
          PY
      - name: Run all hard phase gates
        run: PYTHONPATH=scripts python scripts/v12_acceptance.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Frontend syntax
        run: node --check forecast-final-v12.js
      - name: Static UX/data contract smoke
        run: python scripts/v12_static_smoke.py
      - name: Upload final-candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-v12-hardening-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            data/v12-source-probe.json
            data/v12-training.log
            data/v12-training-error.json
            data/forecast-model-v12.json
            data/forecast-current-v12.json
            data/forecast-dashboard-v12.json
            data/forecast-backtest-v12.json
            data/data-audit-v12.json
            data/phase-gates-v12.json
      - name: Persist only fully validated hardening snapshots
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v12-source-probe.json data/forecast-model-v12.json data/forecast-current-v12.json data/forecast-dashboard-v12.json data/forecast-backtest-v12.json data/data-audit-v12.json data/phase-gates-v12.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish validated V12 hardening snapshots [v12-hard-data]'
          git pull --rebase origin forecast-v12-hardening
          git push origin HEAD:forecast-v12-hardening
