name: V12 rumor intelligence deterministic test
on:
  push:
    branches: [forecast-v12-rumor-hardening]
    paths:
      - 'scripts/v12_evidence.py'
      - 'scripts/v12_rumor_runtime.py'
      - 'scripts/v12_rumor_test.py'
      - '.github/workflows/v12-rumor-test.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: PYTHONPATH=scripts python scripts/v12_rumor_test.py
