name: FinQuery custom-domain end-to-end smoke
on:
  workflow_dispatch:
  # PR checks the currently published public Pages shell plus protected domain;
  # source-specific responsive and chart tests run in their separate PR gates.
  pull_request:
    paths:
      - '.github/workflows/financial-dashboard-browser-smoke.yml'
      - 'scripts/finquery_custom_domain_browser_run.py'
      - '.github/workflows/finquery-custom-domain-smoke.yml'
  push:
    branches: [main, fix/finquery-domain-https-route-smoke-20261009, fix/finquery-browser-stale-element-retry-20261009]
    paths:
      - 'financial-report/scripts/smoke_custom_domain.py'
      - 'scripts/finquery_custom_domain_browser_run.py'
      - 'financial-report/tests/test_auth_aware_domain_smoke.py'
      - '.github/workflows/finquery-custom-domain-smoke.yml'
      - '.github/workflows/financial-dashboard-browser-smoke.yml'
  workflow_run:
    workflows: ['Deploy VMEWS Pages']
    branches: [main]
    types: [completed]
  schedule:
    - cron: '15 2-9 * * 1-5'

permissions:
  contents: read

concurrency:
  group: finquery-real-domain-smoke
  cancel-in-progress: true

jobs:
  domain:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check production session, source publication, protected Data Hub and login
        run: python financial-report/scripts/smoke_custom_domain.py

  browser:
    # The public Pages UI is already deployed: run regression on reviewed
    # main-branch QA changes and after successful Pages releases. Reject failed deploys.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: domain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install full browser smoke dependencies
        run: pip install --disable-pip-version-check -q selenium==4.36.0 PyYAML
      - name: Exercise charts, market prices, company news, Risk, strategy and mobile on finquery.info.vn
        run: python scripts/finquery_custom_domain_browser_run.py
