name: Manual corporate event refresh
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: financial-insights-data-publisher-v2
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            financial-report/scripts
            financial-report/config
            financial-report/data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore published event datasets
        run: |
          git fetch origin financial-insights-data
          git worktree add /tmp/insight-publish FETCH_HEAD
          git -C /tmp/insight-publish sparse-checkout set data
          mkdir -p /tmp/insight-publish/data
          cp financial-report/data/companies.json /tmp/insight-publish/data/companies.json
          cp -n financial-report/data/corporate-events.json /tmp/insight-publish/data/corporate-events.json || true
      - name: Sweep corporate-event sources
        run: python -u financial-report/scripts/refresh_events.py --output /tmp/insight-publish/data
      - name: Publish corporate-event datasets
        working-directory: /tmp/insight-publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse data/corporate-events.json data/event-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh corporate event timeline"
            git push origin HEAD:refs/heads/financial-insights-data
          fi
