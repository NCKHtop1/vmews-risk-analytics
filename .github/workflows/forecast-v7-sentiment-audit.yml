name: Forecast V8 DL sentiment audit
on:
  push:
    branches: [forecast-v6-research-grade]
    paths: ['scripts/audit_sentiment_dl_v7.py','scripts/update_sentiment_v8.py','.github/workflows/forecast-v7-sentiment-audit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forecast-v6-research-grade
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch transformers pyvi scikit-learn
      - run: python scripts/audit_sentiment_dl_v7.py
      - run: python scripts/update_sentiment_v8.py
      - name: Persist sentiment snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sentiment-v8.json
          git diff --cached --quiet || git commit -m "Update sentiment v8 snapshot"
          git push origin HEAD:forecast-v6-research-grade
