name: Verify isolated FinQuery and SoluTION.AI CDN products

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'forecast-final.html'
      - 'forecast-final-v12.js'
      - 'forecast-live-leaders-v14.js'
      - 'forecast-polish-v12.js'
      - 'scripts/forecast-navigation-test.cjs'
      - 'scripts/test_finquery_vn100_frontend.cjs'
      - '.github/workflows/cdn-smoke.yml'
  workflow_run:
    workflows:
      - Deploy VMEWS Pages
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: forecast-isolated-cdn-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate FinQuery runtime and standalone routing without retired main data
        run: |
          node --check forecast-final-v12.js
          node --check forecast-live-leaders-v14.js
          node --check forecast-polish-v12.js
          node scripts/forecast-navigation-test.cjs
          node --test scripts/test_finquery_vn100_frontend.cjs
      - name: Verify independent production snapshot branches are reachable
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://raw.githubusercontent.com/NCKHtop1/vmews-risk-analytics'
          curl -fsSL --retry 4 --retry-delay 3 --max-time 20 \
            "$ROOT/finquery-vn100-data/data/finquery-vn100-status.json?cdn=${GITHUB_RUN_ID}" \
            -o /tmp/finquery-vn100-status.json
          curl -fsSL --retry 4 --retry-delay 3 --max-time 20 \
            "$ROOT/solution-ai-core-data/data/release-audit-v20.json?cdn=${GITHUB_RUN_ID}" \
            -o /tmp/solution-ai-independent-release.json
          python - <<'PY'
          import json
          vn=json.load(open('/tmp/finquery-vn100-status.json'))
          independent=json.load(open('/tmp/solution-ai-independent-release.json'))
          assert vn['status']=='PASS' and vn['symbols']==100 and vn['horizons']==500,vn
          assert vn['asOf'] and vn['generatedAt']
          assert independent.get('asOf'),"Missing dated independent research snapshot"
          print({'finquerySource':'finquery-vn100-data','asOf':vn['asOf'],
                 'symbols':vn['symbols'],'horizons':vn['horizons'],
                 'independentSource':'solution-ai-core-data','independentAsOf':independent['asOf']})
          PY
