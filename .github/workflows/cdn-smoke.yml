name: Verify VMEWS Browser Final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set immutable final URL
        shell: bash
        run: |
          URL='https://htmlpreview.github.io/?https://github.com/NCKHtop1/vmews-risk-analytics/blob/f1b1d9cd155a17dfc5ba2fdcb002cf2a90aa8e20/final.html'
          echo "$URL" > final-url.txt
          echo "$URL"

      - name: Verify backend scan directly
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request
          u='https://vmews-risk-analytics-sojd.vercel.app/api/radar?mode=scan&symbols=FPT,PNJ,VCB,HPG&t='+str(int(time.time()))
          req=urllib.request.Request(u,headers={'User-Agent':'VMEWS-browser-smoke/1.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=60) as r:p=json.loads(r.read().decode())
          rows=p.get('ranking') or []
          assert p.get('version')=='STOCK-EWS-5.0.0-PRODUCTION',p
          assert len(rows)>=1,p
          print('BACKEND_RANKING',[(x.get('symbol'),round(float(x.get('effectiveScore',x.get('score',0))),2),x.get('color')) for x in rows])
          PY

      - name: Render immutable final page in Chrome
        shell: bash
        run: |
          URL=$(cat final-url.txt)
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then echo 'Chrome/Chromium not found'; exit 1; fi
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=70000 --dump-dom "$URL" > dom.html
          echo '--- RADAR STATUS ---'
          grep -o 'Risk radar ready[^<]*' dom.html | head -1 || true
          grep -F 'Risk radar ready · STOCK-EWS-5.0.0-PRODUCTION' dom.html
          grep -F 'FPT Corporation' dom.html
          grep -F 'Phu Nhuan Jewelry' dom.html
          if grep -F 'At least ~200 completed sessions are required' dom.html; then echo 'Old runtime error visible'; exit 1; fi
          if grep -F 'No usable securities returned for this request.' dom.html; then echo 'No model rows visible'; exit 1; fi
          echo 'BROWSER DOM PASS'

      - name: Capture verified evidence
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request
          url=open('final-url.txt').read().strip()
          api='https://vmews-risk-analytics-sojd.vercel.app/api/radar?mode=scan&symbols=FPT,PNJ,VCB,HPG&t='+str(int(time.time()))
          req=urllib.request.Request(api,headers={'User-Agent':'VMEWS-browser-smoke/1.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=60) as r:p=json.loads(r.read().decode())
          rows=[(x.get('symbol'),round(float(x.get('effectiveScore',x.get('score',0))),2),x.get('color')) for x in p.get('ranking',[])]
          body=f'''# VMEWS BROWSER FINAL PASS\n\n- Final URL: {url}\n- API version: `{p.get('version')}`\n- Scanned: `{p.get('scanned')}`\n- Ranking: `{rows}`\n- Errors: `{p.get('errors')}`\n- Chrome DOM: `Risk radar ready` + FPT + PNJ verified\n- Old ~200-session error visible: `NO`\n'''
          open('browser-pass.md','w',encoding='utf-8').write(body)
          print(body)
          PY

      - name: Publish PASS evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "VMEWS BROWSER FINAL PASS ${GITHUB_SHA::7}" --body-file browser-pass.md

  report:
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Publish failure marker
        if: needs.verify.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.verify.result }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "VMEWS BROWSER VERIFY FAILED ${GITHUB_SHA::7}" \
            --body "End-to-end browser verification result: $RESULT. Do not use this URL as final."
