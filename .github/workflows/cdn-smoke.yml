name: Verify SoluTION.AI full-HOSE and Vietnamese forecast CDN

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "forecast-final.html"
      - "forecast-final-v12.js"
      - "forecast-live-leaders-v14.js"
      - "forecast-polish-v12.js"
      - "forecast-portfolio-v14.css"
      - "solution-ai-v17.js"
      - "api/solution-ai.js"
      - "data/forecast-current-v12.json"
      - "data/forecast-dashboard-v12.json"
      - "data/forecast-market-v13.json"
      - "scripts/forecast_v18_frontend_runtime_test.mjs"
      - ".github/workflows/cdn-smoke.yml"
  push:
    branches: [main]
    paths:
      - "forecast-final.html"
      - "forecast-final-v12.js"
      - "forecast-live-leaders-v14.js"
      - "forecast-polish-v12.js"
      - "forecast-portfolio-v14.css"
      - "solution-ai-v17.js"
      - "api/solution-ai.js"
      - "data/forecast-current-v12.json"
      - "data/forecast-dashboard-v12.json"
      - "data/forecast-market-v13.json"
      - ".github/workflows/cdn-smoke.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Wait for exact-SHA CDN assets
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://cdn.githubraw.com/NCKHtop1/vmews-risk-analytics/${GITHUB_SHA}"
          for attempt in $(seq 1 24); do
            if curl -fsSL --max-time 25 "$ROOT/forecast-final.html" -o /tmp/forecast-final.html \
              && curl -fsSL --max-time 25 "$ROOT/forecast-final-v12.js" -o /tmp/forecast-final-v12.js \
              && curl -fsSL --max-time 25 "$ROOT/forecast-live-leaders-v14.js" -o /tmp/forecast-live-leaders-v14.js \
              && curl -fsSL --max-time 25 "$ROOT/solution-ai-v17.js" -o /tmp/solution-ai-v17.js \
              && curl -fsSL --max-time 25 "$ROOT/data/forecast-current-v12.json" -o /tmp/forecast-current-v12.json \
              && curl -fsSL --max-time 25 "$ROOT/data/forecast-dashboard-v12.json" -o /tmp/forecast-dashboard-v12.json \
              && curl -fsSL --max-time 25 "$ROOT/data/forecast-market-v13.json" -o /tmp/forecast-market-v13.json; then
              exit 0
            fi
            sleep 5
          done
          echo "Exact-SHA CDN assets were not ready in time."
          exit 1

      - name: Verify Vietnamese SoluTION.AI interface and independently validated HOSE data
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'lang="vi"' /tmp/forecast-final.html
          grep -Fq 'SoluTION.AI</span> define market.' /tmp/forecast-final.html
          grep -Fq 'SoluTION.AI' /tmp/forecast-final.html
          grep -Fq 'forecast-final-v12.js' /tmp/forecast-final.html
          grep -Fq 'forecast-live-leaders-v14.js' /tmp/forecast-final.html
          grep -Fq 'solutionAiGeminiWeb' /tmp/forecast-final.html
          node --check /tmp/forecast-final-v12.js
          node --check /tmp/forecast-live-leaders-v14.js
          node --check /tmp/solution-ai-v17.js
          grep -Fq 'CDN_PATH[2]' /tmp/forecast-final-v12.js
          ! grep -Fq '/main/data' /tmp/forecast-final-v12.js
          grep -Fq 'forecast-session-v21.json' /tmp/forecast-live-leaders-v14.js
          grep -Fq '}, 3000);' /tmp/forecast-live-leaders-v14.js
          python - <<'PY'
          import json
          import os

          current = json.load(open('/tmp/forecast-current-v12.json', encoding='utf-8'))
          dashboard = json.load(open('/tmp/forecast-dashboard-v12.json', encoding='utf-8'))
          market = json.load(open('/tmp/forecast-market-v13.json', encoding='utf-8'))

          expected = 'VMEWS-MARKET-FORECAST-20.1.0'
          assert current.get('modelVersion') == expected, current.get('modelVersion')
          assert dashboard.get('modelVersion') == expected, dashboard.get('modelVersion')
          assert market.get('version') == expected, market.get('version')

          symbols = dashboard.get('symbols') or {}
          assert len(symbols) == 403, len(symbols)
          assert dashboard.get('promotion', {}).get('status') == 'PASS', dashboard.get('promotion')
          assert dashboard['promotion'].get('directPriceHorizons') == [1, 2, 3, 4, 5]
          direction = dashboard['promotion'].get('directionHorizons') or []
          assert direction == [int(h) for h, item in market['model']['horizons'].items() if item.get('directionStatus') == 'PASS'], direction

          model = market.get('model') or {}
          universe = model.get('universe') or {}
          assert universe.get('currentSymbols') == 403, universe
          assert universe.get('freshSymbols') == 403, universe
          assert universe.get('staleSymbols') == 0, universe

          for horizon in map(str, range(1, 6)):
              audit = model['horizons'][horizon]
              assert audit.get('priceStatus') == 'PASS', (horizon, audit.get('priceStatus'))
              assert audit.get('walkForwardAudit', {}).get('status') == 'PASS', horizon
              assert audit.get('magnitudeGate', {}).get('status') == 'PASS', horizon
              assert audit.get('magnitudeGate', {}).get('invalidExecutableQuotes') == 0, horizon

          fpt = symbols['FPT']
          assert fpt.get('date') == dashboard.get('asOf'), (fpt.get('date'), dashboard.get('asOf'))
          assert fpt['horizons']['1']['expectedPrice'] > 0
          assert fpt['horizons']['5']['q20Price'] < fpt['horizons']['5']['q80Price']
          assert fpt['fundContext']['scenarioEligible'] is True
          assert fpt['fundContext'].get('usedByForecast') is not True
          assert fpt['horizons']['5']['liveAdjustmentAppliedToCentralForecast'] is False
          assert fpt['horizons']['5']['liveAdjustmentReturn'] == 0
          assert fpt['horizons']['5']['liveEvidence']['components']['FUND'] != 0
          assert symbols['ACB']['flow']['foreign']['available'] is True

          news_rows = [item.get('newsFeatures') for item in symbols.values() if isinstance(item.get('newsFeatures'), dict)]
          assert len(news_rows) >= 350, len(news_rows)
          assert all((row.get('pendingDecisionEvents') or 0) >= 0 for row in news_rows)
          decision_audit = market['sources'].get('decisionNewsAudit')
          assert isinstance(decision_audit, dict) and decision_audit, decision_audit

          assert market['sources']['fundAudit']['postForecastSnapshotsUsedAsFeatures'] == 0
          assert market['sources']['fundAudit']['status'] == 'CONTEXT_SCENARIO_ONLY'
          assert market['sources']['fundAudit']['scenarioEligibleSymbols'] >= 50

          index = (dashboard.get('lists') or {}).get('vn30')
          if index:
              members = set(index.get('symbols') or [])
              assert len(members) == 30, members
              assert {'MCH', 'TCX'} <= members, members
              assert not {'PLX', 'TPB'} & members, members
              assert set(market['sources']['vn30']['symbols']) == members
              assert market['sources']['rumorAudit']['futurePublicationsUsed'] == 0
              assert market['sources']['rumorAudit']['unverifiedClaimsReportedAsFacts'] == 0
              positive = [
                  symbol for symbol in members
                  if symbols[symbol]['horizons']['5']['priceValidated']
                  and symbols[symbol]['horizons']['5']['expectedPrice'] > symbols[symbol]['close']
              ]
              if not positive:
                  leaders = open('/tmp/forecast-live-leaders-v14.js', encoding='utf-8').read()
                  assert 'includeNonPositive' in leaders, 'No validated positive VN30 forecasts and no defensive fallback'
              print('VN30 diagnostic positive', len(positive), 'defensive fallback', not positive)

          leaders = open('/tmp/forecast-live-leaders-v14.js', encoding='utf-8').read()
          assert 'options.scope === "vn30"' in leaders
          assert 'HOSE · 5 PHIÊN TỚI' in leaders
          assert 'forecast-session-v21.json' in leaders
          print('SoluTION.AI FULL-HOSE CDN PASS', dashboard['asOf'], 'symbols', len(symbols))
          print('FINAL_URL', f"https://cdn.githubraw.com/NCKHtop1/vmews-risk-analytics/{os.environ['GITHUB_SHA']}/forecast-final.html?symbol=FPT")
          PY
