name: V24 UX AI technical and accuracy hardening

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v24-ux-ai-hardening.yml"
      - "scripts/v24_ux_ai_patch.py"

permissions:
  contents: write

concurrency:
  group: v24-ux-ai-hardening
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply V24 UX and AI patch
        run: python scripts/v24_ux_ai_patch.py

      - name: Preserve full V18 runtime regression suite with V24 wording contract
        run: |
          git show df13ae647822476cb726822f220a6331c477fd4c:scripts/forecast_v18_frontend_runtime_test.mjs > scripts/forecast_v18_frontend_runtime_test.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/forecast_v18_frontend_runtime_test.mjs')
          text=p.read_text(encoding='utf-8')
          old='''  assert.match(source, /Cập nhật chậm/);\n  assert.match(source, /Đã cập nhật cùng phiên/);\n  assert.match(source, /Chưa có dữ liệu từ nguồn/);'''
          new='''  assert.doesNotMatch(source, /Cập nhật chậm|Đã cập nhật cùng phiên|Chưa có dữ liệu từ nguồn|Đang mở rộng nguồn|Bối cảnh tham khảo · chưa điều chỉnh giá trung tâm/);\n  assert.match(source, /Phiên gần nhất/);\n  assert.match(source, /Mở BCTC/);\n  assert.match(source, /Danh mục · tỷ trọng · NAV · biến động/);'''
          if old not in text:
              raise SystemExit('V18 wording contract anchor missing')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Run leakage-safe forecast accuracy audit
        run: |
          python scripts/forecast_v24_accuracy_audit.py
          python - <<'PY'
          import json
          report=json.load(open('data/forecast-accuracy-v24.json',encoding='utf-8'))
          for h in range(1,6):
              item=report['horizons'][str(h)]
              recent=item['recent120Dates']
              ch=item['shrinkageChallenger']
              print(f"T+{h}: recent skill={recent.get('maeSkill')} direction={recent.get('directionalAccuracy')} bias={recent.get('signedBias')} challenger={ch.get('status')} alpha={ch.get('chosenAlpha')}")
          print('SUMMARY', report['summary'])
          PY

      - name: JavaScript syntax checks
        run: |
          node --check forecast-final-v12.js
          node --check solution-ai-v17.js
          node --check forecast-deep-dive-v24.js
          node --check scripts/solution_ai_frontend_v17_test.mjs
          node --check scripts/forecast_v18_frontend_runtime_test.mjs
          node --check scripts/forecast_v22_browser_e2e.mjs

      - name: SoluTION.AI unit and VM tests
        run: node --test scripts/solution_ai_frontend_v17_test.mjs scripts/solution_ai_v17_test.mjs

      - name: Frontend contract tests
        run: python scripts/forecast_v14_frontend_contract_test.py

      - name: Runtime contract tests
        run: node --test scripts/forecast_v18_frontend_runtime_test.mjs

      - name: Install session-test dependency
        run: python -m pip install --disable-pip-version-check pandas

      - name: Session overlay tests
        run: python -m unittest scripts/forecast_v21_session_snapshot_test.py

      - name: Install Chromium test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser E2E desktop and mobile
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/v24-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          node scripts/forecast_v22_browser_e2e.mjs

      - name: Production phrase and asset audit
        run: |
          ! grep -Fq 'Tỷ trọng này không phải tỷ lệ sở hữu doanh nghiệp' solution-ai-v17.js
          ! grep -Fq 'Đang mở rộng nguồn' forecast-final-v12.js
          ! grep -Fq 'Bối cảnh tham khảo · chưa điều chỉnh giá trung tâm' forecast-final-v12.js
          grep -Fq 'forecast-deep-dive-v24.js' forecast-final.html
          grep -Fq '__SOLUTION_AI_ASK__' solution-ai-v17.js
          grep -Fq 'obvChange5' solution-ai-v17.js

      - name: Publish V24 production changes
        run: |
          rm -rf node_modules package-lock.json
          git checkout -- package.json 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          for name in ['scripts/solution_ai_frontend_v17_test.mjs','scripts/forecast_v18_frontend_runtime_test.mjs','scripts/forecast_v22_browser_e2e.mjs']:
              p=Path(name); p.write_text(p.read_text(encoding='utf-8').rstrip()+"\n",encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast-final.html forecast-final-v12.js solution-ai-v17.js scripts/solution_ai_frontend_v17_test.mjs scripts/forecast_v18_frontend_runtime_test.mjs scripts/forecast_v22_browser_e2e.mjs data/forecast-accuracy-v24.json
          git add -u scripts/v24_ux_ai_patch.py
          git diff --cached --check
          git commit -m "V24 streamline deep analysis and enrich technical AI"
          git pull --rebase origin main
          git push origin HEAD:main
