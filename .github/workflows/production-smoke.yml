name: Legacy bilingual production smoke (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vmews-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify VI then EN in Chrome
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          BASE="https://cdn.githubraw.com/NCKHtop1/vmews-risk-analytics/${GITHUB_SHA}/final-bilingual.html"
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          [ -n "$CHROME" ] || exit 1

          for i in $(seq 1 25); do
            curl -fsSL --max-time 20 -A 'VMEWS-bilingual-check/1.0' "$BASE" -o page.html && grep -q 'Vietnam Market Early Warning System' page.html && break
            sleep 4
          done

          rm -rf /tmp/vmews-vi /tmp/vmews-en

          timeout 80s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/vmews-vi --virtual-time-budget=55000 --dump-dom "$BASE?lang=vi" > vi.html 2>/dev/null
          vi_ready=no; vi_copy=no; vi_console=no; vi_fpt=no; vi_pnj=no; vi_old=no; vi_empty=no
          grep -Fq 'Radar sẵn sàng · STOCK-EWS-5.2.0-PRODUCTION' vi.html && vi_ready=yes
          grep -Fq 'Phát hiện rủi ro tăng.' vi.html && vi_copy=yes
          grep -Fq 'BẢNG THEO DÕI RỦI RO' vi.html && vi_console=yes
          grep -Fq 'FPT Corporation' vi.html && vi_fpt=yes
          grep -Fq 'Phu Nhuan Jewelry' vi.html && vi_pnj=yes
          grep -Fq 'At least ~200 completed sessions are required' vi.html && vi_old=yes
          grep -Fq 'No usable securities returned for this request.' vi.html && vi_empty=yes

          timeout 80s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/vmews-en --virtual-time-budget=55000 --dump-dom "$BASE?lang=en" > en.html 2>/dev/null
          en_ready=no; en_copy=no; en_fpt=no; en_pnj=no; en_old=no; en_empty=no
          grep -Fq 'Radar ready · STOCK-EWS-5.2.0-PRODUCTION' en.html && en_ready=yes
          grep -Fq 'Spot rising risk.' en.html && en_copy=yes
          grep -Fq 'FPT Corporation' en.html && en_fpt=yes
          grep -Fq 'Phu Nhuan Jewelry' en.html && en_pnj=yes
          grep -Fq 'At least ~200 completed sessions are required' en.html && en_old=yes
          grep -Fq 'No usable securities returned for this request.' en.html && en_empty=yes

          PASS=yes
          for x in "$vi_ready" "$vi_copy" "$vi_console" "$vi_fpt" "$vi_pnj" "$en_ready" "$en_copy" "$en_fpt" "$en_pnj"; do [ "$x" = yes ] || PASS=no; done
          [ "$vi_old" = no ] || PASS=no
          [ "$vi_empty" = no ] || PASS=no
          [ "$en_old" = no ] || PASS=no
          [ "$en_empty" = no ] || PASS=no

          BODY="Final URL: $BASE\nVI: ready=$vi_ready, copy=$vi_copy, console=$vi_console, FPT=$vi_fpt, PNJ=$vi_pnj, old_error=$vi_old, empty=$vi_empty\nEN: ready=$en_ready, copy=$en_copy, FPT=$en_fpt, PNJ=$en_pnj, old_error=$en_old, empty=$en_empty"
          if [ "$PASS" = yes ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "VMEWS BILINGUAL CDN FINAL PASS ${GITHUB_SHA::7}" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "VMEWS BILINGUAL CDN FINAL FAILED ${GITHUB_SHA::7}" --body "$BODY"
            exit 1
          fi
