name: Production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Find first clean Vercel domain that fully works
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME" || exit 1
          domains=(
            vmews-risk-analytics-xatw.vercel.app
            vmews-risk-analytics-oabm.vercel.app
            vmews-risk-analytics-shf7.vercel.app
            vmews-risk-analytics.vercel.app
            vmews-risk-analytics-sojd.vercel.app
          )
          : > candidates.txt
          for d in "${domains[@]}"; do
            echo "TEST $d" | tee -a candidates.txt
            api=$(curl -fsSL --max-time 60 -A 'VMEWS-clean-link-smoke/1.0' "https://$d/api/stocks2?mode=scan&symbols=FPT,PNJ,VCB,HPG&t=$(date +%s)" 2>/dev/null)
            if [ -z "$api" ]; then echo 'api=fail' | tee -a candidates.txt; continue; fi
            echo "$api" > api.json
            py=$(python - <<'PY'
import json
try:
 p=json.load(open('api.json'))
 rows=p.get('ranking') or []
 print('yes' if str(p.get('version','')).startswith('STOCK-EWS-5') and rows else 'no')
except Exception: print('no')
PY
)
            echo "api=$py" | tee -a candidates.txt
            [ "$py" = yes ] || continue
            timeout 55s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=35000 --dump-dom "https://$d/" > dom.html 2>/dev/null
            ready=no; fpt=no; pnj=no; old=no; empty=no
            grep -Fq 'Risk radar ready · STOCK-EWS-5.0.0-PRODUCTION' dom.html && ready=yes
            grep -Fq 'FPT Corporation' dom.html && fpt=yes
            grep -Fq 'Phu Nhuan Jewelry' dom.html && pnj=yes
            grep -Fq 'At least ~200 completed sessions are required' dom.html && old=yes
            grep -Fq 'No usable securities returned for this request.' dom.html && empty=yes
            echo "ready=$ready fpt=$fpt pnj=$pnj old=$old empty=$empty" | tee -a candidates.txt
            if [ "$ready" = yes ] && [ "$fpt" = yes ] && [ "$pnj" = yes ] && [ "$old" = no ] && [ "$empty" = no ]; then
              echo "https://$d/" > final-url.txt
              python - <<'PY' > ranking.txt
import json
p=json.load(open('api.json'))
print([(x.get('symbol'),round(float(x.get('effectiveScore',x.get('score',0))),2),x.get('color')) for x in p.get('ranking',[])])
PY
              break
            fi
          done
          if [ ! -s final-url.txt ]; then
            cat > result.md <<EOF
          # VMEWS CLEAN VERCEL LINK FAILED

          No clean Vercel domain passed both API + browser DOM checks.

          \`\`\`
          $(cat candidates.txt)
          \`\`\`
          EOF
            gh issue create --repo "$GITHUB_REPOSITORY" --title "VMEWS CLEAN VERCEL LINK FAILED ${GITHUB_SHA::7}" --body-file result.md
            exit 1
          fi
          URL=$(cat final-url.txt)
          cat > result.md <<EOF
          # VMEWS CLEAN VERCEL LINK PASS

          - Final URL: $URL
          - Ranking: \`$(cat ranking.txt)\`
          - Browser: Risk radar ready + FPT + PNJ visible
          - Old ~200-session error: NO
          - Empty ranking: NO
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title "VMEWS CLEAN VERCEL LINK PASS ${GITHUB_SHA::7}" --body-file result.md
