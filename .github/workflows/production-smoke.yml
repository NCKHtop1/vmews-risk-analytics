name: Production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify API and FPT detail
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request
          def get(u,timeout=60):
              req=urllib.request.Request(u,headers={'User-Agent':'VMEWS-final-diag/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=timeout) as r:return json.loads(r.read().decode())
          base='https://vmews-risk-analytics-sojd.vercel.app/api/radar'
          s=get(base+'?mode=scan&symbols=FPT,PNJ,VCB,HPG&t='+str(int(time.time())))
          d=get(base+'?mode=detail&symbol=FPT&t='+str(int(time.time())))
          rows=s.get('ranking') or []
          assert s.get('version')=='STOCK-EWS-5.0.0-PRODUCTION' and rows,s
          assert d.get('symbol')=='FPT' and isinstance(d.get('score'),(int,float)),d
          open('api.json','w').write(json.dumps({'ranking':[(x.get('symbol'),round(float(x.get('effectiveScore',x.get('score',0))),2),x.get('color')) for x in rows],'fpt':{'date':d.get('modelAsOf'),'score':round(float(d.get('score')),2),'color':d.get('color')}},ensure_ascii=False))
          print(open('api.json').read())
          PY

      - name: Browser diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set +e
          URL='https://cdn.githubraw.com/NCKHtop1/vmews-risk-analytics/f1b1d9cd155a17dfc5ba2fdcb002cf2a90aa8e20/final.html'
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          echo "$URL" > final-url.txt
          if [ -z "$CHROME" ]; then echo 'chrome=missing' > browser.txt; exit 0; fi
          timeout 45s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=30000 --dump-dom "$URL" > dom.html 2>chrome.err
          code=$?
          ready=no; fpt=no; pnj=no; old=no; empty=no
          grep -Fq 'Risk radar ready · STOCK-EWS-5.0.0-PRODUCTION' dom.html && ready=yes
          grep -Fq 'FPT Corporation' dom.html && fpt=yes
          grep -Fq 'Phu Nhuan Jewelry' dom.html && pnj=yes
          grep -Fq 'At least ~200 completed sessions are required' dom.html && old=yes
          grep -Fq 'No usable securities returned for this request.' dom.html && empty=yes
          printf 'chrome_exit=%s\nready=%s\nfpt=%s\npnj=%s\nold_error=%s\nempty=%s\ndom_bytes=%s\n' "$code" "$ready" "$fpt" "$pnj" "$old" "$empty" "$(wc -c < dom.html)" > browser.txt
          tail -20 chrome.err >> browser.txt
          cat browser.txt
          exit 0

      - name: Publish diagnostic and decide PASS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          URL=$(cat final-url.txt)
          API=$(cat api.json)
          cat > result.md <<EOF
          # VMEWS FINAL browser diagnostic

          - Candidate URL: $URL
          - API: \`$API\`

          \`\`\`
          $(cat browser.txt)
          \`\`\`
          EOF
          if grep -q '^ready=yes$' browser.txt && grep -q '^fpt=yes$' browser.txt && grep -q '^pnj=yes$' browser.txt && grep -q '^old_error=no$' browser.txt && grep -q '^empty=no$' browser.txt; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "VMEWS FINAL END-TO-END PASS ${GITHUB_SHA::7}" --body-file result.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "VMEWS FINAL UI DIAG FAILED ${GITHUB_SHA::7}" --body-file result.md
            exit 1
          fi
