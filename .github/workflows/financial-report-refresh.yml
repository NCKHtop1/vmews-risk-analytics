name: Refresh financial reports for CDN
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Optional comma-separated tickers; empty continues the full catalog'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'financial-report/backend/**'
      - 'financial-report/scripts/refresh_data.py'
      - '.github/workflows/financial-report-refresh.yml'
  schedule:
    - cron: '15 */4 * * *'
permissions:
  contents: write
concurrency:
  group: financial-report-data-publisher
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      VNSTOCK_TELEMETRY: 'off'
      FINANCIAL_REQUEST_INTERVAL: '3'
      REQUESTED_SYMBOLS: ${{ inputs.symbols }}
      REFRESH_BUDGET: ${{ github.event_name == 'push' && '6' || '45' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: financial-report
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r financial-report/requirements.txt
      - name: Restore last published data
        run: |
          git fetch origin financial-report-data
          git worktree add /tmp/financial-publish FETCH_HEAD
          git -C /tmp/financial-publish sparse-checkout set data
          mkdir -p /tmp/financial-publish/data
          cp -n financial-report/data/*.json /tmp/financial-publish/data/ || true
      - name: Collect and validate public financial statements
        run: |
          if [ -n "$REQUESTED_SYMBOLS" ]; then
            python -u financial-report/scripts/refresh_data.py --output /tmp/financial-publish/data --symbols "$REQUESTED_SYMBOLS" --budget-minutes "$REFRESH_BUDGET"
          else
            python -u financial-report/scripts/refresh_data.py --output /tmp/financial-publish/data --budget-minutes "$REFRESH_BUDGET"
          fi
      - name: Publish only the financial data branch
        if: always()
        working-directory: /tmp/financial-publish
        run: |
          test -f data/manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse data
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified financial report datasets"
            git push origin HEAD:refs/heads/financial-report-data
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-refreshed-data
          path: /tmp/financial-publish/data/*.json
          retention-days: 7
