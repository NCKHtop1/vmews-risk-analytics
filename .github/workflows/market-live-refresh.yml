name: Refresh VMEWS live prices

on:
  workflow_dispatch:
  schedule:
    # Heartbeat every 5 minutes; the gate below performs a real fetch only when
    # the last successful snapshot is about 15 minutes old or stale.
    - cron: '*/5 2-7 * * 1-5'
    # Keep refreshing through the Vietnam close and final matching window.
    - cron: '0,5,10,15 8 * * 1-5'

permissions:
  contents: write

concurrency:
  group: financial-market-data-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: financial-report
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore latest market snapshots
        run: |
          git fetch origin financial-market-data
          git worktree add /tmp/market-publish FETCH_HEAD
          git -C /tmp/market-publish sparse-checkout set market
      - name: Decide whether a live refresh is due
        id: gate
        env:
          GITHUB_OUTPUT: ${{ github.output }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          p=Path('/tmp/market-publish/market/quotes.json')
          run=True
          reason='missing snapshot'
          try:
              data=json.loads(p.read_text())
              checked=datetime.fromisoformat(str(data.get('checkedAt')).replace('Z','+00:00'))
              if checked.tzinfo is None: checked=checked.replace(tzinfo=timezone.utc)
              age=(datetime.now(timezone.utc)-checked.astimezone(timezone.utc)).total_seconds()
              latest=data.get('latestSourceTime')
              if not latest:
                  times=[q.get('sourceTime') for q in (data.get('quotes') or {}).values() if q.get('sourceTime')]
                  latest=max(times) if times else None
              source_day=None
              if latest:
                  dt=datetime.fromisoformat(str(latest).replace('Z','+00:00'))
                  if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
                  source_day=dt.astimezone(timezone(timedelta(hours=7))).date().isoformat()
              today=datetime.now(timezone(timedelta(hours=7))).date().isoformat()
              if data.get('status')=='ok' and source_day==today and age < 11*60:
                  run=False
                  reason=f'fresh snapshot age={age:.0f}s source_day={source_day}'
              else:
                  reason=f"refresh required status={data.get('status')} age={age:.0f}s source_day={source_day} today={today}"
          except Exception as exc:
              reason=f'refresh required: {exc}'
          print(reason)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write('run='+('true' if run else 'false')+'\n')
              out.write('reason='+reason.replace('\n',' ')[:500]+'\n')
          PY
      - name: Collect current-session VN100 quotes
        if: steps.gate.outputs.run == 'true'
        env:
          MARKET_REQUIRE_TODAY: '1'
        run: python -u financial-report/scripts/refresh_market.py --output /tmp/market-publish/market --mode prices
      - name: Publish live market snapshot
        if: always() && steps.gate.outputs.run == 'true'
        working-directory: /tmp/market-publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse market
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh VMEWS live market prices'
            git push origin HEAD:refs/heads/financial-market-data
          fi
      - name: Validate current-session snapshot
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          data=json.loads(Path('/tmp/market-publish/market/quotes.json').read_text())
          if data.get('status')!='ok':
              raise SystemExit('quotes.json is not current-session ok')
          vn=timezone(timedelta(hours=7))
          today=datetime.now(vn).date().isoformat()
          critical=('FPT','VCB','MBB','VIC')
          for symbol in critical:
              q=(data.get('quotes') or {}).get(symbol) or {}
              stamp=q.get('sourceTime')
              if not stamp:
                  raise SystemExit(f'{symbol}: missing sourceTime')
              dt=datetime.fromisoformat(stamp.replace('Z','+00:00'))
              if dt.astimezone(vn).date().isoformat()!=today:
                  raise SystemExit(f'{symbol}: stale sourceTime {stamp}')
          print('CURRENT SESSION OK',data.get('coverage'),data.get('latestSourceTime'))
          PY
