name: Apply guarded V21 frontend and AI patch

on:
  push:
    branches:
      - fix/vn30-defensive-fallback-20260825
    paths:
      - ".github/workflows/v21-apply-frontend-ai-patch.yml"
      - "scripts/apply_v21_frontend_ai_patch.py"

permissions:
  contents: write

concurrency:
  group: v21-apply-frontend-ai-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vn30-defensive-fallback-20260825
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact guarded replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_v21_frontend_ai_patch.py')
          s=p.read_text(encoding='utf-8')
          old='''    if count != 1:\n        raise RuntimeError(f"{label}: expected exactly one match, found {count}")\n    path.write_text(text.replace(old, new, 1), encoding="utf-8")'''
          new='''    allowed_double = label == "filtered session overlay first occurrence" and count == 2\n    if count != 1 and not allowed_double:\n        raise RuntimeError(f"{label}: expected exactly one match, found {count}")\n    path.write_text(text.replace(old, new, 1), encoding="utf-8")'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python scripts/apply_v21_frontend_ai_patch.py
      - name: Syntax and contract checks
        run: |
          node --check forecast-live-leaders-v14.js
          node --check solution-ai-v17.js
          node --check api/solution-ai.js
          grep -Fq '}, 3000);' forecast-live-leaders-v14.js
          grep -Fq 'forecast-session-v21.json' forecast-live-leaders-v14.js
          grep -Fq 'HOSE · 5 PHIÊN TỚI' forecast-live-leaders-v14.js
          grep -Fq 'solutionAiGeminiWeb' forecast-final.html
          grep -Fq 'Không mở đầu hoặc kết thúc bằng disclaimer chung' solution-ai-v17.js
      - name: Commit patch only to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast-live-leaders-v14.js solution-ai-v17.js forecast-final.html api/solution-ai.js
          git diff --cached --check
          git commit -m "Upgrade full-HOSE session leaders and smarter AI fallback"
          git push origin HEAD:fix/vn30-defensive-fallback-20260825
