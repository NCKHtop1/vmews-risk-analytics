name: V12 fast status observer
on:
  workflow_run:
    workflows: ['V12 methodfix fast gate']
    types: [completed]
permissions:
  contents: read
  statuses: write
jobs:
  publish:
    if: github.event.workflow_run.head_branch == 'forecast-v12-methodfix'
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact run URL and conclusion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          state=failure
          desc="V12 exact-head fast gate ${CONCLUSION}"
          if [ "${CONCLUSION}" = 'success' ]; then state=success; fi
          if [ "${CONCLUSION}" = 'cancelled' ]; then state=error; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="${state}" \
            -f context='V12 methodfix fast gate' \
            -f description="${desc}" \
            -f target_url="${RUN_URL}"
          echo "Published ${state} for ${HEAD_SHA}: ${RUN_URL}"
