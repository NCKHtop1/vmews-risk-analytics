name: V12 resilient source freeze
on:
  workflow_dispatch:
  push:
    branches: [forecast-v12-methodfix]
    paths: ['v12-source-freeze-resilient-trigger.txt']
permissions:
  contents: write
concurrency:
  group: vmews-v12-source-freeze
  cancel-in-progress: true
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      V12_MIN_ROWS: '520'
      V12_VNSTOCK_INTERVAL: '3.25'
      V12_MAX_RAW_RETURN_GUARD: '0.12'
      V12_CROSS_SOURCE_MAD_LIMIT: '0.003'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Pin immutable capture source
        run: echo "V12_FREEZE_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-v12.txt
      - run: pip install --disable-pip-version-check -q -r requirements-v12.txt
      - name: Compile and deterministic regressions
        run: |
          python -m py_compile scripts/v12_data_sources.py scripts/v12_corporate_actions.py scripts/v12_corporate_actions_test.py scripts/v12_source_capture.py scripts/v12_source_capture_methodfix.py scripts/v12_source_capture_methodfix_test.py scripts/v12_reference_resilience.py scripts/v12_reference_resilience_test.py scripts/freeze_v12_source_snapshot.py scripts/freeze_v12_source_snapshot_resilient.py scripts/v12_universe.py scripts/v12_research_sources.py
          PYTHONPATH=scripts python scripts/v12_corporate_actions_test.py
          PYTHONPATH=scripts python scripts/v12_source_capture_methodfix_test.py
          PYTHONPATH=scripts python scripts/v12_reference_resilience_test.py
          PYTHONPATH=scripts python - <<'PY'
          import v12_source_capture as c
          c.reset_provider_circuits(); calls=[]; old=c.base._provider_history
          def fail(*a,**k): calls.append(a); raise RuntimeError('ConnectTimeoutError: Max retries exceeded')
          c.base._provider_history=fail; attempts=[]
          assert c._capture_provider('AAA','KBS','2020-01-01','2026-01-01',attempts,'TEST') is None
          assert c._provider_state('KBS')['open'] is True and len(calls)==1
          assert c._capture_provider('AAM','KBS','2020-01-01','2026-01-01',attempts,'TEST') is None and len(calls)==1
          c.base._provider_history=old;c.reset_provider_circuits();print('V12 PROVIDER OUTAGE CIRCUIT PASS')
          PY
      - name: Capture resilient immutable source with strict continuity salvage
        run: PYTHONPATH=scripts python scripts/freeze_v12_source_snapshot_resilient.py
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-source-freeze-diagnostic-${{ github.run_id }}
          path: data/v12-source-freeze-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify immutable source gates
        run: |
          python - <<'PY'
          import gzip,hashlib,json,pathlib
          p=pathlib.Path('data/v12-frozen-source.json.gz');m=json.load(open('data/v12-frozen-source-manifest.json',encoding='utf-8'));b=p.read_bytes()
          assert p.stat().st_size>1_000_000 and hashlib.sha256(b).hexdigest()==m['snapshotFileSha256']
          z=json.loads(gzip.decompress(b).decode());assert z['version']=='VMEWS-FROZEN-SOURCE-12.1.0' and m['version']=='VMEWS-FROZEN-SOURCE-MANIFEST-12.1.0'
          assert m['currentSourceCoverageRatio']>=.98 and m['deepHistory']>=360 and m['modelEligible']>=360,m
          assert m['corporateActionVerifiedRatio']>=.98 and m['crossSourceMADP95']<=.003,m
          assert int(m['vnstockPrimaryAttempted'])/max(1,int(m['currentHOSERequested']))>=.95,m
          print('V12 RESILIENT SOURCE FREEZE PASS',m['modelEligible'],m['corporateActionVerifiedRatio'],m['snapshotFileSha256'])
          PY
      - name: Publish immutable source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$V12_FREEZE_SOURCE_SHA"
          git fetch origin forecast-v12-methodfix
          test "$(git rev-parse origin/forecast-v12-methodfix)" = "$V12_FREEZE_SOURCE_SHA" || { echo 'BRANCH ADVANCED; refusing stale snapshot'; exit 1; }
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v12-frozen-source.json.gz data/v12-frozen-source-manifest.json
          git commit -m 'Publish immutable V12 research source snapshot [no-full]'
          git push origin HEAD:forecast-v12-methodfix
