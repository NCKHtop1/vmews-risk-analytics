name: Forecast V9 relative-alpha audit
on:
  push:
    branches: [forecast-v6-research-grade]
    paths: ['scripts/train_forecast_v9.py','.github/workflows/forecast-v8-audit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forecast-v6-research-grade
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy scikit-learn
      - run: python scripts/train_forecast_v9.py
      - name: Persist audited model
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/forecast-model-v9.json
          git diff --cached --quiet || git commit -m "Update forecast v9 artifact"
          git push origin HEAD:forecast-v6-research-grade
