name: Forecast V8 market-regime audit
on:
  push:
    branches: [forecast-v6-research-grade]
    paths: ['scripts/train_forecast_v8.py','scripts/run_forecast_v8_patched.py','.github/workflows/forecast-v8-audit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forecast-v6-research-grade
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy scikit-learn
      - run: python scripts/run_forecast_v8_patched.py
      - uses: actions/upload-artifact@v4
        with:
          name: forecast-v8-artifacts
          path: |
            data/forecast-model-v8.json
            forecast-validation-v8.json
