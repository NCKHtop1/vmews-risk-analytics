name: Validate FinQuery intraday risk replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'financial-report/scripts/refresh_market.py'
      - 'financial-report/scripts/build_intraday_risk_replay.cjs'
      - 'financial-report/scripts/risk_model_v2.cjs'
      - 'financial-report/scripts/build_market_risk_calibration.cjs'
      - 'financial-report/tests/test_market.py'
      - 'financial-report/tests/risk_monitor.test.cjs'
      - '.github/workflows/financial-market-refresh.yml'
      - '.github/workflows/risk-intraday-replay-validation.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run focused collector and risk tests
        run: |
          python -m unittest discover -s financial-report/tests -p 'test_market.py'
          node --test financial-report/tests/risk_monitor.test.cjs

      - name: Restore production market history
        run: |
          git fetch origin financial-market-data
          git worktree add /tmp/market-data origin/financial-market-data
          git -C /tmp/market-data sparse-checkout set market

      - name: Probe older Vietcap minute pages for FPT
        continue-on-error: true
        env:
          INTRADAY_PAGE_SIZE: '700'
          INTRADAY_MAX_PAGES: '3'
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0,'financial-report/scripts')
          import refresh_market as m
          bars=m._full_intraday_history('FPT',1400)
          result={'count':len(bars),'first':bars[0]['time'] if bars else None,'last':bars[-1]['time'] if bars else None}
          print('INTRADAY BACKFILL PROBE',result)
          open('/tmp/intraday-backfill-probe.json','w').write(json.dumps(result))
          if len(bars)<=700:
              raise SystemExit('Vietcap minute pagination did not extend beyond the current 700-bar window')
          PY

      - name: Replay Risk V2 on retained intraday history
        run: |
          node financial-report/scripts/build_intraday_risk_replay.cjs /tmp/market-data/market /tmp/intraday-risk-replay.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/intraday-risk-replay.json'))
          assert d['days']>=2,d
          assert d['snapshots']>=20,d
          assert d['status'] in ('LIMITED_INTRADAY_HISTORY','READY_FOR_VALIDATION'),d['status']
          print('INTRADAY REPLAY', {
              'status':d['status'],'days':d['days'],'eventDays':d['eventDays'],
              'snapshots':d['snapshots'],'detection':d['detection'],
              'thresholdStats':d['thresholdStats']
          })
          gaps=sorted(d.get('empiricalVolumeClock') or [],key=lambda x:abs(x.get('gap') or 0),reverse=True)[:10]
          print('LARGEST VOLUME-CLOCK GAPS',gaps)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finquery-intraday-risk-replay
          path: |
            /tmp/intraday-risk-replay.json
            /tmp/intraday-backfill-probe.json
          if-no-files-found: ignore
          retention-days: 7
