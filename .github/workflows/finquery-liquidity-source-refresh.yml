name: Refresh FinQuery ON and VBMA FX Swap sources
on:
  pull_request:
    paths:
      - 'financial-report/scripts/refresh_liquidity.py'
      - 'financial-report/scripts/test_refresh_liquidity.py'
      - 'financial-report/scripts/test_vbma_curve_reader.py'
      - 'financial-report/scripts/vbma_curve_reader.py'
      - '.github/workflows/finquery-liquidity-source-refresh.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'financial-report/scripts/refresh_liquidity.py'
      - 'financial-report/scripts/test_refresh_liquidity.py'
      - '.github/workflows/finquery-liquidity-source-refresh.yml'
  schedule:
    - cron: '25 10 * * 1-5'
permissions:
  contents: write
concurrency:
  group: finquery-liquidity-source-owned-data-only
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Guarded ON and FX Swap offline QA
        run: |
          python -m py_compile financial-report/scripts/refresh_liquidity.py financial-report/scripts/test_refresh_liquidity.py
          python -m unittest discover -s financial-report/scripts -p test_refresh_liquidity.py -v
          python -m unittest discover -s financial-report/scripts -p test_vbma_curve_reader.py -v
  publisher:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          sparse-checkout: financial-report
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Restore independent data branch
        run: |
          git fetch origin financial-market-data
          git worktree add /tmp/finquery-liquidity origin/financial-market-data
          git -C /tmp/finquery-liquidity sparse-checkout set market
          test -f /tmp/finquery-liquidity/market/finquery-liquidity.json
      - name: Refresh source only, fail closed on missing observations
        run: |
          python financial-report/scripts/refresh_liquidity.py --snapshot /tmp/finquery-liquidity/market/finquery-liquidity.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/finquery-liquidity/market/finquery-liquidity.json').read_text())
          assert d['schemaVersion']==1
          assert d['derivatives']['allowedInstruments']==['VN30_FUTURES','VN100_FUTURES']
          assert d['derivatives']['equityListedHNXIncluded'] is False
          assert all(isinstance(x['value'],(int,float)) and 0<=x['value']<=25 for x in d['interbank']['observations'])
          if d['vbmaSwap']['status']=='verified':
              assert d['vbmaSwap']['licenseStatus']=='approved' and d['vbmaSwap']['unit']=='swap points'
          print('FinQuery liquidity source publish contract PASS')
          PY
      - name: Publish only owned dataset
        run: |
          set -euo pipefail
          git -C /tmp/finquery-liquidity config user.name 'github-actions[bot]'
          git -C /tmp/finquery-liquidity config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/finquery-liquidity add --sparse market/finquery-liquidity.json
          if git -C /tmp/finquery-liquidity diff --cached --quiet; then
            echo 'Snapshot unchanged'
            exit 0
          fi
          git -C /tmp/finquery-liquidity commit -m 'Refresh ON and VBMA source provenance [data-only]'
          for attempt in 1 2 3; do
            git -C /tmp/finquery-liquidity fetch origin financial-market-data
            if git -C /tmp/finquery-liquidity rebase origin/financial-market-data && git -C /tmp/finquery-liquidity push origin HEAD:refs/heads/financial-market-data; then
              exit 0
            fi
            git -C /tmp/finquery-liquidity rebase --abort || true
            sleep $((attempt*2))
          done
          exit 1
