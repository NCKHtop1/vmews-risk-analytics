name: Refresh live HOSE minute candles

# Dedicated long-lived publisher. It never shares the live-price concurrency
# group, so minute-bar recovery cannot delay the five-minute quote publisher.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/market-intraday-live.yml'
      - 'financial-report/scripts/refresh_market.py'
      - 'financial-report/scripts/live_intraday_publisher.sh'
      - 'financial-report/scripts/finalize_intraday_archive.py'
  schedule:
    - cron: '55 1 * * 1-5'  # 08:55 Vietnam
    - cron: '0 2 * * 1-5'   # 09:00 redundant morning bootstrap
    - cron: '55 5 * * 1-5'  # 12:55 Vietnam
    - cron: '0 6 * * 1-5'   # 13:00 redundant afternoon bootstrap

permissions:
  contents: write

concurrency:
  group: market-intraday-live
  # A code push hands over immediately to repaired logic. Scheduled/manual
  # heartbeats never interrupt a healthy long-running publisher.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: financial-report
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check HOSE minute-candle window
        id: session
        shell: bash
        run: |
          hhmm=$(TZ=Asia/Ho_Chi_Minh date +%H%M)
          run=false
          oneshot=0
          if { [ "$hhmm" -ge 0855 ] && [ "$hhmm" -le 1137 ]; } || { [ "$hhmm" -ge 1255 ] && [ "$hhmm" -le 1455 ]; }; then
            run=true
          else
            # A delayed GitHub cron or a code push outside the continuous window
            # must repair the current/last session once, not finish as a green no-op.
            run=true
            oneshot=1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "oneshot=$oneshot" >> "$GITHUB_OUTPUT"
          echo "VN time=$hhmm run=$run oneshot=$oneshot"

      - name: Restore latest market branch
        if: steps.session.outputs.run == 'true'
        shell: bash
        run: |
          git fetch origin financial-market-data
          git worktree add /tmp/market-intraday origin/financial-market-data
          git -C /tmp/market-intraday sparse-checkout set market
          git -C /tmp/market-intraday config user.name 'github-actions[bot]'
          git -C /tmp/market-intraday config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/market-intraday/market/intraday

      - name: Run resilient minute-candle publisher
        if: steps.session.outputs.run == 'true'
        env:
          INTRADAY_COUNT_BACK: '360'
          INTRADAY_RETRIES: '3'
          INTRADAY_RETRY_WORKERS: '1'
          INTRADAY_WORKERS: '2'
          INTRADAY_BACKFILL: '0'
          INTRADAY_RETAIN_1M_BARS: '700'
          INTRADAY_WRITE_ARCHIVE: '0'
          INTRADAY_MAX_QUOTE_LAG_MINUTES: '20'
          INTRADAY_PUBLISH_INTERVAL_SECONDS: '600'
          INTRADAY_MAX_CONSECUTIVE_FAILURES: '3'
          INTRADAY_ONESHOT: ${{ steps.session.outputs.oneshot }}
        run: |
          bash financial-report/scripts/live_intraday_publisher.sh /tmp/market-intraday
