name: FinQuery news parser CI

on:
  pull_request:
    paths:
      - 'financial-report/scripts/refresh_market.py'
      - 'financial-report/scripts/news_intelligence.py'
      - 'financial-report/scripts/refresh_business_plans.py'
      - 'financial-report/scripts/build_cdn.py'
      - 'financial-report/frontend/index.html'
      - 'financial-report/frontend/market.js'
      - 'financial-report/frontend/insights.js'
      - 'financial-report/frontend/research-agent.js'
      - 'financial-report/frontend/market.css'
      - 'financial-report/tests/test_news_parser.py'
      - 'financial-report/tests/test_news_intelligence.py'
      - '.github/workflows/finquery-news-parser-ci.yml'
      - '.github/workflows/finquery-bundle-sync.yml'
      - '.github/workflows/market-news-live.yml'
      - '.github/workflows/market-realtime-guard.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/financial-dashboard-browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'financial-report/scripts/refresh_market.py'
      - 'financial-report/scripts/build_cdn.py'
      - 'financial-report/frontend/index.html'
      - 'financial-report/frontend/market.js'
      - 'financial-report/tests/test_news_parser.py'
      - '.github/workflows/finquery-news-parser-ci.yml'
      - '.github/workflows/finquery-bundle-sync.yml'
      - '.github/workflows/market-news-live.yml'
      - '.github/workflows/market-realtime-guard.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/financial-dashboard-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile news intelligence collectors
        run: python -m py_compile financial-report/scripts/refresh_market.py financial-report/scripts/news_intelligence.py financial-report/scripts/refresh_business_plans.py
      - name: Run focused news parser regressions
        run: |
          python financial-report/tests/test_news_parser.py
          python financial-report/tests/test_news_intelligence.py
          node --check financial-report/frontend/market.js
          node --check financial-report/frontend/insights.js
          node --check financial-report/frontend/research-agent.js
      - name: Build standalone FinQuery and verify News bundle contract
        run: |
          python financial-report/scripts/build_cdn.py
          python - <<'PY'
          from pathlib import Path
          page=Path('financial-report/index.html').read_text(encoding='utf-8')
          required=[
              'news-company-latest.json',
              'function newsTimeLabel(r)',
              r'\bomo\b',
              r'fpt\s+(?:retail|securities)\b',
              'function strictCompanyNews(',
              '24hmoney.vn',
              'newsPriority',
              'business-plans.json',
              'news-daily-brief.json',
              'news-viewpoint-sentiment.json',
              'Bản tin 24h',
              'Góc nhìn thị trường',
              'function renderNewsIntelligenceSummary()',
          ]
          missing=[x for x in required if x not in page]
          assert not missing,('standalone News bundle is stale/incomplete',missing)
          print('NEWS BUNDLE CONTRACT PASS',len(page),required)
          PY
      - name: Verify News-to-Pages handoff contract
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/market-news-live.yml').read_text(encoding='utf-8')
          required=[
              'actions: write',
              'gh workflow run pages.yml --ref main',
              'Pages deploy requested for the new News snapshot.',
              'if [ "$published" -ne 1 ]; then',
              'news-daily-brief.json',
              'news-viewpoint-sentiment.json',
          ]
          missing=[x for x in required if x not in workflow]
          assert not missing,('News-to-Pages handoff contract incomplete',missing)
          handover_required=[
              'financial-report/scripts/news_intelligence.py',
              'local_intelligence=',
              'main_intelligence=',
              '"$local_intelligence" != "$main_intelligence"',
          ]
          missing=[x for x in handover_required if x not in workflow]
          assert not missing,('News publisher handover guard incomplete',missing)
          publish_pos=workflow.index('git -C /tmp/market-news push origin HEAD:refs/heads/financial-market-data')
          dispatch_pos=workflow.index('gh workflow run pages.yml --ref main')
          assert dispatch_pos>publish_pos,('Pages dispatch must occur after market-data push',publish_pos,dispatch_pos)
          print('NEWS TO PAGES HANDOFF PASS',required)
          pages=Path('.github/workflows/pages.yml').read_text(encoding='utf-8')
          assert 'name: github-pages-' in pages, 'Pages upload artifact name is not attempt-scoped'
          assert 'artifact_name: github-pages-' in pages, 'Pages deploy artifact name is not attempt-scoped'
          assert pages.count('github.run_attempt')>=2, 'Pages upload/deploy must both use github.run_attempt'
          print('PAGES RERUN ARTIFACT CONTRACT PASS')
          PY
