name: FinQuery Market UX and Quant release gate
on:
  pull_request:
    paths:
      - 'financial-report/frontend/workspace-tabs.js'
      - 'financial-report/frontend/ownership-intelligence.js'
      - 'financial-report/frontend/alpha-radar.js'
      - 'financial-report/frontend/chart-engine.js'
      - 'financial-report/frontend/derivatives-market.js'
      - 'financial-report/frontend/index.html'
      - 'financial-report/frontend/market.css'
      - 'financial-report/tests/chart_indicator_browser.py'
      - 'financial-report/tests/workspace_tabs.test.cjs'
      - 'financial-report/tests/ownership_intelligence.test.cjs'
      - 'financial-report/tests/alpha_radar.test.cjs'
      - 'financial-report/tests/vi_ui_copy.test.cjs'
      - '.github/workflows/finquery-market-ux-release-gate.yml'
  push:
    branches: [main]
    paths:
      - 'financial-report/frontend/workspace-tabs.js'
      - 'financial-report/frontend/ownership-intelligence.js'
      - 'financial-report/frontend/alpha-radar.js'
      - 'financial-report/frontend/chart-engine.js'
      - 'financial-report/frontend/derivatives-market.js'
      - 'financial-report/frontend/index.html'
      - 'financial-report/frontend/market.css'
      - 'financial-report/tests/chart_indicator_browser.py'
      - '.github/workflows/finquery-market-ux-release-gate.yml'
permissions:
  contents: read
jobs:
  component-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check source syntax
        run: |
          node --check financial-report/frontend/chart-engine.js
          node --check financial-report/frontend/workspace-tabs.js
          node --check financial-report/frontend/derivatives-market.js
          node --check financial-report/frontend/ownership-intelligence.js
          node --check financial-report/frontend/alpha-radar.js
          for file in financial-report/frontend/*.js; do node --check "$file"; done
          python -m py_compile financial-report/scripts/vbma_curve_reader.py
          python -m py_compile financial-report/scripts/scan_private_alpha.py
      - name: Quant contracts, ownership and UI regression
        run: |
          node --test financial-report/tests/workspace_tabs.test.cjs
          node --test financial-report/tests/ownership_intelligence.test.cjs
          node --test financial-report/tests/alpha_radar.test.cjs
          node --test financial-report/tests/vi_ui_copy.test.cjs
          node --test financial-report/tests/derivatives_market.test.cjs
          node --test financial-report/tests/liquidity_derivatives.test.cjs
          python -m unittest discover -s financial-report/scripts -p test_vbma_curve_reader.py -v
          python -m unittest discover -s financial-report/scripts -p test_scan_private_alpha.py -v
      - name: Production bundle gate
        run: |
          python financial-report/scripts/build_cdn.py
          python - <<'PY'
          from pathlib import Path
          t=Path('financial-report/index.html').read_text()
          for marker in ('window.FinDerivativeQuotes=', 'window.FinWorkspaceTabs=', 'window.FinOwnership=', 'window.FinAlphaRadar=', 'id="money-on"', 'id="chart-oscillator-focus"'):
              assert marker in t, marker
          assert t.count('id="money-futures-live"')==1
          assert t.index('id="money-futures-live"')<t.index('id="macro-liquidity-overview"')
          assert '<script defer src="workspace-tabs.js">' not in t
          print('MARKET_UX_QUANT_BUNDLE_GATE_PASS')
          PY
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: pip install --disable-pip-version-check -q selenium==4.36.0
      - name: Stress 19 indicator toggles in real Chrome at four widths
        run: python financial-report/tests/chart_indicator_browser.py
