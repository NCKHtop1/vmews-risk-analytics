name: HOSE official disclosure probe
on:
  push:
    branches: [forecast-v11-production]
    paths:
      - 'scripts/probe_hose_official.py'
      - '.github/workflows/hose-official-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests
      - run: python scripts/probe_hose_official.py
