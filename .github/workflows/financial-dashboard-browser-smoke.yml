name: Financial dashboard browser smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/financial-dashboard-browser-smoke.yml'
  workflow_run:
    workflows: ['Deploy VMEWS Pages']
    types: [completed]
  schedule:
    # 16:35 Vietnam time, after the completed trading session and final data deploy.
    - cron: '35 9 * * 1-5'

permissions:
  contents: read

concurrency:
  group: financial-dashboard-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser smoke dependency
        run: pip install --disable-pip-version-check -q selenium==4.36.0
      - name: Exercise production chart, ideas, macro, scanner and Dolphin local analysis
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          python - <<'PY'
          import shutil
          import time
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from selenium import webdriver
          from selenium.common.exceptions import StaleElementReferenceException
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.support.ui import WebDriverWait

          URL='https://nckhtop1.github.io/vmews-risk-analytics/financial-report/?symbol=FPT&mode=year#market'
          DEPLOYMENT='https://nckhtop1.github.io/vmews-risk-analytics/financial-report/deployment.json'
          expected=os.environ.get('EXPECTED_SHA','').strip()
          if expected:
              actual=''
              for attempt in range(8):
                  with urllib.request.urlopen(DEPLOYMENT+'?smoke='+str(int(time.time()*1000)),timeout=20) as r:
                      deployed=json.load(r)
                  actual=str(deployed.get('code') or '')
                  if actual == expected:
                      break
                  time.sleep(min(2+attempt*2,10))
              if actual != expected:
                  raise AssertionError(f'Pages deployment mismatch after bounded propagation wait: production={actual} expected={expected}')

          options=Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--disable-gpu')
          options.add_argument('--window-size=1440,1200')

          driver_path=shutil.which('chromedriver')
          service=Service(driver_path) if driver_path else Service()
          driver=webdriver.Chrome(service=service,options=options)
          wait=WebDriverWait(driver,60)

          def click_dynamic_control(element_id, attempts=4):
              # FinQuery updates the strategy panel during live refreshes.
              # Re-locate a newly rendered button; never suppress a failed action.
              for attempt in range(attempts):
                  try:
                      driver.find_element('id', element_id).click()
                      return
                  except StaleElementReferenceException:
                      if attempt + 1 >= attempts:
                          raise
                      time.sleep(0.3)

          try:
              driver.get(URL)
              # Do not store protected passcodes in CI. Authorized smoke access is
              # enabled through the same session flags set by the successful gates.
              driver.execute_script("""
                sessionStorage.setItem('finquery-site-access','1');
                sessionStorage.setItem('finquery-technical-access','1');
                sessionStorage.setItem('finquery-macro-access','1');
              """)
              driver.refresh()

              wait.until(lambda d:d.execute_script("""
                return Boolean(
                  window.FinQueryAI &&
                  window.FinancialMarket &&
                  window.FinancialReportContext &&
                  window.FinTechnicalScanner &&
                  window.FinStrategyBuilder &&
                  window.FinStrategyIntelligence &&
                  window.FinResearchAgent &&
                  window.FinRiskMonitor &&
                  window.FinSectionCollapse &&
                  window.FinMacro
                );
              """))
              initial_views=driver.execute_script("""
                return {
                  strategySectionHidden:document.getElementById('strategy-builder')?.hidden===true,
                  strategyBodyVisible:document.getElementById('strategy-body')?.hidden===false,
                  ideas:document.getElementById('investment-ideas-body')?.hidden===true,
                  macro:document.getElementById('macro-body')?.hidden===true,
                  chevrons:document.querySelectorAll('.section-chevron-icon svg').length
                };
              """)
              if not all([initial_views.get('strategySectionHidden'),initial_views.get('strategyBodyVisible'),initial_views.get('ideas'),initial_views.get('macro')]) or int(initial_views.get('chevrons') or 0)!=2:
                  raise AssertionError(f'Platform view defaults are incorrect: {initial_views}')

              driver.execute_script("document.querySelector('[data-platform-view=\"strategy\"]')?.click();")
              wait.until(lambda d:d.execute_script("""
                return (
                  document.getElementById('strategy-builder')?.hidden===false &&
                  document.getElementById('strategy-body')?.hidden===false &&
                  document.querySelector('.workspace')?.hidden===true &&
                  document.querySelector('[data-platform-view="strategy"]')?.classList.contains('active')
                );
              """))
              driver.execute_script("window.FinPlatformViews.openAnalysis(); document.getElementById('investment-ideas-toggle')?.click(); document.getElementById('macro-toggle')?.click();")
              wait.until(lambda d:d.execute_script("""
                return (
                  document.getElementById('strategy-builder')?.hidden===true &&
                  document.querySelector('.workspace')?.hidden===false &&
                  document.getElementById('investment-ideas-body')?.hidden===false &&
                  document.getElementById('macro-body')?.hidden===false &&
                  document.querySelectorAll('.section-chevron.is-open').length===2
                );
              """))

              local_open=datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=7)))
              open_seconds=local_open.hour*3600+local_open.minute*60+local_open.second
              if local_open.weekday()<5 and 9*3600<=open_seconds<9*3600+5*60:
                  wait_seconds=9*3600+5*60-open_seconds+2
                  print(f'Opening grace: waiting {wait_seconds}s for the first validated live snapshot')
                  time.sleep(wait_seconds)
                  driver.refresh()
                  wait.until(lambda d:d.execute_script("return document.readyState==='complete';"))
              # The last completed session remains visible after midnight, but
              # FinancialMarket.context().quote is deliberately live-only.
              vn_open=(local_open.weekday()<5 and (
                  9*3600<=open_seconds<=11*3600+30*60 or
                  13*3600<=open_seconds<=14*3600+45*60
              ))
              if vn_open:
                  wait.until(lambda d:d.execute_script("""
                    const q=window.FinancialMarket?.context?.()?.quote;
                    return Boolean(q && Number(q.price)>0);
                  """))
              else:
                  wait.until(lambda d:d.execute_script("""
                    const price=(document.getElementById('quote-price')?.textContent||'').trim();
                    return /[1-9][0-9.,]*\s*đ/.test(price);
                  """))
              freshness_ui=driver.execute_script("""
                const warning=document.getElementById('quote-freshness');
                const quoteTime=(document.getElementById('quote-time')?.textContent||'').trim();
                return {
                  warningHidden:warning?.hidden===true,
                  warningText:(warning?.textContent||'').trim(),
                  quoteTime
                };
              """)
              if (vn_open and not freshness_ui.get('warningHidden')) or 'Nguồn quá' in freshness_ui.get('warningText','') or 'không dùng như giá live' in freshness_ui.get('warningText',''):
                  raise AssertionError(f'Legacy minute-age live warning resurfaced: {freshness_ui}')
              quote_time=freshness_ui.get('quoteTime','')
              lowered=quote_time.lower()
              if any(x in lowered for x in ['vietcap','giá chốt phiên','cập nhật trong phiên','giá chốt phiên gần nhất']):
                  raise AssertionError(f'Quote subtitle must contain timestamp only: {freshness_ui}')
              if not re.search(r'\d{1,2}:\d{2}.*\d{1,2}/\d{1,2}/\d{2,4}',quote_time):
                  raise AssertionError(f'Quote subtitle is missing timestamp: {freshness_ui}')
              watch_label=(driver.find_element('id','today-watch-label').text or '').strip()
              if 'ĐÁNG XEM PHIÊN GẦN NHẤT' in watch_label:
                  raise AssertionError(f'Legacy nearest-session watch title resurfaced: {watch_label}')
              wait.until(lambda d:d.execute_script("""
                return Boolean(document.querySelector('#price-chart canvas'));
              """))
              wait.until(lambda d:d.execute_script("""
                return Boolean(window.FinancialReportContext?.raw?.());
              """))
              wait.until(lambda d:d.execute_script("""
                const c=window.FinMacro?.context?.();
                return Boolean(c && c.datasets && Object.keys(c.datasets).length>=3);
              """))
              wait.until(lambda d:d.execute_script("""
                const c=window.FinTechnicalScanner?.context?.();
                return Boolean(c && c.current && c.current.symbol==='FPT');
              """))
              wait.until(lambda d:d.execute_script("""
                const el=document.getElementById('idea-report-list');
                return Boolean(el && el.textContent.trim().length>20);
              """))
              wait.until(lambda d:d.execute_script("""
                const c=window.FinStrategyBuilder?.context?.();
                return Boolean(c && c.snapshot && Object.keys(c.snapshot.symbols||{}).length>=100 && document.querySelectorAll('[data-strategy-indicator]').length>=20);
              """))
              driver.execute_script("""
                document.querySelector('[data-strategy-preset="macd_rsi"]')?.click();
              """)
              wait.until(lambda d:d.execute_script("""
                const c=window.FinStrategyBuilder?.context?.();
                return Boolean(c && c.strategy && c.strategy.conditions && c.strategy.conditions.length===2);
              """))

              # Exercise the real Strategy Agent actions, not just the underlying APIs.
              driver.execute_script("""
                window.FinPlatformViews.openStrategy();
                window.FinStrategyIntelligence.selectSymbol('HCM');
              """)
              wait.until(lambda d:d.execute_script("""
                return Boolean(
                  document.getElementById('strategy-builder')?.hidden===false &&
                  document.getElementById('sai-open-symbol') &&
                  document.getElementById('sai-query-ai') &&
                  (document.querySelector('#sai-investment-view h3')?.textContent||'').includes('HCM')
                );
              """))
              click_dynamic_control('sai-open-symbol')
              wait.until(lambda d:d.execute_script("""
                const m=window.FinancialMarket?.context?.();
                return Boolean(
                  document.querySelector('.workspace')?.hidden===false &&
                  document.getElementById('strategy-builder')?.hidden===true &&
                  m?.symbol==='HCM' &&
                  document.querySelector('[data-market-view="price"]')?.classList.contains('active') &&
                  document.getElementById('chart-terminal')?.hidden===false &&
                  (document.getElementById('price-readout')?.textContent||'').startsWith('HCM')
                );
              """))
              chart_action=driver.execute_script("""
                return {
                  symbol:window.FinancialMarket?.context?.()?.symbol||null,
                  hash:location.hash,
                  chartHidden:document.getElementById('chart-terminal')?.hidden,
                  view:document.querySelector('[data-market-view="price"]')?.classList.contains('active'),
                  readout:(document.getElementById('price-readout')?.textContent||'').slice(0,120)
                };
              """)
              if chart_action.get('symbol')!='HCM' or chart_action.get('hash')!='#market' or chart_action.get('chartHidden') or not chart_action.get('view'):
                  raise AssertionError(f'Strategy Agent open-chart action failed: {chart_action}')

              driver.execute_script("""
                window.FinPlatformViews.openStrategy();
                window.FinStrategyIntelligence.selectSymbol('HCM');
              """)
              wait.until(lambda d:d.execute_script("return Boolean(document.getElementById('sai-query-ai'));"))
              click_dynamic_control('sai-query-ai')
              wait.until(lambda d:d.execute_script("""
                const drawer=document.getElementById('research-ai'),backdrop=document.getElementById('ai-backdrop');
                return Boolean(
                  drawer && drawer.hidden===false && drawer.classList.contains('open') &&
                  drawer.parentElement===document.body &&
                  backdrop?.parentElement===document.body &&
                  document.getElementById('strategy-builder')?.hidden===false
                );
              """))
              ai_action=driver.execute_script("""
                return {
                  drawerOpen:document.getElementById('research-ai')?.classList.contains('open'),
                  drawerGlobal:document.getElementById('research-ai')?.parentElement===document.body,
                  strategyVisible:document.getElementById('strategy-builder')?.hidden===false,
                  userText:[...document.querySelectorAll('#research-ai-messages .user')].map(x=>x.textContent||'').join(' ')
                };
              """)
              if not ai_action.get('drawerOpen') or not ai_action.get('drawerGlobal') or not ai_action.get('strategyVisible') or 'HCM' not in ai_action.get('userText',''):
                  raise AssertionError(f'Strategy Agent deep-analysis action failed: {ai_action}')
              driver.execute_script("window.FinQueryAI.close();")

              # A Liquid symbol outside the financial-report universe must still be
              # routable through market/strategy analysis, without leaking stale BCTC.
              market_only=driver.execute_async_script("""
                const done=arguments[arguments.length-1];
                window.FinResearchAgent.run('Phân tích chuyên sâu AAA theo kỹ thuật và rủi ro hiện tại.')
                  .then(x=>done({
                    activeSymbol:x?.audit?.symbol?.activeSymbol||null,
                    marketSymbol:x?.context?.agent?.evidence?.market?.symbol||null,
                    hasFinancial:Boolean(x?.context?.agent?.evidence?.financial),
                    status:x?.context?.agent?.validation?.status||null
                  }))
                  .catch(e=>done({error:String(e),code:e?.code||null}));
              """)
              if market_only.get('error') or market_only.get('activeSymbol')!='AAA' or market_only.get('marketSymbol')!='AAA' or market_only.get('hasFinancial'):
                  raise AssertionError(f'Market-only Strategy/Research routing failed: {market_only}')

              driver.execute_async_script("""
                const done=arguments[arguments.length-1];
                window.FinancialMarket.openChart('FPT');
                window.FinancialReportContext.select('FPT').then(()=>done(true)).catch(()=>done(false));
              """)
              wait.until(lambda d:d.execute_script("return window.FinancialMarket?.context?.()?.symbol==='FPT';"))

              driver.execute_script("""
                document.querySelector('[data-market-view="scanner"]')?.click();
              """)
              wait.until(lambda d:d.execute_script("""
                return document.querySelectorAll('#technical-scanner-rows tr').length>0;
              """))

              checks=[
                ('Vì sao mã này tăng hoặc giảm trong phiên hôm nay?','movement'),
                ('Phân tích sức khỏe tài chính của doanh nghiệp này.','financial'),
                ('Các rủi ro định lượng chính hiện tại là gì?','risk'),
                ('So sánh kỳ gần nhất với kỳ trước và cùng kỳ.','compare'),
                ('ROE là gì?','concept'),
                ('Phân tích bối cảnh lãi suất và vĩ mô hiện tại.','macro'),
              ]
              results=[]
              for question,expected in checks:
                  result=driver.execute_script(
                    "return window.FinQueryAI.analyze(arguments[0]);",question
                  )
                  if not isinstance(result,dict):
                      raise AssertionError(f'AI result is not an object for {question!r}: {result!r}')
                  actual=result.get('type')
                  html=str(result.get('html') or '')
                  if actual!=expected:
                      raise AssertionError(f'AI classifier mismatch for {question!r}: {actual!r} != {expected!r}')
                  if len(html)<80:
                      raise AssertionError(f'AI local response too short for {question!r}: {len(html)}')
                  if 'undefined' in html.lower() or '>nan<' in html.lower():
                      raise AssertionError(f'AI local response contains invalid values for {question!r}')
                  results.append((expected,len(html)))

              # A publisher commit is atomic, but the browser can straddle two
              # generations while raw GitHub and Pages caches converge. Give the UI
              # a bounded chance to resync; persistent misalignment still fails below.
              for _ in range(8):
                  aligned=driver.execute_script("""
                    const m=window.FinancialMarket?.context?.();
                    const s=window.FinTechnicalScanner?.context?.();
                    const st=window.FinStrategyBuilder?.context?.()?.snapshot;
                    const q=m?.quoteBundleSourceTime||null;
                    return Boolean(q && s?.sourceTime===q && st?.sourceTime===q);
                  """)
                  if aligned:
                      break
                  driver.execute_script("""
                    window.FinancialMarket?.refresh?.();
                    window.FinTechnicalScanner?.refresh?.();
                    window.FinStrategyBuilder?.refresh?.();
                  """)
                  time.sleep(3)

              snapshot=driver.execute_script("""
                const m=window.FinancialMarket.context();
                const s=window.FinTechnicalScanner.context();
                const macro=window.FinMacro.context();
                return {
                  symbol:m.symbol,
                  quote:m.quote,
                  quoteSourceTime:m.quote?.sourceTime||null,
                  quoteBundleSourceTime:m.quoteBundleSourceTime||null,
                  scanner:s?.current,
                  scannerCheckedAt:s?.checkedAt,
                  scannerSourceTime:s?.sourceTime||null,
                  macroCheckedAt:macro?.checkedAt,
                  newsCheckedAt:m.newsCheckedAt,
                  newsLiveFallback:m.newsLiveFallback,
                  newsCount:(m.news||[]).length+(m.marketNews||[]).length,
                  companyNews:(m.news||[]).map(x=>({title:x.title||'',symbols:x.symbols||[],source:x.source||''})),
                  financial:Boolean(window.FinancialReportContext.raw()),
                  ideaText:(document.getElementById('idea-report-list')?.textContent||'').trim().slice(0,180),
                  strategyCoverage:window.FinStrategyBuilder?.context?.()?.snapshot?.coverage||0,
                  strategySourceTime:window.FinStrategyBuilder?.context?.()?.snapshot?.sourceTime||null,
                  strategyConditions:window.FinStrategyBuilder?.context?.()?.strategy?.conditions?.length||0,
                  strategyLiveRows:Object.values(window.FinStrategyBuilder?.context?.()?.snapshot?.symbols||{}).filter(x=>x?.cadence==='LIVE_15M').length,
                  strategyLiveComparators:Object.values(window.FinStrategyBuilder?.context?.()?.snapshot?.symbols||{}).filter(x=>{
                    if(x?.cadence!=='LIVE_15M')return false;
                    const a=Number(x.current?.macdHistogram),b=Number(x.previous?.macdHistogram);
                    return Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a-b)>1e-9;
                  }).length
                };
              """)
              if snapshot.get('symbol')!='FPT':
                  raise AssertionError(f'Unexpected selected symbol: {snapshot}')
              if not snapshot.get('scanner'):
                  raise AssertionError(f'Scanner context missing: {snapshot}')
              if int(snapshot.get('strategyCoverage') or 0)<100 or int(snapshot.get('strategyConditions') or 0)!=2:
                  raise AssertionError(f'Strategy Lab context missing or incomplete: {snapshot}')
              if int(snapshot.get('strategyLiveRows') or 0)>=50 and int(snapshot.get('strategyLiveComparators') or 0)<5:
                  raise AssertionError(f'Live Strategy Lab previous/current comparator collapsed: {snapshot}')

              company_bundle=driver.execute_async_script("""
                const done=arguments[arguments.length-1];
                window.FinMarketData.get('news-company-latest.json')
                  .then(x=>done({checkedAt:x.checkedAt,companyCounts:x.companyCounts||{},items:(x.items||[]).length}))
                  .catch(e=>done({error:String(e)}));
              """)
              if company_bundle.get('error'):
                  raise AssertionError(f'Company news bundle unavailable: {company_bundle}')
              backend_fpt=int((company_bundle.get('companyCounts') or {}).get('FPT') or 0)
              browser_company=snapshot.get('companyNews') or []
              if backend_fpt>0 and len(browser_company)<1:
                  raise AssertionError(f'FPT company-news filter is blank despite backend coverage={backend_fpt}: {snapshot}')
              false_frt=[
                  row for row in browser_company
                  if re.search(r'\bFPT\s+(?:Retail|Securities)\b',str(row.get('title') or ''),re.I)
                  and 'FPT' not in [str(x).upper() for x in (row.get('symbols') or [])]
              ]
              if false_frt:
                  raise AssertionError(f'FRT/FPTS leaked into FPT company-news filter: {false_frt}')

              news_bundle=driver.execute_async_script("""
                const done=arguments[arguments.length-1];
                window.FinMarketData.get('news-latest.json')
                  .then(x=>done({checkedAt:x.checkedAt,items:(x.items||[]).map(r=>({title:r.title||'',source:r.source||'',region:r.region||'',topics:r.topics||[],impactTag:r.impactTag||''}))}))
                  .catch(e=>done({error:String(e)}));
              """)
              if news_bundle.get('error'):
                  raise AssertionError(f'Latest news bundle unavailable: {news_bundle}')
              false_sbv=[
                  row for row in (news_bundle.get('items') or [])
                  if row.get('region')=='global'
                  and 'sbv' in (row.get('topics') or [])
                  and re.search(r'tomorrow|\bSOMO\b|Moomoo',str(row.get('title') or '')+' '+str(row.get('source') or ''),re.I)
              ]
              if false_sbv:
                  raise AssertionError(f'Global OMO-substring false positives leaked into NHNN: {false_sbv[:5]}')

              watch=driver.execute_async_script("""
                const done=arguments[arguments.length-1];
                window.FinMarketData.get('watch-today.json')
                  .then(x=>done({status:x.status,checkedAt:x.checkedAt,sourceTime:x.sourceTime,items:(x.items||[]).length}))
                  .catch(e=>done({error:String(e)}));
              """)
              local=datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=7)))
              mins=local.hour*60+local.minute
              active=local.weekday()<5 and ((9*60<=mins<=11*60+30) or (13*60<=mins<=14*60+45))
              if active:
                  quote_source=snapshot.get('quoteSourceTime')
                  bundle_source=snapshot.get('quoteBundleSourceTime')
                  if not quote_source or not bundle_source:
                      raise AssertionError(f'Active session has no usable live quote/snapshot: {snapshot}')
                  qt=datetime.fromisoformat(str(quote_source).replace('Z','+00:00')).astimezone(timezone.utc)
                  quote_age=(datetime.now(timezone.utc)-qt).total_seconds()/60
                  if quote_age>20:
                      raise AssertionError(f'Active-session quote is stale: {quote_age:.1f} minutes; snapshot={snapshot}')
                  if str(snapshot.get('scannerSourceTime') or '')!=str(bundle_source):
                      raise AssertionError(f'Scanner is not aligned with quote snapshot: {snapshot}')
                  if str(snapshot.get('strategySourceTime') or '')!=str(bundle_source):
                      raise AssertionError(f'Strategy snapshot is not aligned with quote snapshot: {snapshot}')
                  if watch.get('error') or str(watch.get('sourceTime') or '')!=str(bundle_source):
                      raise AssertionError(f'Today-watch is not aligned with quote snapshot: watch={watch} snapshot={snapshot}')
              driver.execute_script("window.FinRiskMonitor.open();")
              wait.until(lambda d:d.execute_script("""
                const r=window.FinRiskMonitor?.context?.();
                return Boolean(
                  document.getElementById('risk-monitor')?.hidden===false &&
                  document.querySelector('.workspace')?.hidden===true &&
                  r && r.status==='ok' && Number.isFinite(Number(r.overall?.score)) &&
                  Number(r.coverage?.quotes||0)>=100 &&
                  Object.keys(r.components||{}).length===5 &&
                  Array.isArray(r.contributions) && r.contributions.length===5 &&
                  Array.isArray(r.timeline) && r.timeline.length>=2 &&
                  Number.isFinite(Number(r.trend?.previousScore)) &&
                  r.fundMonitor?.status==='ok' && Number(r.fundMonitor?.symbols||0)>0 &&
                  r.sectorCalibration?.status==='ok' && Number(r.sectorCalibration?.totalSectors||0)>=8
                );
              """))
              risk_snapshot=driver.execute_script("""
                const r=window.FinRiskMonitor.context();
                return {
                  score:r.overall?.score,
                  level:r.overall?.level?.label,
                  methodVersion:r.methodVersion,
                  sourceTime:r.sourceTime,
                  coverage:r.coverage?.quotes,
                  components:Object.keys(r.components||{}).length,
                  contributions:(r.contributions||[]).length,
                  timeline:(r.timeline||[]).length,
                  previousScore:r.trend?.previousScore,
                  trendDelta:r.trend?.delta,
                  comparisonLabel:r.trend?.comparisonLabel,
                  sectors:(r.sectors||[]).length,
                  alerts:(r.alerts||[]).length,
                  topRisk:(r.topRisk||[]).length,
                  fundStatus:r.fundMonitor?.status,
                  fundSymbols:r.fundMonitor?.symbols,
                  fundChanges:r.fundMonitor?.materialChanges,
                  fundPreviousAsOf:r.fundMonitor?.previousAsOf,
                  fundLastChangedAsOf:r.fundMonitor?.lastChangedAsOf,
                  fundAsOf:r.fundMonitor?.asOf,
                  activeSectorAlerts:(r.sectors||[]).filter(x=>x.alertActive===true).length,
                  riskBadgeHidden:document.getElementById('risk-nav-badge')?.hidden===true,
                  riskBadgeText:(document.getElementById('risk-nav-badge')?.textContent||'').trim(),
                  fundBars:document.querySelectorAll('#risk-fund-chart .risk-fund-bar').length,
                  fundNonZeroBars:[...document.querySelectorAll('#risk-fund-chart .risk-fund-bar>small')].filter(x=>!/Không đổi/i.test(x.textContent||'')).length,
                  fundSummary:document.querySelectorAll('#risk-fund-summary > div').length,
                  sectorCalibration:r.sectorCalibration?.status,
                  heatCells:document.querySelectorAll('#risk-sectors .risk-sector-heat-cell').length,
                  heatUp:document.querySelectorAll('#risk-sectors .risk-heat-up').length,
                  heatDown:document.querySelectorAll('#risk-sectors .risk-heat-down').length,
                  heatUpdated:(document.getElementById('risk-sector-updated')?.textContent||'').trim(),
                  breadthButtons:document.querySelectorAll('#risk-market-counts [data-breadth-group]').length,
                  scoreText:(document.getElementById('risk-score')?.textContent||'').trim(),
                  rows:document.querySelectorAll('#risk-stock-rows tr').length,
                  contributionRows:document.querySelectorAll('#risk-contributions .risk-contribution-row').length,
                  breadthParts:document.querySelectorAll('#risk-breadth-strip span').length,
                  sectorTiles:document.querySelectorAll('#risk-sectors .risk-sector-tile').length,
                  trendText:(document.getElementById('risk-trend')?.textContent||'').trim(),
                  text:(document.getElementById('risk-monitor')?.innerText||'')
                };
              """)
              if str(risk_snapshot.get('sourceTime') or '')!=str(snapshot.get('quoteBundleSourceTime') or ''):
                  raise AssertionError(f'Risk monitor is not aligned with quote snapshot: risk={risk_snapshot} snapshot={snapshot}')
              if str(risk_snapshot.get('methodVersion') or '')!='FINQUERY-RISK-RULES-2.0':
                  raise AssertionError(f'Unexpected production risk method: {risk_snapshot}')
              if int(risk_snapshot.get('rows') or 0)<5 or int(risk_snapshot.get('sectors') or 0)<3:
                  raise AssertionError(f'Risk monitor dashboard is incomplete: {risk_snapshot}')
              if int(risk_snapshot.get('timeline') or 0)<2 or risk_snapshot.get('previousScore') is None or risk_snapshot.get('trendDelta') is None:
                  raise AssertionError(f'Risk comparison is missing: {risk_snapshot}')
              if int(risk_snapshot.get('contributions') or 0)!=5 or int(risk_snapshot.get('contributionRows') or 0)!=5:
                  raise AssertionError(f'Risk contribution chart is incomplete: {risk_snapshot}')
              if int(risk_snapshot.get('breadthParts') or 0)!=3 or int(risk_snapshot.get('sectorTiles') or 0)<3:
                  raise AssertionError(f'Risk breadth/sector dashboard is incomplete: {risk_snapshot}')
              if not risk_snapshot.get('trendText') or 'Đang tìm' in risk_snapshot.get('trendText',''):
                  raise AssertionError(f'Risk trend card is not usable: {risk_snapshot}')
              if '/ 100' not in str(risk_snapshot.get('scoreText') or ''):
                  raise AssertionError(f'Risk score has no denominator: {risk_snapshot}')
              if risk_snapshot.get('fundStatus')!='ok' or int(risk_snapshot.get('fundSymbols') or 0)<1 or int(risk_snapshot.get('fundBars') or 0)<1 or int(risk_snapshot.get('fundSummary') or 0)!=4:
                  raise AssertionError(f'Fund holdings chart is incomplete: {risk_snapshot}')
              if risk_snapshot.get('sectorCalibration')!='ok' or int(risk_snapshot.get('heatCells') or 0)!=int(risk_snapshot.get('sectors') or 0):
                  raise AssertionError(f'Bidirectional sector heatmap is incomplete: {risk_snapshot}')
              if 'Cập nhật gần nhất:' not in str(risk_snapshot.get('heatUpdated') or ''):
                  raise AssertionError(f'Heatmap update time is missing: {risk_snapshot}')
              if int(risk_snapshot.get('breadthButtons') or 0)!=3:
                  raise AssertionError(f'Market breadth drilldown controls are incomplete: {risk_snapshot}')
              if risk_snapshot.get('fundPreviousAsOf') and int(risk_snapshot.get('fundNonZeroBars') or 0)<1:
                  raise AssertionError(f'Fund chart flattened meaningful historical changes to zero: {risk_snapshot}')
              active_sector_alerts=int(risk_snapshot.get('activeSectorAlerts') or 0)
              badge_hidden=bool(risk_snapshot.get('riskBadgeHidden'))
              badge_text=str(risk_snapshot.get('riskBadgeText') or '').strip()
              if active_sector_alerts==0 and not badge_hidden:
                  raise AssertionError(f'Risk nav badge surfaced non-risk context as an alert: {risk_snapshot}')
              if active_sector_alerts>0 and (badge_hidden or badge_text!=str(active_sector_alerts)):
                  raise AssertionError(f'Risk nav badge must equal active sector alerts only: {risk_snapshot}')
              info_text=driver.execute_script("const b=document.querySelector('[data-info-key=\"risk-score\"]'); if(b)b.click(); return document.getElementById('term-info-body')?.innerText||'';")
              if '0–69,9' not in info_text or '95–100' not in info_text:
                  raise AssertionError(f'Risk score help is incomplete: {info_text}')
              driver.execute_script("document.getElementById('term-info-close')?.click();")
              detail_check=driver.execute_script("""
                const f=document.querySelector('#risk-fund-chart .risk-fund-bar');
                const s=document.querySelector('#risk-sectors .risk-sector-heat-cell');
                const breadth=[...document.querySelectorAll('#risk-market-counts [data-breadth-group]')].find(b=>Number(b.querySelector('strong')?.textContent||0)>0);
                if(f)f.click(); if(s)s.click(); if(breadth)breadth.click();
                return {
                  fund:document.getElementById('risk-fund-detail')?.hidden===false,
                  sector:document.getElementById('risk-sector-detail')?.hidden===false,
                  breadth:document.getElementById('risk-breadth-detail')?.hidden===false,
                  breadthStocks:document.querySelectorAll('#risk-breadth-detail [data-risk-symbol]').length
                };
              """)
              if not detail_check.get('fund') or not detail_check.get('sector') or not detail_check.get('breadth') or int(detail_check.get('breadthStocks') or 0)<1:
                  raise AssertionError(f'Risk drilldown failed: {detail_check}')
              lowered_risk_text=str(risk_snapshot.get('text') or '').lower()
              for forbidden in ['risk monitor','market stress','alert engine','contagion','liquidity stress','volatility stress','không nhấp nháy','nhấn nhẹ một lần','heatmap cảnh báo trạng thái căng thẳng hiện tại','màu của cột chỉ phản ánh','hysteresis',' oos','ngoài mẫu','fold','kiểm tra bản mới mỗi phút','5 phút/lần','điểm này đo mức căng thẳng']:
                  if forbidden in lowered_risk_text:
                      raise AssertionError(f'Risk monitor exposed unexplained English jargon {forbidden!r}')
              opened_symbol=driver.execute_script("""
                const b=document.querySelector('#risk-breadth-detail [data-risk-symbol]');
                const symbol=b?.dataset?.riskSymbol||null;
                if(b)b.click();
                return symbol;
              """)
              wait.until(lambda d:d.execute_script("return document.getElementById('risk-monitor')?.hidden===true && document.querySelector('.workspace')?.hidden===false;"))
              if not opened_symbol or driver.execute_script("return document.getElementById('ticker')?.value")!=opened_symbol:
                  raise AssertionError(f'Breadth-to-stock drilldown did not open the selected symbol: {opened_symbol}')

              checked=snapshot.get('newsCheckedAt')
              if not checked:
                  raise AssertionError(f'News freshness missing: {snapshot}')
              news_time=datetime.fromisoformat(str(checked).replace('Z','+00:00')).astimezone(timezone.utc)
              news_age=(datetime.now(timezone.utc)-news_time).total_seconds()/60
              if news_age>25:
                  raise AssertionError(f'News is stale in production UI: {news_age:.1f} minutes; fallback={snapshot.get("newsLiveFallback")}')
              if int(snapshot.get('newsCount') or 0)<1:
                  raise AssertionError(f'Production UI has no usable news: {snapshot}')

              mobile_results=[]
              for width,height in ((390,844),(768,1024)):
                  driver.set_window_size(width,height)
                  time.sleep(1)
                  driver.execute_script("window.FinPlatformViews.openAnalysis(); document.querySelector('[data-market-view=\"price\"]')?.click();")
                  wait.until(lambda d:d.execute_script("return document.getElementById('price-chart')?.getBoundingClientRect().width>0;"))
                  time.sleep(.4)
                  analysis_mobile=driver.execute_script("""
                    const nav=document.querySelector('.header nav');
                    const root=document.documentElement;
                    const rect=nav?.getBoundingClientRect();
                    return {
                      pageOverflow:root.scrollWidth>window.innerWidth+2,
                      navOverflowX:getComputedStyle(nav).overflowX,
                      navWidth:rect?.width||0,
                      viewport:window.innerWidth,
                      chartWidth:document.getElementById('price-chart')?.getBoundingClientRect().width||0,
                      workspaceVisible:document.querySelector('.workspace')?.hidden===false
                    };
                  """)
                  if analysis_mobile.get('pageOverflow') or analysis_mobile.get('navOverflowX') not in ('auto','scroll') or not analysis_mobile.get('workspaceVisible') or float(analysis_mobile.get('chartWidth') or 0)<=0:
                      raise AssertionError(f'Mobile analysis layout failed at {width}x{height}: {analysis_mobile}')

                  driver.execute_script("window.FinPlatformViews.openRisk();")
                  wait.until(lambda d:d.execute_script("return document.getElementById('risk-monitor')?.hidden===false;"))
                  risk_mobile=driver.execute_script("""
                    const root=document.documentElement;
                    const heat=document.getElementById('risk-sectors');
                    const table=document.querySelector('.risk-stock-table-wrap');
                    return {
                      pageOverflow:root.scrollWidth>window.innerWidth+2,
                      heatWidth:heat?.getBoundingClientRect().width||0,
                      tableScrollable:Boolean(table && table.scrollWidth>=table.clientWidth),
                      riskVisible:document.getElementById('risk-monitor')?.hidden===false
                    };
                  """)
                  if risk_mobile.get('pageOverflow') or not risk_mobile.get('riskVisible') or float(risk_mobile.get('heatWidth') or 0)<=0 or not risk_mobile.get('tableScrollable'):
                      raise AssertionError(f'Mobile risk layout failed at {width}x{height}: {risk_mobile}')

                  driver.execute_script("window.FinPlatformViews.openStrategy();")
                  wait.until(lambda d:d.execute_script("return document.getElementById('strategy-builder')?.hidden===false;"))
                  strategy_mobile=driver.execute_script("""
                    const root=document.documentElement;
                    const section=document.getElementById('strategy-builder');
                    const results=document.querySelector('.strategy-results-table-wrap');
                    return {
                      pageOverflow:root.scrollWidth>window.innerWidth+2,
                      sectionWidth:section?.getBoundingClientRect().width||0,
                      resultsScrollable:Boolean(results && results.scrollWidth>=results.clientWidth),
                      strategyVisible:section?.hidden===false
                    };
                  """)
                  if strategy_mobile.get('pageOverflow') or not strategy_mobile.get('strategyVisible') or float(strategy_mobile.get('sectionWidth') or 0)<=0:
                      raise AssertionError(f'Mobile Strategy Lab layout failed at {width}x{height}: {strategy_mobile}')
                  mobile_results.append((width,height,analysis_mobile,risk_mobile,strategy_mobile))

              driver.set_window_size(1440,1200)
              print('BROWSER SMOKE PASS',{'ai':results,'newsAgeMin':round(news_age,1),'risk':{k:v for k,v in risk_snapshot.items() if k!='text'},'snapshot':snapshot,'mobile':mobile_results})
          finally:
              driver.quit()
          PY
