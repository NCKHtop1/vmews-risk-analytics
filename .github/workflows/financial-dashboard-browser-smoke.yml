name: Financial dashboard browser smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/financial-dashboard-browser-smoke.yml'
  workflow_run:
    workflows: ['Deploy VMEWS Pages']
    types: [completed]
  schedule:
    # 16:35 Vietnam time, after the completed trading session and final data deploy.
    - cron: '35 9 * * 1-5'

permissions:
  contents: read

concurrency:
  group: financial-dashboard-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser smoke dependency
        run: pip install --disable-pip-version-check -q selenium==4.36.0
      - name: Exercise production chart, ideas, macro, scanner and Dolphin local analysis
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          python - <<'PY'
          import shutil
          import time
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.support.ui import WebDriverWait

          URL='https://nckhtop1.github.io/vmews-risk-analytics/financial-report/?symbol=FPT&mode=year#market'
          DEPLOYMENT='https://nckhtop1.github.io/vmews-risk-analytics/financial-report/deployment.json'
          expected=os.environ.get('EXPECTED_SHA','').strip()
          if expected:
              with urllib.request.urlopen(DEPLOYMENT,timeout=20) as r:
                  deployed=json.load(r)
              actual=str(deployed.get('code') or '')
              if actual != expected:
                  raise AssertionError(f'Pages deployment mismatch: production={actual} expected={expected}')

          options=Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--disable-gpu')
          options.add_argument('--window-size=1440,1200')

          driver_path=shutil.which('chromedriver')
          service=Service(driver_path) if driver_path else Service()
          driver=webdriver.Chrome(service=service,options=options)
          wait=WebDriverWait(driver,60)

          try:
              driver.get(URL)
              # Do not store protected passcodes in CI. Authorized smoke access is
              # enabled through the same session flags set by the successful gates.
              driver.execute_script("""
                sessionStorage.setItem('finquery-site-access','1');
                sessionStorage.setItem('finquery-technical-access','1');
                sessionStorage.setItem('finquery-macro-access','1');
              """)
              driver.refresh()

              wait.until(lambda d:d.execute_script("""
                return Boolean(
                  window.FinQueryAI &&
                  window.FinancialMarket &&
                  window.FinancialReportContext &&
                  window.FinTechnicalScanner &&
                  window.FinStrategyBuilder &&
                  window.FinSectionCollapse &&
                  window.FinMacro
                );
              """))
              collapsed=driver.execute_script("""
                return {
                  strategy:document.getElementById('strategy-body')?.hidden===true,
                  ideas:document.getElementById('investment-ideas-body')?.hidden===true,
                  macro:document.getElementById('macro-body')?.hidden===true,
                  chevrons:document.querySelectorAll('.section-chevron-icon svg').length
                };
              """)
              if not all([collapsed.get('strategy'),collapsed.get('ideas'),collapsed.get('macro')]) or int(collapsed.get('chevrons') or 0)!=3:
                  raise AssertionError(f'Feature accordion defaults/icons are incorrect: {collapsed}')

              driver.execute_script("""
                document.getElementById('strategy-toggle')?.click();
                document.getElementById('investment-ideas-toggle')?.click();
                document.getElementById('macro-toggle')?.click();
              """)
              wait.until(lambda d:d.execute_script("""
                return (
                  document.getElementById('strategy-body')?.hidden===false &&
                  document.getElementById('investment-ideas-body')?.hidden===false &&
                  document.getElementById('macro-body')?.hidden===false &&
                  document.querySelectorAll('.section-chevron.is-open,.strategy-chevron.is-open').length===3
                );
              """))

              wait.until(lambda d:d.execute_script("""
                const q=window.FinancialMarket?.context?.()?.quote;
                return Boolean(q && Number(q.price)>0);
              """))
              freshness_ui=driver.execute_script("""
                const warning=document.getElementById('quote-freshness');
                const quoteTime=(document.getElementById('quote-time')?.textContent||'').trim();
                return {
                  warningHidden:warning?.hidden===true,
                  warningText:(warning?.textContent||'').trim(),
                  quoteTime
                };
              """)
              if not freshness_ui.get('warningHidden') or 'Nguồn quá' in freshness_ui.get('warningText','') or 'không dùng như giá live' in freshness_ui.get('warningText',''):
                  raise AssertionError(f'Legacy minute-age live warning resurfaced: {freshness_ui}')
              quote_time=freshness_ui.get('quoteTime','')
              lowered=quote_time.lower()
              if any(x in lowered for x in ['vietcap','giá chốt phiên','cập nhật trong phiên','giá chốt phiên gần nhất']):
                  raise AssertionError(f'Quote subtitle must contain timestamp only: {freshness_ui}')
              if not re.search(r'\d{1,2}:\d{2}.*\d{1,2}/\d{1,2}/\d{2,4}',quote_time):
                  raise AssertionError(f'Quote subtitle is missing timestamp: {freshness_ui}')
              watch_label=(driver.find_element('id','today-watch-label').text or '').strip()
              if 'ĐÁNG XEM PHIÊN GẦN NHẤT' in watch_label:
                  raise AssertionError(f'Legacy nearest-session watch title resurfaced: {watch_label}')
              wait.until(lambda d:d.execute_script("""
                return Boolean(document.querySelector('#price-chart canvas'));
              """))
              wait.until(lambda d:d.execute_script("""
                return Boolean(window.FinancialReportContext?.raw?.());
              """))
              wait.until(lambda d:d.execute_script("""
                const c=window.FinMacro?.context?.();
                return Boolean(c && c.datasets && Object.keys(c.datasets).length>=3);
              """))
              wait.until(lambda d:d.execute_script("""
                const c=window.FinTechnicalScanner?.context?.();
                return Boolean(c && c.current && c.current.symbol==='FPT');
              """))
              wait.until(lambda d:d.execute_script("""
                const el=document.getElementById('idea-report-list');
                return Boolean(el && el.textContent.trim().length>20);
              """))
              wait.until(lambda d:d.execute_script("""
                const c=window.FinStrategyBuilder?.context?.();
                return Boolean(c && c.snapshot && Object.keys(c.snapshot.symbols||{}).length>=100 && document.querySelectorAll('[data-strategy-indicator]').length>=20);
              """))
              driver.execute_script("""
                document.querySelector('[data-strategy-preset="macd_rsi"]')?.click();
              """)
              wait.until(lambda d:d.execute_script("""
                const c=window.FinStrategyBuilder?.context?.();
                return Boolean(c && c.strategy && c.strategy.conditions && c.strategy.conditions.length===2);
              """))

              driver.execute_script("""
                document.querySelector('[data-market-view="scanner"]')?.click();
              """)
              wait.until(lambda d:d.execute_script("""
                return document.querySelectorAll('#technical-scanner-rows tr').length>0;
              """))

              checks=[
                ('Vì sao mã này tăng hoặc giảm trong phiên hôm nay?','movement'),
                ('Phân tích sức khỏe tài chính của doanh nghiệp này.','financial'),
                ('Các rủi ro định lượng chính hiện tại là gì?','risk'),
                ('So sánh kỳ gần nhất với kỳ trước và cùng kỳ.','compare'),
                ('ROE là gì?','concept'),
                ('Phân tích bối cảnh lãi suất và vĩ mô hiện tại.','macro'),
              ]
              results=[]
              for question,expected in checks:
                  result=driver.execute_script(
                    "return window.FinQueryAI.analyze(arguments[0]);",question
                  )
                  if not isinstance(result,dict):
                      raise AssertionError(f'AI result is not an object for {question!r}: {result!r}')
                  actual=result.get('type')
                  html=str(result.get('html') or '')
                  if actual!=expected:
                      raise AssertionError(f'AI classifier mismatch for {question!r}: {actual!r} != {expected!r}')
                  if len(html)<80:
                      raise AssertionError(f'AI local response too short for {question!r}: {len(html)}')
                  if 'undefined' in html.lower() or '>nan<' in html.lower():
                      raise AssertionError(f'AI local response contains invalid values for {question!r}')
                  results.append((expected,len(html)))

              # A publisher commit is atomic, but the browser can straddle two
              # generations while raw GitHub and Pages caches converge. Give the UI
              # a bounded chance to resync; persistent misalignment still fails below.
              for _ in range(8):
                  aligned=driver.execute_script("""
                    const m=window.FinancialMarket?.context?.();
                    const s=window.FinTechnicalScanner?.context?.();
                    const st=window.FinStrategyBuilder?.context?.()?.snapshot;
                    const q=m?.quoteBundleSourceTime||null;
                    return Boolean(q && s?.sourceTime===q && st?.sourceTime===q);
                  """)
                  if aligned:
                      break
                  driver.execute_script("""
                    window.FinancialMarket?.refresh?.();
                    window.FinTechnicalScanner?.refresh?.();
                    window.FinStrategyBuilder?.refresh?.();
                  """)
                  time.sleep(3)

              snapshot=driver.execute_script("""
                const m=window.FinancialMarket.context();
                const s=window.FinTechnicalScanner.context();
                const macro=window.FinMacro.context();
                return {
                  symbol:m.symbol,
                  quote:m.quote,
                  quoteSourceTime:m.quote?.sourceTime||null,
                  quoteBundleSourceTime:m.quoteBundleSourceTime||null,
                  scanner:s?.current,
                  scannerCheckedAt:s?.checkedAt,
                  scannerSourceTime:s?.sourceTime||null,
                  macroCheckedAt:macro?.checkedAt,
                  newsCheckedAt:m.newsCheckedAt,
                  newsLiveFallback:m.newsLiveFallback,
                  newsCount:(m.news||[]).length+(m.marketNews||[]).length,
                  financial:Boolean(window.FinancialReportContext.raw()),
                  ideaText:(document.getElementById('idea-report-list')?.textContent||'').trim().slice(0,180),
                  strategyCoverage:window.FinStrategyBuilder?.context?.()?.snapshot?.coverage||0,
                  strategySourceTime:window.FinStrategyBuilder?.context?.()?.snapshot?.sourceTime||null,
                  strategyConditions:window.FinStrategyBuilder?.context?.()?.strategy?.conditions?.length||0
                };
              """)
              if snapshot.get('symbol')!='FPT':
                  raise AssertionError(f'Unexpected selected symbol: {snapshot}')
              if not snapshot.get('scanner'):
                  raise AssertionError(f'Scanner context missing: {snapshot}')
              if int(snapshot.get('strategyCoverage') or 0)<100 or int(snapshot.get('strategyConditions') or 0)!=2:
                  raise AssertionError(f'Strategy Lab context missing or incomplete: {snapshot}')

              watch=driver.execute_async_script("""
                const done=arguments[arguments.length-1];
                window.FinMarketData.get('watch-today.json')
                  .then(x=>done({status:x.status,checkedAt:x.checkedAt,sourceTime:x.sourceTime,items:(x.items||[]).length}))
                  .catch(e=>done({error:String(e)}));
              """)
              local=datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=7)))
              mins=local.hour*60+local.minute
              active=local.weekday()<5 and ((9*60<=mins<=11*60+30) or (13*60<=mins<=14*60+45))
              if active:
                  quote_source=snapshot.get('quoteSourceTime')
                  bundle_source=snapshot.get('quoteBundleSourceTime')
                  if not quote_source or not bundle_source:
                      raise AssertionError(f'Active session has no usable live quote/snapshot: {snapshot}')
                  qt=datetime.fromisoformat(str(quote_source).replace('Z','+00:00')).astimezone(timezone.utc)
                  quote_age=(datetime.now(timezone.utc)-qt).total_seconds()/60
                  if quote_age>20:
                      raise AssertionError(f'Active-session quote is stale: {quote_age:.1f} minutes; snapshot={snapshot}')
                  if str(snapshot.get('scannerSourceTime') or '')!=str(bundle_source):
                      raise AssertionError(f'Scanner is not aligned with quote snapshot: {snapshot}')
                  if str(snapshot.get('strategySourceTime') or '')!=str(bundle_source):
                      raise AssertionError(f'Strategy snapshot is not aligned with quote snapshot: {snapshot}')
                  if watch.get('error') or str(watch.get('sourceTime') or '')!=str(bundle_source):
                      raise AssertionError(f'Today-watch is not aligned with quote snapshot: watch={watch} snapshot={snapshot}')
              checked=snapshot.get('newsCheckedAt')
              if not checked:
                  raise AssertionError(f'News freshness missing: {snapshot}')
              news_time=datetime.fromisoformat(str(checked).replace('Z','+00:00')).astimezone(timezone.utc)
              news_age=(datetime.now(timezone.utc)-news_time).total_seconds()/60
              if news_age>25:
                  raise AssertionError(f'News is stale in production UI: {news_age:.1f} minutes; fallback={snapshot.get("newsLiveFallback")}')
              if int(snapshot.get('newsCount') or 0)<1:
                  raise AssertionError(f'Production UI has no usable news: {snapshot}')
              print('BROWSER SMOKE PASS',{'ai':results,'newsAgeMin':round(news_age,1),'snapshot':snapshot})
          finally:
              driver.quit()
          PY
