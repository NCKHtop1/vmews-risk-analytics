name: Forecast V10 final audit
on:
  workflow_dispatch:
  push:
    branches: [forecast-v10-release-final, main]
    paths:
      - 'forecast-final.html'
      - 'forecast-final-v10.js'
      - 'scripts/train_forecast_v10.py'
      - 'scripts/train_forecast_v10_strict.py'
      - 'scripts/update_research_news_v10.py'
      - 'scripts/update_sentiment_v10.py'
      - 'scripts/build_news_event_study.py'
      - 'scripts/forecast_v10_test_cases.py'
      - 'scripts/forecast_v10_smoke_final.js'
      - '.github/workflows/forecast-v10-final-audit.yml'
      - '.v10-trigger'
permissions:
  contents: read
concurrency:
  group: vmews-v10-audit-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model and NLP dependencies
        run: pip install -q numpy scipy scikit-learn torch transformers pyvi
      - name: Train strict-parity V10 model and sealed backtest
        run: python scripts/train_forecast_v10_strict.py
      - name: Refresh full HOSE news universe in workspace
        run: python scripts/update_research_news_v10.py
      - name: Run supervised financial sentiment
        run: python scripts/update_sentiment_v10.py
      - name: Build event study and unsupervised clusters
        run: python scripts/build_news_event_study.py
      - name: Run end-to-end research acceptance matrix
        run: python scripts/forecast_v10_test_cases.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and production contract
        run: |
          node --check forecast-v4-core.js
          node --check forecast-final-v10.js
          node --check scripts/forecast_v10_smoke_final.js
          node scripts/forecast_v10_smoke_final.js
      - name: Verify audit is read-only
        run: |
          echo 'Audit artifacts are intentionally not pushed.'
          echo 'Daily news/event snapshots are persisted only by update-research-news.yml.'
          echo 'Immutable live forecasts are persisted only by live-model-monitor.yml.'
