name: Forecast V10 final audit
on:
  workflow_dispatch:
  push:
    branches: [forecast-v10-release-final, main]
    paths:
      - 'forecast-final.html'
      - 'forecast-final-v10.js'
      - 'scripts/train_forecast_v10.py'
      - 'scripts/train_forecast_v10_strict.py'
      - 'scripts/update_research_news_v10.py'
      - 'scripts/update_sentiment_v10.py'
      - 'scripts/build_news_event_study.py'
      - 'scripts/forecast_v10_smoke_final.js'
      - '.github/workflows/forecast-v10-final-audit.yml'
      - '.v10-trigger'
permissions:
  contents: write
concurrency:
  group: vmews-data-writer-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model and NLP dependencies
        run: pip install -q numpy scipy scikit-learn torch transformers pyvi
      - name: Train strict-parity V10 model and sealed backtest
        run: python scripts/train_forecast_v10_strict.py
      - name: Refresh full HOSE news universe
        run: python scripts/update_research_news_v10.py
      - name: Run supervised financial sentiment
        run: python scripts/update_sentiment_v10.py
      - name: Build event study and unsupervised clusters
        run: python scripts/build_news_event_study.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and production contract
        run: |
          node --check forecast-v4-core.js
          node --check forecast-final-v10.js
          node --check scripts/forecast_v10_smoke_final.js
          node scripts/forecast_v10_smoke_final.js
      - name: Persist audited artifacts
        run: |
          set -euo pipefail
          git config user.name 'vmews-v10-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/forecast-model-v10.json data/research-news-v10.json data/sentiment-v10.json data/news-event-study.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist V10 audited model and event-study data [data-only]'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
