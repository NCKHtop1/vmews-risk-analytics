name: FinQuery full-site responsive UX QA

on:
  pull_request:
    paths:
      - 'financial-report/frontend/**'
      - 'financial-report/scripts/build_cdn.py'
      - 'financial-report/tests/site_responsive_browser.py'
      - 'financial-report/tests/responsive_system.test.cjs'
      - '.github/workflows/finquery-responsive-site-qa.yml'
  push:
    branches: [main]
    paths:
      - 'financial-report/frontend/**'
      - 'financial-report/scripts/build_cdn.py'
      - 'financial-report/tests/site_responsive_browser.py'
      - 'financial-report/tests/responsive_system.test.cjs'
      - '.github/workflows/finquery-responsive-site-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Responsive source and browser syntax
        run: |
          node --check financial-report/frontend/responsive-navigation.js
          node --test financial-report/tests/responsive_system.test.cjs
          python -m py_compile financial-report/tests/site_responsive_browser.py
      - name: Chrome mobile and desktop navigation, charts, tables and overflow
        run: |
          pip install --disable-pip-version-check -q selenium==4.36.0
          python financial-report/tests/site_responsive_browser.py
      - name: Verify production single-file responsive bundle
        run: |
          python financial-report/scripts/build_cdn.py
          python - <<'PY'
          from pathlib import Path
          text=Path('financial-report/index.html').read_text(encoding='utf-8')
          assert text.count('id="finquery-nav-toggle"') == 1
          assert text.count('id="chart-advanced-tools"') == 1
          assert text.count('FinQuery responsive system') == 1
          assert text.count("const media=window.matchMedia('(max-width:850px)')") == 1
          assert 'href="responsive-system.css"' not in text
          assert 'src="responsive-navigation.js"' not in text
          print('FINQUERY_RESPONSIVE_CDN_BUNDLE_PASS')
          PY
