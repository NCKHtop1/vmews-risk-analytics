name: VN100 ownership source probe
on:
  pull_request:
    paths:
      - '.github/workflows/vn100-ownership-source-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Check source schema on three HOSE issuers
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error,time
          base='https://kbbuddywts.kbsec.com.vn/iis-server/investment/stockinfo'
          for sym in ('MBB','FPT','HPG'):
            for action in ('profile','news/internal-trading','event'):
              url=f'{base}/{action}/{sym}?l=1'
              if action!='profile':url+='&p=1&s=5'
              if action=='event':url+='&eID=4'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Accept-Language':'vi-VN,vi;q=0.9','x-lang':'vi'})
              try:
                with urllib.request.urlopen(req,timeout=12) as r:
                  body=r.read(200000)
                  data=json.loads(body)
                  sample=data[0] if isinstance(data,list) and data else data
                  keys=list(sample)[:35] if isinstance(sample,dict) else []
                  samplehint={k:str(sample.get(k,''))[:80] for k in keys if k in ('EventID','EventDate','PublishDate','RegisterBuyVolume','Title','StockCode','PN','NM','EventType','Leaders','Shareholders','Ownership','PublicDate')}
                  counts={k:len(data.get(k) or []) for k in ('Leaders','Shareholders','Ownership') if isinstance(data,dict)}
                  print('SOURCE_RESULT',sym,action,r.status,'len',len(data) if isinstance(data,list) else 'obj','keys',keys,'counts',counts,'sample',samplehint,flush=True)
              except Exception as e:print('SOURCE_ERROR',sym,action,type(e).__name__,str(e)[:180],flush=True)
              time.sleep(.4)

          from datetime import datetime,timedelta
          today=datetime.now().strftime('%Y%m%d')
          start=(datetime.now()-timedelta(days=730)).strftime('%Y%m%d')
          for sym in ('MBB','FPT','HPG'):
            url=f'https://iq.vietcap.com.vn/api/iq-insight-service/v1/events?ticker={sym}&fromDate={start}&toDate={today}&eventCode=DDIND,DDINS,DDRP&page=0&size=20'
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Origin':'https://trading.vietcap.com.vn'})
            try:
              with urllib.request.urlopen(req,timeout=15) as r:
                obj=json.load(r)
                data=obj.get('data') or {}
                rows=data.get('content') if isinstance(data,dict) else data
                rows=rows or []
                print('VCI_RESULT',sym,r.status,'total',data.get('totalElements') if isinstance(data,dict) else 'na','rows',len(rows),'keys',list(rows[0])[:35] if rows else [],'sample',str(rows[0])[:950] if rows else '',flush=True)
            except Exception as e:print('VCI_ERROR',sym,type(e).__name__,str(e)[:200],flush=True)
          PY
