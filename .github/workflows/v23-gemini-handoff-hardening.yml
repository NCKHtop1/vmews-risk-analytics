name: V23 Gemini handoff hardening

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v23-gemini-handoff-hardening.yml"
      - "scripts/v23_gemini_handoff_patch.py"

permissions:
  contents: write

concurrency:
  group: v23-gemini-handoff-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply V23 Gemini handoff patch
        run: python scripts/v23_gemini_handoff_patch.py

      - name: JavaScript syntax checks
        run: |
          node --check solution-ai-v17.js
          node --check scripts/forecast_v22_browser_e2e.mjs
          node --check scripts/solution_ai_frontend_v17_test.mjs

      - name: SoluTION.AI unit and VM tests
        run: node --test scripts/solution_ai_frontend_v17_test.mjs scripts/solution_ai_v17_test.mjs

      - name: Frontend contract tests
        run: python scripts/forecast_v14_frontend_contract_test.py

      - name: Runtime contract tests
        run: node --test scripts/forecast_v18_frontend_runtime_test.mjs

      - name: Install Chromium test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser E2E desktop and mobile
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/v23-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          node scripts/forecast_v22_browser_e2e.mjs

      - name: Publish V23 production changes
        run: |
          rm -rf node_modules package-lock.json
          git checkout -- package.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solution-ai-v17.js scripts/solution_ai_frontend_v17_test.mjs scripts/forecast_v22_browser_e2e.mjs
          git add -u scripts/v23_gemini_handoff_patch.py
          git diff --cached --check
          git commit -m "V23 continue SoluTION.AI context into Gemini Web"
          git pull --rebase origin main
          git push origin HEAD:main
