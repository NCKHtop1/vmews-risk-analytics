name: Refresh VMEWS market news

on:
  workflow_dispatch:
  schedule:
    # Continuous publisher refresh, independent of the trading session.
    - cron: '3,18,33,48 * * * *'

permissions:
  contents: write

concurrency:
  group: financial-market-data-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: financial-report
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore latest market snapshots
        run: |
          git fetch origin financial-market-data
          git worktree add /tmp/market-publish FETCH_HEAD
          git -C /tmp/market-publish sparse-checkout set market
      - name: Collect publisher news
        run: python -u financial-report/scripts/refresh_market.py --output /tmp/market-publish/market --mode news
      - name: Publish news snapshot
        working-directory: /tmp/market-publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse market
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh VMEWS market news'
            git push origin HEAD:refs/heads/financial-market-data
          fi
      - name: Validate news freshness
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          data=json.loads(Path('/tmp/market-publish/market/news.json').read_text())
          if data.get('status')!='ok':
              raise SystemExit('news.json status is not ok')
          checked=datetime.fromisoformat(data['checkedAt'].replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-checked.astimezone(timezone.utc)).total_seconds()
          if age>20*60:
              raise SystemExit(f'news snapshot stale: {age:.0f}s')
          print('NEWS OK',len(data.get('items') or []),data.get('checkedAt'))
          PY
