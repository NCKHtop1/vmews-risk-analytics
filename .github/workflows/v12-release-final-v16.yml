name: V12 immutable production release gate v1.6
on:
  workflow_dispatch:
  push:
    branches: [forecast-v12-methodfix]
    paths:
      - 'v12-release-v16-trigger.txt'
permissions:
  contents: write
concurrency:
  group: vmews-v12-final-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Assert frozen source and nine-phase research acceptance
        run: |
          python - <<'PY'
          import gzip,hashlib,json,pathlib
          g=json.load(open('data/phase-gates-v12.json',encoding='utf-8'))
          m=json.load(open('data/forecast-model-v12.json',encoding='utf-8'))
          b=json.load(open('data/benchmark-gate-v12.json',encoding='utf-8'))
          a=json.load(open('data/active-flow-gate-v12.json',encoding='utf-8'))
          s=json.load(open('data/sector-gate-v12.json',encoding='utf-8'))
          n=json.load(open('data/nested-selection-gate-v12.json',encoding='utf-8'))
          blind=json.load(open('data/blind-holdout-gate-v12.json',encoding='utf-8'))
          e=json.load(open('data/embargo-gate-v12.json',encoding='utf-8'))
          probe=json.load(open('data/v12-source-probe.json',encoding='utf-8'))
          frozen=json.load(open('data/v12-frozen-source-manifest.json',encoding='utf-8'))
          snap=pathlib.Path('data/v12-frozen-source.json.gz').read_bytes()
          assert g.get('status')=='PASS' and all((g.get('phases') or {}).get(str(i),{}).get('status')=='PASS' for i in range(1,10)),g
          assert b.get('status')=='PASS' and b.get('benchmark')=='VNINDEX',b
          assert (b.get('checks') or {}).get('noRawReturnFallbackWhenBenchmarkMissing') is True,b
          assert a.get('status')=='PASS' and a.get('mode') in {'CERTIFIED','ABSTAIN'},a
          assert s.get('status')=='PASS',s
          sec=s.get('sectorAudit') or {}; assert sec.get('status')=='ABSTAIN' and sec.get('certified') is False and sec.get('pointInTimeEligible') is False and sec.get('numericalFeatureEnabled') is False,sec
          assert n.get('status')=='PASS',n
          assert blind.get('status')=='PASS' and all((blind.get('checks') or {}).get(f'T+{h}') is True for h in range(1,6)),blind
          assert (blind.get('checks') or {}).get('backtestCarriesSealedHoldoutEvidence') is True,blind
          assert e.get('status')=='PASS',e
          assert m.get('promotion',{}).get('status')=='PASS' and m.get('promotion',{}).get('directPriceHorizons')==[1,2,3,4,5],m.get('promotion')
          for h in range(1,6):
              hz=(m.get('horizons') or {}).get(str(h),{})
              assert (hz.get('gates') or {}).get('blindHoldout') is True,(h,hz.get('gates'))
              assert (((hz.get('walkForwardReplay') or {}).get('fixedBlindHoldout') or {}).get('status'))=='PASS',(h,hz.get('walkForwardReplay'))
          assert probe.get('status')=='PASS' and probe.get('mode')=='IMMUTABLE_FROZEN_SNAPSHOT',probe
          assert probe.get('runtimeNetworkPriceFetch') is False and probe.get('runtimeProviderSwitching') is False,probe
          assert all((probe.get('sourceGates') or {}).values()),probe.get('sourceGates')
          assert frozen.get('currentSourceCoverageRatio',0)>=.98 and frozen.get('deepHistory',0)>=360 and frozen.get('modelEligible',0)>=360,frozen
          assert frozen.get('corporateActionVerifiedRatio',0)>=.98 and frozen.get('crossSourceMADP95',99)<=.003,frozen
          assert hashlib.sha256(snap).hexdigest()==frozen.get('snapshotFileSha256'),frozen
          z=json.loads(gzip.decompress(snap).decode('utf-8')); assert z.get('version')=='VMEWS-FROZEN-SOURCE-12.1.0',z.get('version')
          print('V12 SOURCE + NINE-PHASE RELEASE GATE PASS',frozen.get('snapshotFileSha256'))
          PY
      - name: Create immutable model and source manifest
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          from datetime import datetime,timezone
          files=[
            'forecast-final.html','forecast-final-v12.js','forecast-polish-v12.js',
            'data/v12-frozen-source-manifest.json','data/v12-frozen-source.json.gz','data/v12-source-probe.json','data/vnindex-v12.json',
            'data/forecast-model-v12.json','data/forecast-current-v12.json','data/forecast-dashboard-v12.json','data/forecast-backtest-v12.json',
            'data/data-audit-v12.json','data/event-intelligence-v12.json','data/flow-v12.json','data/flow-audit-v12.json',
            'data/phase-gates-v12.json','data/benchmark-gate-v12.json','data/active-flow-audit-v12.json','data/active-flow-gate-v12.json',
            'data/sector-gate-v12.json','data/nested-selection-gate-v12.json','data/blind-holdout-gate-v12.json','data/embargo-gate-v12.json'
          ]
          rows={}
          for name in files:
              p=pathlib.Path(name); assert p.exists(),name; b=p.read_bytes(); rows[name]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          model=json.load(open('data/forecast-model-v12.json',encoding='utf-8')); dash=json.load(open('data/forecast-dashboard-v12.json',encoding='utf-8'))
          gates=json.load(open('data/phase-gates-v12.json',encoding='utf-8')); benchmark=json.load(open('data/benchmark-gate-v12.json',encoding='utf-8'))
          active=json.load(open('data/active-flow-gate-v12.json',encoding='utf-8')); sector=json.load(open('data/sector-gate-v12.json',encoding='utf-8'))
          nested=json.load(open('data/nested-selection-gate-v12.json',encoding='utf-8')); blind=json.load(open('data/blind-holdout-gate-v12.json',encoding='utf-8')); embargo=json.load(open('data/embargo-gate-v12.json',encoding='utf-8'))
          probe=json.load(open('data/v12-source-probe.json',encoding='utf-8')); frozen=json.load(open('data/v12-frozen-source-manifest.json',encoding='utf-8'))
          z={
            'version':'VMEWS-FORECAST-V12-IMMUTABLE-MANIFEST-1.6.0','generatedAt':datetime.now(timezone.utc).isoformat(),
            'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'modelVersion':model.get('version'),'asOf':dash.get('asOf'),
            'promotion':model.get('promotion'),'phaseGateVersion':gates.get('version'),
            'frozenSource':{'manifestVersion':frozen.get('version'),'asOf':frozen.get('asOf'),'snapshotFileSha256':frozen.get('snapshotFileSha256'),'inputManifestSha256':frozen.get('inputManifestSha256'),'runtimeNetworkPriceFetch':probe.get('runtimeNetworkPriceFetch'),'runtimeProviderSwitching':probe.get('runtimeProviderSwitching')},
            'benchmarkGate':{'version':benchmark.get('version'),'benchmark':benchmark.get('benchmark'),'status':benchmark.get('status'),'h5Coverage':benchmark.get('benchmarkH5Coverage')},
            'activeFlowGate':{'version':active.get('version'),'mode':active.get('mode'),'status':active.get('status')},
            'sectorGate':{'version':sector.get('version'),'status':sector.get('status'),'mode':(sector.get('sectorAudit') or {}).get('status')},
            'nestedSelectionGate':{'version':nested.get('version'),'status':nested.get('status')},'blindHoldoutGate':{'version':blind.get('version'),'status':blind.get('status')},'embargoGate':{'version':embargo.get('version'),'status':embargo.get('status')},
            'files':rows,
            'policy':'Production identity is commit-pinned and content-hashed from immutable frozen PIT source through model, validation evidence and UI. Runtime network price fetch/provider switching are forbidden. Numerical output requires all T+1..T+5 direct-price, walk-forward, PBO/generalization, distribution, fixed sealed blind holdout, purge and embargo gates to pass.'
          }
          pathlib.Path('data/forecast-release-v12.json').write_text(json.dumps(z,ensure_ascii=False,indent=2),encoding='utf-8')
          print('V12 MANIFEST 1.6 CREATED',z['sourceCommit'],z['frozenSource'])
          PY
      - name: Install Chromium smoke runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Provider-outage local Chromium smoke
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/v12-http.log 2>&1 &
          SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT; sleep 2
          V12_BROWSER_URL='http://127.0.0.1:8765/forecast-final.html?symbol=FPT' V12_BLOCK_EXTERNAL=1 node scripts/v12_browser_smoke.mjs
      - name: Commit immutable release manifest
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=$(python - <<'PY'
          import json
          print(json.load(open('data/forecast-release-v12.json',encoding='utf-8'))['sourceCommit'])
          PY
          )
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin forecast-v12-methodfix
          REMOTE_SHA=$(git rev-parse origin/forecast-v12-methodfix)
          test "$REMOTE_SHA" = "$SOURCE_SHA" || { echo "BRANCH ADVANCED DURING RELEASE: source=$SOURCE_SHA remote=$REMOTE_SHA"; exit 1; }
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/forecast-release-v12.json
          git commit -m 'Seal VMEWS Forecast V12 immutable production manifest 1.6 [v12-release]'
          RELEASE_SHA=$(git rev-parse HEAD); test "$(git rev-parse ${RELEASE_SHA}^)" = "$SOURCE_SHA"
          git push origin HEAD:forecast-v12-methodfix
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
      - name: Commit-pinned CDN exact byte and hash verification
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://cdn.githubraw.com/NCKHtop1/vmews-risk-analytics/${RELEASE_SHA}"
          rm -rf /tmp/v12-cdn && mkdir -p /tmp/v12-cdn
          python - <<'PY' > /tmp/v12-manifest-files.txt
          import json
          r=json.load(open('data/forecast-release-v12.json',encoding='utf-8'))
          for p in r.get('files',{}): print(p)
          PY
          while IFS= read -r path; do
            test -n "$path" || continue; out="/tmp/v12-cdn/$path"; mkdir -p "$(dirname "$out")"; ok=0
            for i in 1 2 3 4 5 6; do if curl -LfsS --connect-timeout 10 --max-time 35 "$BASE/$path" -o "$out"; then ok=1; break; fi; sleep $((i*5)); done
            test "$ok" = 1 || { echo "CDN FAIL $path"; exit 1; }
          done < /tmp/v12-manifest-files.txt
          out="/tmp/v12-cdn/data/forecast-release-v12.json"; mkdir -p "$(dirname "$out")"; ok=0
          for i in 1 2 3 4 5 6; do if curl -LfsS --connect-timeout 10 --max-time 35 "$BASE/data/forecast-release-v12.json" -o "$out"; then ok=1; break; fi; sleep $((i*5)); done
          test "$ok" = 1 || exit 1
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/v12-cdn'); r=json.load(open(root/'data/forecast-release-v12.json',encoding='utf-8')); release=os.environ['RELEASE_SHA']; parent=subprocess.check_output(['git','rev-parse',release+'^'],text=True).strip()
          assert r['version']=='VMEWS-FORECAST-V12-IMMUTABLE-MANIFEST-1.6.0'; assert r['sourceCommit']==parent
          assert r['frozenSource']['runtimeNetworkPriceFetch'] is False and r['frozenSource']['runtimeProviderSwitching'] is False
          for name,meta in r['files'].items():
              b=(root/name).read_bytes(); assert len(b)==int(meta['bytes']),(name,len(b),meta['bytes']); assert hashlib.sha256(b).hexdigest()==meta['sha256'],name
          probe=json.load(open(root/'data/v12-source-probe.json')); frozen=json.load(open(root/'data/v12-frozen-source-manifest.json'))
          assert probe['status']=='PASS' and probe['mode']=='IMMUTABLE_FROZEN_SNAPSHOT'; assert probe['runtimeNetworkPriceFetch'] is False and probe['runtimeProviderSwitching'] is False
          assert frozen['corporateActionVerifiedRatio']>=.98 and frozen['modelEligible']>=360 and frozen['crossSourceMADP95']<=.003
          print('PINNED CDN HASH + SOURCE PROVENANCE PASS',release,'files',len(r['files']))
          PY
      - name: Commit-pinned CDN desktop/mobile Chromium smoke
        run: |
          V12_BROWSER_URL="https://cdn.githubraw.com/NCKHtop1/vmews-risk-analytics/${RELEASE_SHA}/forecast-final.html?symbol=FPT" node scripts/v12_browser_smoke.mjs
      - name: Write release evidence summary
        if: success()
        run: |
          printf '{"status":"PASS","releaseSha":"%s","cdn":"https://cdn.githubraw.com/NCKHtop1/vmews-risk-analytics/%s/forecast-final.html"}\n' "$RELEASE_SHA" "$RELEASE_SHA" > v12-release-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-final-release-evidence-${{ github.run_id }}
          retention-days: 30
          path: |
            data/forecast-release-v12.json
            data/v12-frozen-source-manifest.json
            data/v12-source-probe.json
            data/vnindex-v12.json
            data/phase-gates-v12.json
            data/benchmark-gate-v12.json
            data/active-flow-audit-v12.json
            data/active-flow-gate-v12.json
            data/sector-gate-v12.json
            data/nested-selection-gate-v12.json
            data/blind-holdout-gate-v12.json
            data/embargo-gate-v12.json
            v12-release-result.json
