name: Market-wide T-day scan

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 0-4'
    - cron: '45 9 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/update_market_scan.py'
      - 'scripts/update_market_scan_v4.py'
      - 'scripts/update_alert_deep_cache.py'
      - 'data/alert-policy.json'
      - 'api/price_history.py'
      - 'api/radar.py'
      - '.github/workflows/market-wide-scan.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: vmews-market-wide-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market data dependencies
        run: |
          pip install --disable-pip-version-check -q -r requirements.txt
          pip install --disable-pip-version-check -q tradingview-screener==3.2.1
      - name: Build full-market T-day snapshot under canonical policy
        run: python scripts/update_market_scan_v4.py
      - name: Validate market-wide coverage and alert breadth
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/market-scan.json',encoding='utf-8'))
          policy=json.load(open('data/alert-policy.json',encoding='utf-8'))
          c=p.get('coverage',{});b=p.get('breadth',{});m=p.get('marketContext',{});t=p.get('thresholds',{})
          bands=policy['riskIndexBands'];confirm=policy['marketConfirmation']
          assert p.get('version')=='VMEWS-MARKET-SCAN-4.0.0', p.get('version')
          assert p.get('policyVersion')==policy.get('version'),(p.get('policyVersion'),policy.get('version'))
          assert t.get('red')==bands['red'] and t.get('yellow')==bands['yellow'] and t.get('watch')==bands['watch'],t
          assert t.get('redMinIndependentSignals')==confirm['redMinIndependentStressSignals'],t
          assert t.get('yellowMinIndependentSignals')==confirm['yellowMinIndependentStressSignals'],t
          assert p.get('modelDate')
          assert c.get('listedUniverse',0)>=500, c
          assert c.get('tradingViewUniverseRows',0)>=500, c
          assert c.get('priceCovered',0)>=700, c
          assert c.get('coverageRatio',0)>=0.55, c
          assert c.get('featureReady',0)>=500, c
          assert c.get('eligibleLiquidCurrent',0)>=200, c
          assert b.get('redShareEligible',0)<=0.12, b
          assert b.get('redShareEligible',0)+b.get('yellowShareEligible',0)<=0.30, b
          assert isinstance(p.get('redList'),list) and isinstance(p.get('yellowList'),list)
          assert all(x.get('status')=='RED' and x.get('date')==p['modelDate'] and x.get('liquidEligible') and x.get('independentStressSignals',0)>=confirm['redMinIndependentStressSignals'] for x in p['redList'])
          assert all(x.get('status')=='YELLOW' and x.get('date')==p['modelDate'] and x.get('liquidEligible') and x.get('independentStressSignals',0)>=confirm['yellowMinIndependentStressSignals'] for x in p['yellowList'])
          if not m.get('available'):
              assert all(x.get('marketRelativeEvidenceAvailable') is False for x in p.get('ranking',[])), m
          rows=[
            '# VMEWS MARKET-WIDE T-DAY SCAN PASS','',
            f"Policy: {p.get('policyVersion')}",
            f"Generated: {p.get('generatedAt')}",
            f"Review date: {p.get('reviewDate')}",
            f"Model date: {p.get('modelDate')}",
            f"VCI listed-stock reference: {c.get('listedUniverse')}",
            f"TradingView Vietnam rows: {c.get('tradingViewUniverseRows')}",
            f"Cross-matched coverage: {c.get('priceCovered')} ({c.get('coverageRatio',0):.1%})",
            f"Feature-ready: {c.get('featureReady')}",
            f"Eligible liquid/current: {c.get('eligibleLiquidCurrent')}",
            f"RED: {b.get('red')} ({b.get('redShareEligible',0):.1%} of eligible)",
            f"YELLOW: {b.get('yellow')} ({b.get('yellowShareEligible',0):.1%} of eligible)",
            f"WATCH: {b.get('watch')}",
            f"New escalations: {b.get('newEscalations')}",
            f"Market-relative evidence: {'available' if m.get('available') else 'excluded / unavailable'}",
            f"Benchmark: {m.get('benchmarkTicker') or m.get('source')}",
            '', 'Top morning attention:',
          ]
          for x in p.get('topAttention',[])[:15]:
            rows.append(f"- {x['symbol']} [{x['exchange']}] {x['status']} {x['score']:.1f}/100 · signals={x.get('independentStressSignals')} · {x.get('transition')} · {'; '.join(x.get('drivers',[])[:2])}")
          body='\n'.join(rows)+'\n'
          open('market-scan-report.md','w',encoding='utf-8').write(body)
          print(body)
          PY
      - name: Build deep-alert CDN cache
        run: python scripts/update_alert_deep_cache.py
      - name: Validate RED and YELLOW deep cache
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/deep-alerts/manifest.json',encoding='utf-8'))
          assert p.get('version')=='VMEWS-DEEP-ALERT-CACHE-1.1.0',p
          assert not p.get('missingRed'),p
          assert not p.get('missingAlerts'),p
          alerts=(p.get('redSymbols') or [])+(p.get('yellowSymbols') or [])
          assert p.get('cached',0)==len(alerts)==p.get('requested',0),p
          assert p.get('alertCoverageRatio')==1.0,p
          for s in alerts:
              x=json.load(open(f'data/deep-alerts/{s}.json',encoding='utf-8'))
              assert len(x.get('history',[]))>=240,(s,len(x.get('history',[])))
          print(json.dumps(p,ensure_ascii=False,indent=2))
          PY
      - name: Publish market scan diagnostic
        run: |
          echo '' >> market-scan-report.md
          echo 'Deep-alert CDN cache:' >> market-scan-report.md
          python - <<'PY' >> market-scan-report.md
          import json
          p=json.load(open('data/deep-alerts/manifest.json',encoding='utf-8'))
          print(f"- cached: {p.get('cached')}/{p.get('requested')}")
          print(f"- RED guaranteed: {p.get('redSymbols')}")
          print(f"- YELLOW guaranteed: {len(p.get('yellowSymbols') or [])}")
          print(f"- missing alerts: {p.get('missingAlerts')}")
          print(f"- alert deep-history coverage: {p.get('alertCoverageRatio',0):.1%}")
          PY
          gh issue create --repo "$GITHUB_REPOSITORY" --title "VMEWS MARKET SCAN V4 PASS ${GITHUB_SHA::7}" --body-file market-scan-report.md
      - name: Commit refreshed market snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market-scan.json data/deep-alerts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh VMEWS market-wide T-day scan under canonical policy [data-only]'
          git pull --rebase origin main
          git push origin HEAD:main
