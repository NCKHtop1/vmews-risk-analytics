name: FinQuery Vercel deep parity audit
on:
  push:
    branches: [ops/finquery-domain-proxy-verify-20261009]
    paths:
      - 'scripts/finquery_vercel_parity_audit.py'
      - 'scripts/finquery_vercel_browser_audit.py'
      - 'scripts/finquery_vercel_freshness_diff.py'
      - 'scripts/finquery_vercel_bank_network_audit.py'
      - '.github/workflows/finquery-vercel-deep-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http-data:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Compare origin and Vercel source/data/deep links
        run: python scripts/finquery_vercel_parity_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finquery-vercel-parity-http
          path: finquery-parity-http-report.json
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependency
        run: pip install -q --disable-pip-version-check selenium==4.36.0
      - name: Compare live browser behavior and UI on GitHub and Vercel
        run: |
          if [ -f scripts/finquery_vercel_browser_audit.py ]; then
            python scripts/finquery_vercel_browser_audit.py
          else
            echo "BROWSER AUDIT NOT IMPLEMENTED (not a pass)"
            exit 2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finquery-vercel-parity-browser
          path: finquery-browser-audit.json
          if-no-files-found: ignore
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compare live news and snapshot freshness, with cache-busting
        run: python scripts/finquery_vercel_freshness_diff.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finquery-vercel-freshness
          path: finquery-freshness-diff.json
          if-no-files-found: ignore
  bank-network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium/Selenium
        run: pip install -q selenium==4.36.0
      - name: Open Vercel FinQuery with github.io/githubusercontent.com blocked
        run: python scripts/finquery_vercel_bank_network_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finquery-bank-network
          path: finquery-bank-network-audit.json
          if-no-files-found: ignore
