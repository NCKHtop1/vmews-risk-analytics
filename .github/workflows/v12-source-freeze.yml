name: V12 freeze audited research source
on:
  workflow_dispatch:
  push:
    branches: [forecast-v12-methodfix]
    paths:
      - 'v12-source-freeze-debug-trigger.txt'
permissions:
  contents: write
concurrency:
  group: vmews-v12-source-freeze
  cancel-in-progress: true
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      V12_MIN_ROWS: '520'
      V12_VNSTOCK_INTERVAL: '3.25'
      V12_MAX_RAW_RETURN_GUARD: '0.12'
      V12_CROSS_SOURCE_MAD_LIMIT: '0.003'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Pin source commit for immutable capture
        run: echo "V12_FREEZE_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-v12.txt
      - name: Install V12 source dependencies
        run: pip install --disable-pip-version-check -q -r requirements-v12.txt
      - name: Compile frozen-source implementation
        run: |
          python -m py_compile scripts/v12_data_sources.py scripts/v12_corporate_actions.py scripts/v12_corporate_actions_test.py scripts/v12_source_capture.py scripts/v12_universe.py scripts/freeze_v12_source_snapshot.py scripts/v12_research_sources.py
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/v12_train_parts/00c_universe.pyinc')
          compile(p.read_text(encoding='utf-8'),str(p),'exec')
          print('V12 FROZEN SOURCE SYNTAX PASS')
          PY
      - name: Corporate-action and source-spike reconciliation regression
        run: PYTHONPATH=scripts python scripts/v12_corporate_actions_test.py
      - name: Capture and fingerprint one immutable research source snapshot
        run: PYTHONPATH=scripts python scripts/freeze_v12_source_snapshot.py
      - name: Preserve source-freeze diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-source-freeze-diagnostic-${{ github.run_id }}
          path: data/v12-source-freeze-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify frozen artifact before publication
        run: |
          python - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          p=Path('data/v12-frozen-source.json.gz')
          m=json.load(open('data/v12-frozen-source-manifest.json',encoding='utf-8'))
          assert p.exists() and p.stat().st_size>1_000_000,p
          assert m['version']=='VMEWS-FROZEN-SOURCE-MANIFEST-12.1.0',m.get('version')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['snapshotFileSha256']
          z=json.loads(gzip.decompress(p.read_bytes()).decode('utf-8'))
          assert z['version']=='VMEWS-FROZEN-SOURCE-12.1.0',z.get('version')
          assert len(z['histories'])==m['available']
          current=set(z.get('currentHOSESymbols') or [])
          historical=set((z.get('historicalCandidates') or {}).keys())
          requested=set(z.get('requestedSymbols') or [])
          assert current and not (current & historical),(len(current),len(historical),sorted(current&historical))
          assert current|historical==requested,(len(current),len(historical),len(requested))
          assert len(current)==m['currentHOSERequested']
          assert len(historical)==m['historicalCandidateRequested']
          assert m['currentSourceCoverageRatio']>=.98,m['currentSourceCoverageRatio']
          assert m['deepHistory']>=360,m['deepHistory']
          assert m['modelEligible']>=360,m['modelEligible']
          assert len(str(m['inputManifestSha256']))==64
          print('V12.1 FROZEN SOURCE + UNIVERSE VERIFY PASS',m['asOf'],len(current),len(historical),m['snapshotFileSha256'],m['inputManifestSha256'])
          PY
      - name: Publish immutable source snapshot to branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$V12_FREEZE_SOURCE_SHA"
          git fetch origin forecast-v12-methodfix
          REMOTE_SHA=$(git rev-parse origin/forecast-v12-methodfix)
          test "$REMOTE_SHA" = "$V12_FREEZE_SOURCE_SHA" || { echo "BRANCH ADVANCED DURING SOURCE FREEZE: source=$V12_FREEZE_SOURCE_SHA remote=$REMOTE_SHA; refusing to attach stale capture"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v12-frozen-source.json.gz data/v12-frozen-source-manifest.json
          git commit -m 'Publish immutable V12 research source snapshot [no-full]'
          PUBLISHED_SHA=$(git rev-parse HEAD)
          test "$(git rev-parse ${PUBLISHED_SHA}^)" = "$V12_FREEZE_SOURCE_SHA"
          git push origin HEAD:forecast-v12-methodfix
