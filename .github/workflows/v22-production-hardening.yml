name: V22 production hardening and full-system validation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/vn30-defensive-fallback-20260825
    paths:
      - ".github/workflows/v22-production-hardening.yml"

permissions:
  contents: write

# V22 gate revision 11: sentinel session file and inline favicon eliminate expected 404s.
jobs:
  harden-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vn30-defensive-fallback-20260825
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply guarded V22 hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/v22_patch_repair.py
          python scripts/v22_patch_repair.py
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/v22_hardening_patch.py')
          text=p.read_text(encoding='utf-8').replace('` ,','`,')
          p.write_text(text,encoding='utf-8')
          PY
          python -m py_compile scripts/v22_hardening_patch.py
          python scripts/v22_hardening_patch.py
          python - <<'PY'
          from pathlib import Path
          for name in ('solution-ai-v17.js','forecast-live-leaders-v14.js','forecast-final-v12.js','api/solution-ai.js'):
              p=Path(name)
              lines=p.read_text(encoding='utf-8').splitlines()
              p.write_text('\n'.join(line.rstrip() for line in lines)+'\n',encoding='utf-8')
          PY

      - name: Run static runtime AI and data regression suites
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check -q pandas numpy scipy scikit-learn openpyxl
          node --check forecast-final-v12.js
          node --check forecast-live-leaders-v14.js
          node --check solution-ai-v17.js
          node --check api/solution-ai.js
          python -m unittest scripts.forecast_v14_frontend_contract_test
          python scripts/forecast_v21_session_snapshot_test.py
          node --test scripts/forecast_v18_frontend_runtime_test.mjs scripts/solution_ai_v17_test.mjs scripts/solution_ai_frontend_v17_test.mjs
          python scripts/sanitize_intelligence_v20.py
          python scripts/sanitize_intelligence_v20_test.py
          python scripts/forecast_v20_release_audit.py --output /tmp/release-audit-v22.json
          git diff --check

      - name: Probe real session provider without publishing
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check -q tradingview-screener==3.2.1
          python scripts/forecast_v21_session_snapshot.py --output /tmp/forecast-session-v21.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/forecast-session-v21.json',encoding='utf-8'))
          print(json.dumps({'liveProviderStatus':p['status'],'session':p['session'],'coverage':p['coverage'],'leaders':[x['symbol'] for x in p['leaders']]},ensure_ascii=False,indent=2))
          PY

      - name: Browser E2E desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          python -m http.server 8765 >/tmp/vmews-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node scripts/forecast_v22_browser_e2e.mjs

      - name: Commit validated V22 hardening and remove one-time tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v22-production-hardening.yml scripts/v22_hardening_patch.py scripts/v22_patch_repair.py
          git add -A
          git diff --cached --check
          git commit -m "V22 harden live data ranking CDN delivery and AI UX"
          git push origin HEAD:fix/vn30-defensive-fallback-20260825
