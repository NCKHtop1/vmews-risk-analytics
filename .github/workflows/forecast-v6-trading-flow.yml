name: Forecast V6 trading flow
on:
  push:
    branches: [forecast-v6-research-grade]
    paths: ['scripts/audit_vnstock_trading_flow.py','.github/workflows/forecast-v6-trading-flow.yml']
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python scripts/audit_vnstock_trading_flow.py
