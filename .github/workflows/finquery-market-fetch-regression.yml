name: FinQuery market source coherence regression
on:
  pull_request:
    paths:
      - 'financial-report/frontend/market-data.js'
      - 'financial-report/tests/market_data.test.cjs'
      - 'financial-report/tests/test_quote_failover.cjs'
      - '.github/workflows/finquery-market-fetch-regression.yml'
  push:
    branches: [main]
    paths:
      - 'financial-report/frontend/market-data.js'
      - 'financial-report/tests/market_data.test.cjs'
      - 'financial-report/tests/test_quote_failover.cjs'
      - '.github/workflows/finquery-market-fetch-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source prioritization and atomic bundle contract
        run: |
          node --check financial-report/frontend/market-data.js
          node --test financial-report/tests/market_data.test.cjs
          node financial-report/tests/test_quote_failover.cjs
