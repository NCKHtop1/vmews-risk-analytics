name: Research data refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_research_news.py'
      - 'scripts/update_market_context.py'
      - '.github/workflows/research-data-refresh.yml'

permissions:
  contents: write

concurrency:
  group: vmews-research-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build market and news snapshots
        run: |
          python scripts/update_market_context.py
          python scripts/update_research_news.py
      - name: Validate snapshots
        run: |
          python - <<'PY'
          import json
          m=json.load(open('data/market-context.json',encoding='utf-8'))
          n=json.load(open('data/research-news.json',encoding='utf-8'))
          assert m.get('market',{}).get('available') and m['market'].get('rows',0)>=240
          assert len(n.get('symbols',{}))>=30
          assert set(n.get('symbols',{}))==set(n.get('coverage',{}))
          print('market rows',m['market']['rows'],'symbols',len(n['symbols']))
          PY
      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market-context.json data/research-news.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh VMEWS research snapshots [data-only]'
          git push
