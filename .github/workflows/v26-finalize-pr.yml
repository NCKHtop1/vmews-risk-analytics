name: V26 finalize audited ranking on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: v26-finalize-audited-ranking-pr
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/realtime-session-baseline-v22'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/realtime-session-baseline-v22
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply audited-horizon patch from reviewed finalizer
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/v26-finalize-leaderboard.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          code = textwrap.dedent('\n'.join(workflow[start:end]))
          exec(compile(code, 'v26-finalizer-embedded.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Frontend runtime regression
        run: node --test scripts/forecast_v18_frontend_runtime_test.mjs
      - name: Session snapshot regression
        run: |
          python -m pip install -q pandas
          python scripts/forecast_v21_session_snapshot_test.py
      - name: Accuracy and whole-market price-grid audits
        run: |
          python scripts/forecast_v24_accuracy_audit.py --output /tmp/forecast-accuracy-v24.json
          python scripts/forecast_v26_price_grid_audit.py --output /tmp/forecast-price-grid-audit-v26.json
          python - <<'PY'
          import json
          accuracy=json.load(open('/tmp/forecast-accuracy-v24.json'))
          grid=json.load(open('/tmp/forecast-price-grid-audit-v26.json'))
          h=int(accuracy['rankingPolicy']['selectedHorizon'])
          assert 1 <= h <= 5, h
          assert accuracy['rankingPolicy']['coreForecastChanged'] is False
          assert grid['status'] == 'PASS', grid
          print(json.dumps({'rankingHorizon':h,'rankingDegraded':accuracy['rankingPolicy']['degraded'],'priceGrid':{k:grid[k] for k in ('status','validatedForecasts','invalidForecasts','tickCounts','oneTickMoveShare','medianMoveTicks','FPTT5','warnings')}},ensure_ascii=False,indent=2))
          PY
      - name: Commit final patch only after all tests pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forecast-live-leaders-v14.js scripts/forecast_v18_frontend_runtime_test.mjs
          if git diff --cached --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git commit -m 'Use audited ranking horizon in live leaderboard'
          git push origin HEAD:fix/realtime-session-baseline-v22
