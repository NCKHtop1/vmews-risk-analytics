name: FinQuery VN100 forecast product and source regression
on:
  pull_request:
    paths:
      - 'scripts/finquery_vn100_timeseries.py'
      - 'scripts/finquery_vn100_product.py'
      - 'scripts/test_finquery_vn100_product.py'
      - 'scripts/test_finquery_vn100_frontend.cjs'
      - 'scripts/system_contract_audit.py'
      - 'scripts/system_contract_audit_test.py'
      - 'scripts/system_contract_audit.py'
      - 'scripts/system_contract_audit_test.py'
      - 'forecast-final.html'
      - 'forecast-portfolio-v14.css'
      - 'financial-report/scripts/live_session_publisher.sh'
      - 'forecast-final-v12.js'
      - 'forecast-polish-v12.js'
      - 'forecast-live-leaders-v14.js'
      - '.github/workflows/finquery-vn100-forecast.yml'
      - '.github/workflows/finquery-vn100-product-qa.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/finquery_vn100_timeseries.py'
      - 'scripts/finquery_vn100_product.py'
      - 'scripts/test_finquery_vn100_product.py'
      - 'scripts/test_finquery_vn100_frontend.cjs'
      - 'forecast-final.html'
      - 'forecast-portfolio-v14.css'
      - 'financial-report/scripts/live_session_publisher.sh'
      - 'forecast-final-v12.js'
      - 'forecast-polish-v12.js'
      - 'forecast-live-leaders-v14.js'
      - '.github/workflows/finquery-vn100-forecast.yml'
      - '.github/workflows/finquery-vn100-product-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vn100-publisher-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate browser module syntax and source resolution
        run: |
          node --check forecast-final-v12.js
          node --check forecast-polish-v12.js
          node --check forecast-live-leaders-v14.js
          bash -n financial-report/scripts/live_session_publisher.sh
          node --test scripts/test_finquery_vn100_frontend.cjs
      - name: Test numerical 100 x 5 forecast and historical fallback
        run: |
          python -m py_compile scripts/finquery_vn100_timeseries.py scripts/finquery_vn100_product.py
          python -m unittest scripts/test_finquery_vn100_product.py -v
          cd scripts && FINQUERY_CORE_ONLY=1 python system_contract_audit_test.py

  canonical-system-contract-preview:
    if: github.event_name == 'pull_request'
    needs: vn100-publisher-and-ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          ref: financial-market-data
          path: _market-data
          sparse-checkout: market
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: financial-report-data
          path: _financial-data
          sparse-checkout: data
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: financial-insights-data
          path: _insight-data
          sparse-checkout: data
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: finquery-vn100-data
          path: _vn100-data
          sparse-checkout: data
          persist-credentials: false
      - name: Recompute full FinQuery production contract against canonical VN100 source
        run: |
          python scripts/system_contract_audit.py \
            --market-dir _market-data/market \
            --financial-dir _financial-data/data \
            --insights-dir _insight-data/data \
            --vn100-dir _vn100-data/data \
            --ignore-solution-ai \
            --repo-root . \
            --report-json /tmp/finquery-forecast-contract-preview.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finquery-forecast-contract-preview
          path: /tmp/finquery-forecast-contract-preview.json
          retention-days: 7
