name: Refresh FinQuery prices and company news
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dataset to refresh
        type: choice
        options: [all, prices, news, macro, esg, esg-history, history, intraday]
        default: all
  push:
    branches: [main]
    paths:
      - 'financial-report/scripts/refresh_esg.py'
      - 'financial-report/config/esg_sources.json'
      - 'financial-report/scripts/build_risk_monitor.cjs'
      - 'financial-report/scripts/build_sector_risk_calibration.cjs'
      - '.github/workflows/financial-market-refresh.yml'
  schedule:
    # Fallback watchdogs for the dedicated live workflows. They run only when
    # the published snapshot is stale, so missed GitHub cron events self-heal.
    - cron: '0,15,30,45 2-8 * * 1-5'
    - cron: '7,22,37,52 * * * *'
    # VBMA macro tables refresh once each business day.
    - cron: '15 1 * * 1-5'
    # Corporate ESG source discovery: once each business day, plus Saturday history catch-up.
    - cron: '47 14 * * 1-5'
    - cron: '47 2 * * 6'
    # Heavy candle history runs separately after the Vietnam close.
    - cron: '20 9 * * 1-5'
    - cron: '35 9 * * 1-5'
permissions:
  contents: write
  actions: write
concurrency:
  group: financial-market-data-publisher
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            financial-report
            data/fund-holdings-history-v16.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore last successful market snapshots
        run: |
          if git ls-remote --exit-code --heads origin financial-market-data; then
            git fetch origin financial-market-data
            git worktree add /tmp/market-publish FETCH_HEAD
            git -C /tmp/market-publish sparse-checkout set market
          else
            mkdir -p /tmp/market-publish
            git -C /tmp/market-publish init
            git -C /tmp/market-publish remote add origin "$(git remote get-url origin)"
            git -C /tmp/market-publish config http.https://github.com/.extraheader "$(git config --get http.https://github.com/.extraheader)"
          fi
          mkdir -p /tmp/market-publish/market
      - name: Install ESG document parser
        if: github.event_name == 'push' || inputs.mode == 'esg' || inputs.mode == 'esg-history' || github.event.schedule == '47 14 * * 1-5' || github.event.schedule == '47 2 * * 6' || contains(github.event.head_commit.message, '[esg-refresh]')
        run: pip install -q pypdf==5.1.0 'cryptography>=45,<47' 'PyMuPDF>=1.25,<1.27'
      - name: Collect prices, candles, publisher headlines and ESG
        id: collect
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INTRADAY_ONLY_MISSING: ${{ contains(github.event.head_commit.message, '[intraday-missing]') && '1' || '0' }}
          INTRADAY_SYMBOLS: ${{ contains(github.event.head_commit.message, '[intraday-critical]') && 'VHM,VCB' || '' }}
          INTRADAY_COUNT_BACK: ${{ contains(github.event.head_commit.message, '[intraday-critical]') && '300' || '700' }}
          INTRADAY_BACKFILL: ${{ (contains(github.event.head_commit.message, '[intraday-backfill]') || inputs.mode == 'intraday') && '1' || '0' }}
          INTRADAY_BACKFILL_COUNT: '5000'
          INTRADAY_PAGE_SIZE: '700'
          INTRADAY_BACKFILL_PAGES: '2'
          INTRADAY_RETAIN_1M_BARS: '3000'
          INTRADAY_5M_RETAIN_BARS: '6000'
          INTRADAY_WORKERS: ${{ contains(github.event.head_commit.message, '[intraday-critical]') && '1' || '3' }}
          HISTORY_COUNT_BACK: ${{ (contains(github.event.head_commit.message, '[history-full]') || inputs.mode == 'history') && '12000' || '1600' }}
          HISTORY_WORKERS: ${{ (contains(github.event.head_commit.message, '[history-full]') || inputs.mode == 'history') && '2' || '4' }}
          HISTORY_RETRY_WORKERS: '2'
          HISTORY_PAGE_SIZE: ${{ (contains(github.event.head_commit.message, '[history-full]') || inputs.mode == 'history') && '1000' || '1600' }}
          HISTORY_RETRIES: ${{ (contains(github.event.head_commit.message, '[history-full]') || inputs.mode == 'history') && '3' || '2' }}
          HISTORY_RECENT_COUNT: '80'
          HISTORY_KBS_FULL: ${{ (contains(github.event.head_commit.message, '[history-full]') || inputs.mode == 'history') && '1' || '0' }}
          HISTORY_START_DATE: '1998-01-01'
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mode="${REQUESTED_MODE:-all}"
          # Push-triggered runs are now ESG-only. Live price/news have dedicated
          # workflows and must never be overwritten by a generic mode=all push.
          if [ "$EVENT_NAME" = 'push' ]; then mode=esg; fi
          if [ "$EVENT_SCHEDULE" = '0,15,30,45 2-8 * * 1-5' ]; then mode=prices-watchdog; fi
          if [ "$EVENT_SCHEDULE" = '7,22,37,52 * * * *' ]; then mode=news-watchdog; fi
          if [ "$EVENT_SCHEDULE" = '15 1 * * 1-5' ]; then mode=macro; fi
          if [ "$EVENT_SCHEDULE" = '47 14 * * 1-5' ]; then mode=esg; fi
          if [ "$EVENT_SCHEDULE" = '47 2 * * 6' ]; then mode=esg-history; fi
          if printf '%s' "$COMMIT_MESSAGE" | grep -q '\[esg-refresh\]'; then mode=esg; fi
          if [ "$EVENT_SCHEDULE" = '20 9 * * 1-5' ]; then mode=history; fi
          if [ "$EVENT_SCHEDULE" = '35 9 * * 1-5' ]; then mode=intraday; fi
          if printf '%s' "$COMMIT_MESSAGE" | grep -Eq '\[(intraday-backfill|intraday-missing|intraday-critical)\]'; then mode=intraday; fi
          if printf '%s' "$COMMIT_MESSAGE" | grep -q '\[history-refresh\]'; then mode=history; fi
          if printf '%s' "$COMMIT_MESSAGE" | grep -q '\[history-full\]'; then mode=history; fi
          if [ "$mode" = 'prices-watchdog' ]; then
            if python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          VN=timezone(timedelta(hours=7)); now=datetime.now(timezone.utc); local=now.astimezone(VN)
          mins=local.hour*60+local.minute
          active=local.weekday()<5 and ((9*60<=mins<=11*60+40) or (12*60+55<=mins<=15*60+15))
          if not active: raise SystemExit(0)
          try: d=json.loads(Path('/tmp/market-publish/market/quotes.json').read_text())
          except Exception: raise SystemExit(1)
          raw=d.get('latestSourceTime') or d.get('checkedAt')
          try:
              stamp=datetime.fromisoformat(str(raw).replace('Z','+00:00')).astimezone(timezone.utc)
              checked=datetime.fromisoformat(str(d.get('checkedAt')).replace('Z','+00:00')).astimezone(timezone.utc)
          except Exception: raise SystemExit(1)
          age=(now-stamp).total_seconds()/60
          checked_age=(now-checked).total_seconds()/60
          same_day=stamp.astimezone(VN).date()==local.date()
          import math
          expected=max(1,int(d.get('expected') or 0))
          required=max(1,math.ceil(expected*.90))
          fresh=d.get('status')=='ok' and int(d.get('coverage') or 0)>=required and same_day and age<=18 and checked_age<=10
          print('PRICE WATCHDOG',{'fresh':fresh,'ageMin':round(age,1),'checkedAgeMin':round(checked_age,1),'source':raw})
          raise SystemExit(0 if fresh else 1)
          PY
            then
              echo "Dedicated price snapshot is fresh; watchdog skipped."
              exit 0
            else
              active=$(gh run list --repo "$GH_REPO" --workflow market-price-live.yml --limit 10 --json status --jq 'any(.[]; .status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")' 2>/dev/null || echo false)
              if [ "$active" != "true" ]; then
                gh workflow run market-price-live.yml --repo "$GH_REPO" --ref main
                echo "PRICE WATCHDOG dispatched dedicated live publisher."
              else
                echo "PRICE WATCHDOG found dedicated live publisher already active."
              fi
              exit 0
            fi
          fi
          if [ "$mode" = 'news-watchdog' ]; then
            if python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          now=datetime.now(timezone.utc)
          try: d=json.loads(Path('/tmp/market-publish/market/news.json').read_text())
          except Exception: raise SystemExit(1)
          try: stamp=datetime.fromisoformat(str(d.get('checkedAt')).replace('Z','+00:00')).astimezone(timezone.utc)
          except Exception: raise SystemExit(1)
          age=(now-stamp).total_seconds()/60
          fresh=d.get('status')=='ok' and bool(d.get('items')) and age<=20
          print('NEWS WATCHDOG',{'fresh':fresh,'ageMin':round(age,1),'checkedAt':d.get('checkedAt')})
          raise SystemExit(0 if fresh else 1)
          PY
            then
              echo "Dedicated news snapshot is fresh; watchdog skipped."
              exit 0
            else
              active=$(gh run list --repo "$GH_REPO" --workflow market-news-live.yml --limit 10 --json status --jq 'any(.[]; .status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")' 2>/dev/null || echo false)
              if [ "$active" != "true" ]; then
                gh workflow run market-news-live.yml --repo "$GH_REPO" --ref main
                echo "NEWS WATCHDOG dispatched dedicated news publisher."
              else
                echo "NEWS WATCHDOG found dedicated news publisher already active."
              fi
              exit 0
            fi
          fi
          if [ "$mode" = 'esg' ]; then
            python -u financial-report/scripts/refresh_esg.py --output /tmp/market-publish/market
          elif [ "$mode" = 'esg-history' ]; then
            ESG_HISTORY_BACKFILL=1 python -u financial-report/scripts/refresh_esg.py --output /tmp/market-publish/market
          elif [ "$mode" = 'prices' ]; then
            MARKET_REQUIRE_TODAY=1 python -u financial-report/scripts/refresh_market.py --output /tmp/market-publish/market --mode prices
          else
            python -u financial-report/scripts/refresh_market.py --output /tmp/market-publish/market --mode "$mode"
          fi
      - name: Publish intraday Risk clock shadow
        if: github.event.schedule == '35 9 * * 1-5' || inputs.mode == 'intraday' || contains(github.event.head_commit.message, '[intraday-backfill]') || contains(github.event.head_commit.message, '[intraday-missing]') || contains(github.event.head_commit.message, '[intraday-critical]')
        run: |
          set -euo pipefail
          if [ -d /tmp/market-publish/market/intraday-5m ]; then
            node financial-report/scripts/build_intraday_risk_clock_challenger.cjs /tmp/market-publish/market /tmp/market-publish/market/intraday-risk-clock-shadow.json
            python - <<'PY'
          import json
          p='/tmp/market-publish/market/intraday-risk-clock-shadow.json'
          d=json.load(open(p))
          assert d.get('version')=='FINQUERY-INTRADAY-CLOCK-CHALLENGER-0.2',d.get('version')
          assert d.get('recommendation',{}).get('status') in ('PROMOTE_TO_SHADOW','KEEP_RESEARCH_ONLY'),d.get('recommendation')
          print('RISK CLOCK SHADOW', {
              'recommendation':d.get('recommendation'),
              'baseline85':d.get('baseline',{}).get('threshold85'),
              'range85':d.get('variants',{}).get('range',{}).get('threshold85'),
              'volume85':d.get('variants',{}).get('volume',{}).get('threshold85')
          })
          PY
          else
            echo "::warning::No intraday-5m archive available; skipping Risk clock shadow."
          fi

      - name: Persist aligned market risk history
        if: always()
        run: |
          if [ -f /tmp/market-publish/market/quotes.json ] && [ -f /tmp/market-publish/market/strategy-indicators.json ]; then
            if node financial-report/scripts/build_sector_risk_calibration.cjs /tmp/market-publish/market && node financial-report/scripts/build_risk_monitor.cjs /tmp/market-publish/market; then
              echo "Risk history aligned and ready to publish."
            else
              echo "::warning::Risk snapshot was not rebuilt because its market inputs are not aligned."
            fi
          else
            echo "Risk inputs not available in this refresh; keeping last successful risk snapshot."
          fi
      - name: Publish market snapshots without replacing financial reports
        if: always()
        working-directory: /tmp/market-publish
        run: |
          test -d market
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse market
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh FinQuery market prices, candles and company news'
            if ! git push origin HEAD:refs/heads/financial-market-data; then
              echo "Market data branch advanced during this run; rebasing once and retrying."
              git fetch origin financial-market-data
              git rebase FETCH_HEAD
              git push origin HEAD:refs/heads/financial-market-data
            fi
          fi
      - name: Summarize source coverage
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/market-publish/market')
          for name in ['quotes.json','drivers.json','prices-status.json','history-status.json','intraday-status.json','intraday-risk-clock-shadow.json','news.json','macro.json','company-esg.json','esg-status.json','history/MBB.json']:
              f=p/name
              if not f.exists(): continue
              d=json.loads(f.read_text())
              if name=='quotes.json': print('BOARD', d.get('coverage'), d.get('quotes',{}).get('MBB'))
              elif name=='drivers.json': print('DRIVERS',len(d.get('symbols',{})),d.get('symbols',{}).get('MBB'))
              elif name=='news.json': print('NEWS',d.get('sources'),d.get('items',[])[:3])
              elif name=='macro.json': print('MACRO',d.get('status'),[(k,len(v.get('rows',[]))) for k,v in d.get('datasets',{}).items()])
              elif name=='company-esg.json': print('CORPORATE ESG',d.get('status'),d.get('run'),[(k,v.get('coverage')) for k,v in list(d.get('companies',{}).items())[:5]])
              elif name=='esg-status.json': print('ESG STATUS',d)
              elif name=='intraday-risk-clock-shadow.json': print('RISK CLOCK SHADOW',d.get('recommendation'),d.get('baseline',{}).get('threshold85'),d.get('variants',{}).get('range',{}).get('threshold85'))
              elif name=='history/MBB.json': print('MBB HISTORY',len(d.get('bars',[])),d.get('bars',[])[-2:])
              else: print('STATUS',d)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finquery-market-snapshots
          path: /tmp/market-publish/market
          retention-days: 3
