name: V12 focused CA diagnostic
on:
  push:
    branches: [forecast-v12-methodfix]
    paths: ['v12-ca-focus-trigger.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      V12_MIN_ROWS: '520'
      V12_VNSTOCK_INTERVAL: '1.0'
      V12_MAX_RAW_RETURN_GUARD: '0.12'
      V12_CROSS_SOURCE_MAD_LIMIT: '0.003'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-v12.txt
      - run: pip install --disable-pip-version-check -q -r requirements-v12.txt
      - name: Compile CA focus probe
        run: python -m py_compile scripts/v12_corporate_actions.py scripts/v12_source_capture.py scripts/v12_ca_focus_probe.py
      - name: Run focused 43-symbol CA probe
        run: PYTHONPATH=scripts python scripts/v12_ca_focus_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-ca-focus-${{ github.run_id }}
          retention-days: 7
          path: v12-ca-focus.json
