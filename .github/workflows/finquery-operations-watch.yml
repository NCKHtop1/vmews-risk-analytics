name: FinQuery operations SLO and incident watchdog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/finquery_ops_health.py'
      - 'scripts/finquery_ops_health_test.py'
      - '.github/workflows/finquery-operations-watch.yml'
  pull_request:
    paths:
      - 'scripts/finquery_ops_health.py'
      - 'scripts/finquery_ops_health_test.py'
      - '.github/workflows/finquery-operations-watch.yml'
  schedule:
    # Vietnam session: 09:07–15:52 Mon–Fri. Github timing is best effort.
    - cron: '7,22,37,52 2-8 * * 1-5'
    # Outside business hours: low-overhead heartbeat.
    - cron: '12 0,10,15 * * *'
    - cron: '20 2,8 * * 0,6'
permissions:
  contents: read
concurrency:
  group: finquery-operations-watch
  cancel-in-progress: true
jobs:
  policy-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Syntax, PIT calendar and stale-model regression tests
        run: |
          python -m py_compile scripts/finquery_ops_health.py scripts/finquery_ops_health_test.py
          python -m unittest discover -s scripts -p finquery_ops_health_test.py -v
  live-readonly:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: policy-unit
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Probe production auth, sources, model and publication cadence
        run: |
          python scripts/finquery_ops_health.py --output finquery-ops-health.json --markdown finquery-ops-health.md
          cat finquery-ops-health.md >> "$GITHUB_STEP_SUMMARY"
      - name: Capture classification
        id: assess
        shell: bash
        run: |
          set -euo pipefail
          level="$(python -c 'import json;print(json.load(open("finquery-ops-health.json"))["overall"])')"
          case "$level" in
            CRITICAL|WARNING|OK) ;;
            *) echo "Invalid monitor result"; exit 1 ;;
          esac
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "Overall: $level"
      - name: Deduplicate a critical incident
        if: steps.assess.outputs.level == 'CRITICAL'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create finquery-ops-incident --repo "$GITHUB_REPOSITORY" \
            --color E55353 --description "FinQuery production SLO incident" --force
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label finquery-ops-incident --limit 20 --json number --jq '.[0].number // empty')"
          printf '\nOperational evidence: %s/actions/runs/%s\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> finquery-ops-health.md
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "FinQuery production: model/data/auth health incident" \
              --label finquery-ops-incident --body-file finquery-ops-health.md
          else
            echo "Incident #$existing already open; avoid creating duplicates."
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Issue persists: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
      - name: Resolve an open incident once everything is healthy
        if: steps.assess.outputs.level == 'OK'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label finquery-ops-incident --limit 20 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "Recovered: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: finquery-ops-health
          path: |
            finquery-ops-health.json
            finquery-ops-health.md
          retention-days: 14
      - name: Fail on critical production incidents
        if: steps.assess.outputs.level == 'CRITICAL'
        run: |
          echo "::error::Production health incident: see artifacts and FinQuery ops issue."
          exit 1
