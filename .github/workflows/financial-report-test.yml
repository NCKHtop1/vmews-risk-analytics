name: Test financial report downloads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['financial-report/**', '.github/workflows/financial-report-test.yml']
  pull_request:
    paths: ['financial-report/**', '.github/workflows/financial-report-test.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            financial-report
            api
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -q openpyxl==3.1.5 pandas pandas-ta-classic==0.8.32
      - name: Diagnose provider timestamps without publishing data
        continue-on-error: true
        timeout-minutes: 3
        run: |
          pip install --disable-pip-version-check -q tradingview-screener==3.2.1
          python - <<'PY'
          import importlib.util, json, sys
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          root=Path('financial-report/scripts').resolve()
          sys.path.insert(0,str(root))
          spec=importlib.util.spec_from_file_location('finquery_live_diag',root/'refresh_market.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          symbols=[x['symbol'] for x in json.loads(Path('financial-report/data/companies.json').read_text())]
          clock=datetime.now(timezone.utc)
          print('PROBE_CLOCK',clock.isoformat(),'VN',(clock+timedelta(hours=7)).isoformat(),flush=True)
          try:
              payload=json.loads(m.request(m.API+'price/symbols/getList',{'symbols':symbols},timeout=18))
              allrows=m.normalize_board(payload,symbols,m.now())
              current,stale=m.current_session_quotes(allrows,current=clock,max_age_minutes=18)
              print('VIETCAP',len(allrows),'LIVE18',len(current),'STALE',len(stale),'LATEST',m.newest_source_time(allrows),'FPT',allrows.get('FPT'),flush=True)
          except Exception as exc:
              print('VIETCAP ERROR',repr(exc),flush=True)
          try:
              allrows=m.tradingview_current_board(symbols,m.now())
              current,stale=m.current_session_quotes(allrows,current=clock,max_age_minutes=18)
              lunch,stale_lunch=m.current_session_quotes(allrows,current=clock,max_age_minutes=105)
              print('TRADINGVIEW',len(allrows),'LIVE18',len(current),'LUNCH105',len(lunch),'STALE105',len(stale_lunch),'LATEST',m.newest_source_time(allrows),'FPT',allrows.get('FPT'),flush=True)
          except Exception as exc:
              print('TRADINGVIEW ERROR',repr(exc),flush=True)
          PY
      - name: Dry run complete quote and derived publish chain on isolated worktree
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          git sparse-checkout add data
          git fetch origin financial-market-data
          git worktree add /tmp/finquery-oct08-dry origin/financial-market-data
          git -C /tmp/finquery-oct08-dry sparse-checkout set market
          export MARKET_REQUIRE_TODAY=1
          export MARKET_MAX_QUOTE_AGE_MINUTES=105
          echo "STAGE=quote"
          python -u financial-report/scripts/refresh_market.py --output /tmp/finquery-oct08-dry/market --mode prices
          echo "STAGE=technical"
          python -u financial-report/scripts/build_technical_evidence.py --output /tmp/finquery-oct08-dry/market
          echo "STAGE=strategy"
          node financial-report/scripts/build_strategy_snapshot.cjs /tmp/finquery-oct08-dry/market
          echo "STAGE=sector-risk"
          node financial-report/scripts/build_sector_risk_calibration.cjs /tmp/finquery-oct08-dry/market
          echo "STAGE=market-calibration"
          node financial-report/scripts/build_market_risk_calibration.cjs /tmp/finquery-oct08-dry/market
          echo "STAGE=risk-monitor"
          node financial-report/scripts/build_risk_monitor.cjs /tmp/finquery-oct08-dry/market
          echo "STAGE=final-status"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/finquery-oct08-dry/market')
          for key in ('quotes','prices-status','technical-signals','strategy-indicators','risk-monitor','market-risk-calibration'):
              d=json.loads((p/(key+'.json')).read_text())
              print(key,'status',d.get('status'),'checkedAt',d.get('checkedAt'),'source',d.get('sourceTime') or d.get('latestSourceTime'),'coverage',d.get('coverage'),flush=True)
          PY
          echo "STAGE=exact-publisher-validation"
          python - <<'PY'
          import os,subprocess,sys
          from pathlib import Path
          src=Path('financial-report/scripts/live_session_publisher.sh').read_text()
          start='SNAPSHOT_DIR="$OUT/market" MAX_AGE_MINUTES="$effective_max_age" python - <<' + "'PY'\\n"
          if start not in src:
              raise SystemExit('Could not extract authoritative publisher validator')
          script=src.split(start,1)[1].split('\\nPY\\n',1)[0]
          env=dict(os.environ,SNAPSHOT_DIR='/tmp/finquery-oct08-dry/market',MAX_AGE_MINUTES='105')
          result=subprocess.run([sys.executable,'-c',script],env=env,check=False)
          print('EXACT_PUBLISHER_VALIDATOR_EXIT',result.returncode,flush=True)
          raise SystemExit(result.returncode)
          PY
      - name: Build production bundle from frontend source
        run: python financial-report/scripts/build_cdn.py
      - run: python -m unittest discover -s financial-report/tests -v
      - name: Test timestamp-verified fallback independently
        run: python financial-report/tests/test_tradingview_quote_fallback.py
      - run: python -m py_compile api/live_market.py financial-report/scripts/build_technical_evidence.py financial-report/scripts/finalize_intraday_archive.py
      - run: bash -n financial-report/scripts/live_session_publisher.sh financial-report/scripts/live_intraday_publisher.sh
      - run: node --check financial-report/frontend/chart-math.js && node --check financial-report/frontend/chart-engine.js && node --check financial-report/frontend/market.js && node --check financial-report/frontend/risk-monitor.js && node --check financial-report/frontend/technical-scanner.js && node --check financial-report/frontend/strategy-engine.js && node --check financial-report/frontend/alert-center.js && node --check financial-report/frontend/section-collapse.js && node --check financial-report/frontend/insights.js && node --check financial-report/frontend/macro.js && node --check financial-report/frontend/knowledge-base.js && node --check financial-report/frontend/research-agent.js && node --check financial-report/frontend/research-ai.js && node --check financial-report/frontend/dashboard.js && node --check financial-report/frontend/app.js && node --check financial-report/frontend/xlsx.js && node --check financial-report/frontend/metrics.js && node --check api/solution-ai.js
      - run: node --check financial-report/scripts/build_strategy_snapshot.cjs && node --check financial-report/scripts/build_sector_risk_calibration.cjs && node --check financial-report/scripts/build_risk_monitor.cjs
      - run: node --test financial-report/tests/chart_math.test.cjs financial-report/tests/chart_stream.test.cjs financial-report/tests/market_data.test.cjs financial-report/tests/strategy_engine.test.cjs financial-report/tests/strategy_snapshot.test.cjs financial-report/tests/research_agent.test.cjs financial-report/tests/research_ai_deep.test.cjs financial-report/tests/risk_monitor.test.cjs
      - run: node financial-report/tests/knowledge.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: financial-excel-tested
          path: /tmp/*_browser_test.xlsx
          retention-days: 7

