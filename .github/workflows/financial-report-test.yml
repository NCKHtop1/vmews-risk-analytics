name: Test financial report downloads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['financial-report/**', '.github/workflows/financial-report-test.yml']
  pull_request:
    paths: ['financial-report/**', '.github/workflows/financial-report-test.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            financial-report
            api
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -q openpyxl==3.1.5 pandas pandas-ta-classic==0.8.32
      - name: Build production bundle from frontend source
        run: python financial-report/scripts/build_cdn.py
      - run: python -m unittest discover -s financial-report/tests -v
      - run: node --check financial-report/frontend/chart-math.js && node --check financial-report/frontend/chart-engine.js && node --check financial-report/frontend/market.js && node --check financial-report/frontend/technical-scanner.js && node --check financial-report/frontend/insights.js && node --check financial-report/frontend/macro.js && node --check financial-report/frontend/knowledge-base.js && node --check financial-report/frontend/research-ai.js && node --check financial-report/frontend/dashboard.js && node --check financial-report/frontend/app.js && node --check financial-report/frontend/xlsx.js && node --check financial-report/frontend/metrics.js && node --check api/solution-ai.js
      - run: node financial-report/tests/knowledge.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: financial-excel-tested
          path: /tmp/*_browser_test.xlsx
          retention-days: 7

