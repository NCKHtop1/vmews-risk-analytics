name: Research CDN smoke

on:
  push:
    branches: [main]
    paths:
      - 'research-final.html'
      - 'research-final.css'
      - 'research-engine-v2.js'
      - 'research-app.js'
      - 'sector-context.js'
      - 'research-quality.js'
      - 'research-runtime.js'
      - 'research-evidence.js'
      - 'market-fallback.js'
      - 'research-conclusion.js'
      - 'data/market-context.json'
      - 'data/research-news.json'
      - '.github/workflows/research-cdn-smoke.yml'
      - '.research-smoke-trigger'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vmews-research-cdn-smoke
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: End-to-end diagnostic
        shell: bash
        run: |
          set +e
          BASE="https://cdn.githubraw.com/NCKHtop1/vmews-risk-analytics/${GITHUB_SHA}"
          URL="$BASE/research-final.html?smoke=FPT"
          assets=no; syntax=no; market_snapshot=no; news_universe=no; market_live=no; conclusion=no; evidence=no; news_audit=no; ready=no; fpt=no; pnj=no; detail_loaded=no; analysis=no; rf=no; anfis=no; vae=no; lstm=no; ensemble=no; walk=no; nlp=no; old_error=no; empty=no
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 20 "$BASE/research-final.html" -o page.html \
              && curl -fsSL --max-time 20 "$BASE/research-engine-v2.js" -o engine.js \
              && curl -fsSL --max-time 20 "$BASE/research-app.js" -o app.js \
              && curl -fsSL --max-time 20 "$BASE/sector-context.js" -o sector.js \
              && curl -fsSL --max-time 20 "$BASE/research-quality.js" -o quality.js \
              && curl -fsSL --max-time 20 "$BASE/research-runtime.js" -o runtime.js \
              && curl -fsSL --max-time 20 "$BASE/research-evidence.js" -o evidence.js \
              && curl -fsSL --max-time 20 "$BASE/market-fallback.js" -o market.js \
              && curl -fsSL --max-time 20 "$BASE/research-conclusion.js" -o conclusion.js; then assets=yes; break; fi
            sleep 4
          done
          if curl -fsSL --max-time 20 "https://cdn.githubraw.com/NCKHtop1/vmews-risk-analytics/main/data/market-context.json" -o market-context.json; then
            python - <<'PY' && market_snapshot=yes
          import json
          p=json.load(open('market-context.json'));m=p.get('market') or {}
          assert m.get('available') is True and int(m.get('rows',0))>=240 and m.get('date')
          PY
          fi
          if curl -fsSL --max-time 30 "https://cdn.githubraw.com/NCKHtop1/vmews-risk-analytics/main/data/research-news.json" -o research-news.json; then
            python - <<'PY' && news_universe=yes
          import json
          p=json.load(open('research-news.json'));s=p.get('symbols',{});c=p.get('coverage',{})
          assert len(s)>=30 and set(s)==set(c)
          assert 'DXG' in c and c['DXG'].get('used',0)>=8
          PY
          fi
          if [ "$assets" = yes ] && node --check engine.js >/dev/null 2>&1 && node --check app.js >/dev/null 2>&1 && node --check sector.js >/dev/null 2>&1 && node --check quality.js >/dev/null 2>&1 && node --check runtime.js >/dev/null 2>&1 && node --check evidence.js >/dev/null 2>&1 && node --check market.js >/dev/null 2>&1 && node --check conclusion.js >/dev/null 2>&1; then syntax=yes; fi
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          EXIT=127
          if [ "$assets" = yes ] && [ -n "$CHROME" ]; then
            rm -rf /tmp/vmews-research
            timeout 320s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/vmews-research --virtual-time-budget=280000 --dump-dom "$URL" > dom.html 2>chrome.err
            EXIT=$?
          else
            : > dom.html; : > chrome.err
          fi
          grep -Fq 'Ready · STOCK-EWS-5.0.0-PRODUCTION' dom.html && ready=yes
          grep -Fq 'FPT Corporation' dom.html && fpt=yes
          grep -Fq 'Phu Nhuan Jewelry' dom.html && pnj=yes
          grep -Fq 'CURRENT STRUCTURAL ASSESSMENT' dom.html && detail_loaded=yes
          grep -Fq 'Research analysis complete' dom.html && analysis=yes
          grep -Fq 'Random Forest' dom.html && rf=yes
          grep -Fq 'ANFIS' dom.html && anfis=yes
          grep -Fq 'VAE anomaly' dom.html && vae=yes
          grep -Fq 'LSTM crash' dom.html && grep -Fq 'LSTM rebound' dom.html && lstm=yes
          grep -Fq '>Ensemble<' dom.html && ensemble=yes
          grep -Fq 'Purged Walk-Forward Validation' dom.html && walk=yes
          grep -Fq 'weighted NLP baseline' dom.html && nlp=yes
          grep -Fq 'RESEARCH CONCLUSION' dom.html && grep -Fq 'Validation quality' dom.html && conclusion=yes
          grep -Fq 'Evidence sufficiency' dom.html && grep -Fq 'Validation-aware risk' dom.html && evidence=yes
          grep -Fq 'News pipeline' dom.html && grep -Fq 'News coverage' dom.html && news_audit=yes
          if grep -Fq 'VNINDEX regime' dom.html && ! grep -Fq 'VNINDEX data are unavailable' dom.html && ! grep -Fq '>UNAVAILABLE</b><p>VNINDEX' dom.html; then market_live=yes; fi
          grep -Fq 'At least ~200 completed sessions are required' dom.html && old_error=yes
          grep -Fq 'No usable securities returned' dom.html && empty=yes
          STATUS=$(python - <<'PY'
          import re,html
          s=open('dom.html',encoding='utf-8',errors='ignore').read();m=re.search(r'id="analysisStatus"[^>]*>(.*?)</span>',s,re.S)
          print(html.unescape(re.sub('<[^>]+>',' ',m.group(1))).strip() if m else 'NOT_FOUND')
          PY
          )
          pass=no
          if [ "$assets" = yes ] && [ "$syntax" = yes ] && [ "$market_snapshot" = yes ] && [ "$news_universe" = yes ] && [ "$market_live" = yes ] && [ "$conclusion" = yes ] && [ "$evidence" = yes ] && [ "$news_audit" = yes ] && [ "$ready" = yes ] && [ "$fpt" = yes ] && [ "$pnj" = yes ] && [ "$detail_loaded" = yes ] && [ "$analysis" = yes ] && [ "$vae" = yes ] && [ "$lstm" = yes ] && [ "$ensemble" = yes ] && [ "$walk" = yes ] && [ "$nlp" = yes ] && [ "$old_error" = no ] && [ "$empty" = no ]; then pass=yes; fi
          FINAL="$BASE/research-final.html"
          cat > result.md <<EOF
          # VMEWS RESEARCH CDN ${pass^^}

          - Final URL: $FINAL
          - Commit: $GITHUB_SHA
          - Assets: $assets
          - JavaScript syntax: $syntax
          - VNINDEX snapshot valid: $market_snapshot
          - Full-universe news snapshot valid: $news_universe
          - VNINDEX rendered available: $market_live
          - Research conclusion rendered: $conclusion
          - Evidence sufficiency rendered: $evidence
          - News coverage audit rendered: $news_audit
          - Chrome exit: $EXIT
          - Radar ready: $ready
          - FPT visible: $fpt
          - PNJ visible: $pnj
          - Detail loaded: $detail_loaded
          - Analysis status: $STATUS
          - Full research analysis complete: $analysis
          - Random Forest text: $rf
          - ANFIS text: $anfis
          - VAE result: $vae
          - LSTM crash/rebound result: $lstm
          - Walk-forward ensemble row: $ensemble
          - Walk-forward section: $walk
          - Weighted NLP layer: $nlp
          - Old ~200-session error present: $old_error
          - Empty ranking present: $empty
          EOF
          echo '--- chrome tail ---' >> result.md
          echo '```' >> result.md
          tail -40 chrome.err >> result.md
          echo '```' >> result.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "VMEWS RESEARCH CDN ${pass^^} ${GITHUB_SHA::7}" --body-file result.md
          test "$pass" = yes
