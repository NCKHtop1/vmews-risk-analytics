name: Research CDN smoke

on:
  push:
    branches: [main]
    paths:
      - 'research-final.html'
      - 'research-final.css'
      - 'research-engine.js'
      - 'research-app.js'
      - 'sector-context.js'
      - '.github/workflows/research-cdn-smoke.yml'
      - '.research-smoke-trigger'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vmews-research-cdn-smoke
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for immutable CDN assets
        shell: bash
        run: |
          BASE="https://cdn.githubraw.com/NCKHtop1/vmews-risk-analytics/${GITHUB_SHA}"
          echo "$BASE" > base.txt
          ok=0
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 20 "$BASE/research-final.html" -o page.html \
              && curl -fsSL --max-time 20 "$BASE/research-engine.js" -o engine.js \
              && curl -fsSL --max-time 20 "$BASE/research-app.js" -o app.js \
              && curl -fsSL --max-time 20 "$BASE/sector-context.js" -o sector.js; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          node --check engine.js
          node --check app.js
          node --check sector.js
          grep -F 'Variational autoencoder latent anomaly score' page.html
          grep -F 'LSTM dual crash/rebound sequence classifier' page.html

      - name: Verify radar and full FPT research run
        shell: bash
        run: |
          BASE=$(cat base.txt)
          URL="$BASE/research-final.html?smoke=FPT"
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          rm -rf /tmp/vmews-research
          set +e
          timeout 320s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/vmews-research --virtual-time-budget=280000 --dump-dom "$URL" > dom.html 2>chrome.err
          EXIT=$?
          set -e
          echo "chrome_exit=$EXIT"
          grep -F 'Ready · STOCK-EWS-5.0.0-PRODUCTION' dom.html
          grep -F 'FPT Corporation' dom.html
          grep -F 'Phu Nhuan Jewelry' dom.html
          grep -F 'Research analysis complete' dom.html
          grep -F 'POINT-IN-TIME MODEL ENSEMBLE' dom.html
          grep -F 'Random Forest' dom.html
          grep -F 'ANFIS' dom.html
          grep -F 'VAE anomaly' dom.html
          grep -F 'LSTM crash' dom.html
          grep -F 'LSTM rebound' dom.html
          grep -F '>Ensemble<' dom.html
          grep -F 'Purged Walk-Forward Validation' dom.html
          ! grep -Fq 'At least ~200 completed sessions are required' dom.html
          ! grep -Fq 'No usable securities returned' dom.html

      - name: Publish PASS evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BASE=$(cat base.txt)
          URL="$BASE/research-final.html"
          cat > result.md <<EOF
          # VMEWS RESEARCH CDN PASS

          - Final URL: $URL
          - Radar live data: PASS
          - FPT full research analysis: PASS
          - Random Forest: PASS
          - ANFIS: PASS
          - VAE: PASS
          - LSTM crash/rebound: PASS
          - Purged walk-forward table: PASS
          - Old 200-session error: ABSENT
          - Empty ranking: ABSENT
          - Commit: $GITHUB_SHA
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title "VMEWS RESEARCH CDN PASS ${GITHUB_SHA::7}" --body-file result.md
