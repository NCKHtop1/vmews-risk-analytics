name: Legacy VNINDEX market context (manual only)

# Gemini is the target external live provider. This workflow is intentionally
# manual-only so the old public market adapter cannot continue on a schedule.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-disabled:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Legacy market-context refresh is disabled."
          echo "Use the server-side Gemini live provider after GEMINI_API_KEY is configured."
