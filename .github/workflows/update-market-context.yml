name: Update VNINDEX market context

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_market_context.py'
      - '.github/workflows/update-market-context.yml'
  schedule:
    - cron: '20 10 * * 1-5'

permissions:
  contents: write

concurrency:
  group: vmews-market-context
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate market context
        run: python scripts/update_market_context.py
      - name: Commit snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market-context.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh VNINDEX market context snapshot'
          git push
