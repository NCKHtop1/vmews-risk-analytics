name: Forecast V11 final build
on:
  workflow_dispatch:
  push:
    branches: [forecast-v11-production]
    paths:
      - '.github/workflows/forecast-v11-final.yml'
      - 'v11-final-trigger.txt'
  schedule:
    - cron: '35 11 * * 1-5'
permissions:
  contents: write
concurrency:
  group: vmews-v11-production-data
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[v11-data]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install research dependencies
        run: pip install -q numpy scipy scikit-learn pandas requests beautifulsoup4 lxml openpyxl torch transformers pyvi vnstock==4.0.4 tradingview-screener
      - name: Build numerical forecast
        run: python scripts/train_forecast_v11_clean.py
      - name: Backfill trading flow
        run: python scripts/backfill_flow_v11_fixed.py
      - name: Build trading flow study
        run: python scripts/build_flow_study_v11_fixed.py
      - name: Refresh VMEWS risk scan
        run: python scripts/update_market_scan.py
      - name: Backfill news history
        run: python scripts/backfill_news_v11.py
      - name: Run supervised sentiment
        run: python scripts/sentiment_news_v11.py
      - name: Build event study
        run: python scripts/build_news_event_study_v11.py
      - name: Build macro study
        run: python scripts/build_macro_study_v11_fixed.py
      - name: Build dashboard
        run: python scripts/build_dashboard_v11.py
      - name: Update immutable live monitor
        run: python scripts/update_live_forecast_v11.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Frontend syntax
        run: node --check forecast-final-v11.js
      - name: Final production acceptance gate
        run: python scripts/forecast_v11_final_gate.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-v11-final-evidence-${{ github.run_id }}
          retention-days: 7
          path: |
            data/forecast-model-v11.json
            data/forecast-current-v11.json
            data/forecast-dashboard-v11.json
            data/news-history-v11.json
            data/sentiment-v11.json
            data/news-event-study-v11.json
            data/flow-v11.json
            data/flow-study-v11.json
            data/macro-study-v11.json
            data/forecast-v11-final-gate.json
            data/forecast-live-v11/
            data/market-scan.json
      - name: Persist validated snapshots
        if: success()
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/forecast-model-v11.json data/forecast-current-v11.json data/forecast-dashboard-v11.json data/news-event-study-v11.json data/flow-study-v11.json data/macro-study-v11.json data/forecast-v11-final-gate.json data/forecast-live-v11 data/market-scan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh V11 final snapshots [v11-data]'
          git pull --rebase origin forecast-v11-production
          git push origin HEAD:forecast-v11-production
