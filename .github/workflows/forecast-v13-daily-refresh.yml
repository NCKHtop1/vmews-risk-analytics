name: Forecast V20.1 immutable-price audit and market intelligence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/forecast-v13-daily-refresh.yml"
      - ".github/workflows/cdn-smoke.yml"
      - ".github/workflows/forecast-v12-cdn-smoke.yml"
      - "scripts/forecast_freshness_audit.py"
      - "forecast-final.html"
      - "forecast-final-v12.js"
      - "solution-ai-v17.js"
      - "scripts/prepare_forecast_scan_v28.py"
      - "scripts/run_forecast_v28_guarded.py"
      - "scripts/forecast_v41_runtime_patch.py"
      - "scripts/forecast_v41_technical_transition_test.py"
      - "scripts/forecast_v28_postclose_bridge.py"
      - "scripts/forecast_v28_postclose_bridge_test.py"
      - "scripts/vn_exchange_calendar.py"
      - "scripts/vn_exchange_calendar_test.py"
      - "scripts/refresh_institutional_flow_v20_v28.py"
      - "scripts/forecast_v20_release_audit_v28.py"
      - "scripts/forecast_v20_release_audit_v28_test.py"
      - "scripts/forecast_v20_release_audit.py"
      - "scripts/forecast_v20_release_audit_test.py"
      - "scripts/forecast_v13_market_model.py"
      - "scripts/forecast_v13_market_model_test.py"
      - "scripts/forecast_v13_market_model_test_v28.py"
      - "scripts/forecast_horizon_gate_diagnostics.py"
      - "scripts/forecast_release_regression_test.py"
      - "scripts/forecast_v14_frontend_contract_test.py"
      - "scripts/forecast_v16_external_data.py"
      - "scripts/forecast_v17_live_intelligence.py"
      - "scripts/forecast_v18_market_intelligence.py"
      - "scripts/forecast_v18_frontend_runtime_test.mjs"
      - "scripts/forecast_v21_session_snapshot_test.py"
      - "api/solution-ai.js"
  push:
    branches: [main]
    # UI/AI/session-only changes have dedicated smoke/session workflows and must
    # not queue a costly full forecast rebuild behind the shared publisher lock.
    paths:
      - ".github/workflows/forecast-v13-daily-refresh.yml"
      - ".github/workflows/cdn-smoke.yml"
      - ".github/workflows/forecast-v12-cdn-smoke.yml"
      - "scripts/forecast_freshness_audit.py"
      - "scripts/prepare_forecast_scan_v28.py"
      - "scripts/run_forecast_v28_guarded.py"
      - "scripts/forecast_v41_runtime_patch.py"
      - "scripts/forecast_v41_technical_transition_test.py"
      - "scripts/forecast_v28_postclose_bridge.py"
      - "scripts/forecast_v28_postclose_bridge_test.py"
      - "scripts/vn_exchange_calendar.py"
      - "scripts/vn_exchange_calendar_test.py"
      - "scripts/refresh_institutional_flow_v20_v28.py"
      - "scripts/forecast_v20_release_audit_v28.py"
      - "scripts/forecast_v20_release_audit_v28_test.py"
      - "scripts/forecast_v13_market_model.py"
      - "scripts/forecast_v13_market_model_test.py"
      - "scripts/forecast_v13_market_model_test_v28.py"
      - "scripts/forecast_horizon_gate_diagnostics.py"
      - "scripts/forecast_release_regression_test.py"
      - "scripts/forecast_v14_signal_audit.py"
      - "scripts/forecast_v14_frontend_contract_test.py"
      - "scripts/forecast_v16_external_data.py"
      - "scripts/forecast_v16_external_data_test.py"
      - "scripts/forecast_v17_live_intelligence.py"
      - "scripts/forecast_v17_live_intelligence_test.py"
      - "scripts/forecast_v18_market_intelligence.py"
      - "scripts/forecast_v18_market_intelligence_test.py"
      - "financial-report/scripts/build_hose_universe.py"
      - "financial-report/tests/test_universe.py"
      - "scripts/forecast_v18_frontend_runtime_test.mjs"
      - "scripts/refresh_institutional_flow_v20.py"
      - "scripts/refresh_institutional_flow_v20_test.py"
      - "scripts/forecast_v20_release_audit.py"
      - "scripts/forecast_v20_release_audit_test.py"
      - "scripts/sanitize_intelligence_v20.py"
      - "scripts/sanitize_intelligence_v20_test.py"
  schedule:
    # Recovery at 03:17 and 05:17 Vietnam time, including Saturday after Friday.
    - cron: "17 20,22 * * *"
    - cron: "0 0 * * 1-5"
    - cron: "15 9 * * 1-5"
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: vmews-main-data-publisher-${{ github.event_name == 'pull_request' && github.sha || 'main' }}
  cancel-in-progress: false
  queue: max

jobs:
  update-validated-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-v12.txt
      - name: Install direct-forecast dependencies
        run: pip install --disable-pip-version-check -q numpy pandas scipy scikit-learn openpyxl tradingview-screener
      - name: Verify strict current-session freshness and exchange calendar
        run: |
          python scripts/forecast_freshness_test.py
          node scripts/forecast_freshness_test.cjs
          python scripts/forecast_release_regression_test.py
          python scripts/run_forecast_v9_deployable_test.py
          python scripts/forecast_v28_postclose_bridge_test.py
          python scripts/vn_exchange_calendar_test.py
      - name: Refresh genuine completed-session foreign and proprietary transactions
        env:
          V20_FLOW_WORKERS: "12"
        run: |
          timeout 240s python scripts/refresh_institutional_flow_v20_v28.py || echo "Institutional provider unavailable; audited history remains intact and freshness stays explicit."
      - name: Refresh point-in-time news for the full current HOSE universe
        run: python scripts/refresh_hose_news_v14.py || echo "Publisher coverage gate failed; prior audited news archive remains intact."
      - name: Collect verified public FireAnt and 24HMoney market intelligence
        env:
          V18_FIREANT_TIMEOUT: "4"
          V19_SOCIAL_TIMEOUT: "8"
        run: python scripts/forecast_v18_market_intelligence.py --collect-community || echo "Public publisher feeds were unavailable; private community content will not be fabricated."
      - name: Remove cross-issuer contamination from every current intelligence artifact
        run: python scripts/sanitize_intelligence_v20.py
      - name: Archive disclosed fund holdings and NAV context
        id: optional_funds
        continue-on-error: true
        env:
          FMARKET_BEARER_TOKEN: ${{ secrets.FMARKET_BEARER_TOKEN }}
        run: timeout 120s python scripts/forecast_v16_external_data.py --collect-funds
      - name: Report unavailable optional fund context
        if: steps.optional_funds.outcome == 'failure'
        run: echo "::warning::Fund context unavailable; retaining dated history. Core EOD price and forecast validation remain mandatory."
      - name: Bind forecast cross-source audit to latest completed session
        run: python scripts/prepare_forecast_scan_v28.py
      - name: Refresh every HOSE EOD and publish only independently validated forecasts
        env:
          V14_EOD_WORKERS: "8"
          V28_POSTCLOSE_MIN_COVERAGE: "0.90"
          V28_POSTCLOSE_MIN_SECONDARY_COVERAGE: "0.90"
          V28_POSTCLOSE_MAX_LOG_GAP: "0.003"
        run: python scripts/run_forecast_v28_guarded.py --refresh-symbols ALL --publish
      - name: Publish bounded live community overlay against the audited snapshot
        run: python scripts/forecast_v18_market_intelligence.py --publish-live
      - name: Reject issuer mixups, future leakage, holiday errors and failed backtests
        run: |
          python scripts/forecast_v28_postclose_bridge_test.py
          python scripts/vn_exchange_calendar_test.py
          python scripts/forecast_v13_market_model_test_v28.py
          python scripts/forecast_v14_frontend_contract_test.py
          python scripts/forecast_v16_external_data_test.py
          python scripts/forecast_v17_live_intelligence_test.py
          python scripts/forecast_v18_market_intelligence_test.py
          python -m unittest financial-report/tests/test_universe.py -v
          python scripts/refresh_institutional_flow_v20_test.py
          python scripts/sanitize_intelligence_v20_test.py
          node --test scripts/solution_ai_v17_test.mjs scripts/solution_ai_frontend_v17_test.mjs scripts/forecast_v18_frontend_runtime_test.mjs
          python scripts/forecast_v20_release_audit_test.py
          python scripts/forecast_v20_release_audit_v28_test.py
          python scripts/forecast_v20_release_audit_v28.py
      - name: Reject stale completed-session publication
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json,sys
          from datetime import datetime
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from vn_exchange_calendar import VN_TZ,latest_completed_session
          now=datetime.now(VN_TZ); expected=latest_completed_session(now).isoformat()
          d=json.loads(Path('data/forecast-dashboard-v12.json').read_text(encoding='utf-8'))
          if str(d.get('asOf'))!=expected: raise SystemExit(f"STALE FORECAST: dashboard asOf={d.get('asOf')} expected completed session={expected}")
          market=json.loads(Path('data/forecast-market-v13.json').read_text(encoding='utf-8'))
          sources=market.get('sources') or {}
          bridge=sources.get('postCloseBridge') or {}
          price_audit=sources.get('priceCrossSource') or {}
          status=bridge.get('status')
          if str(bridge.get('sessionDate') or '') != expected:
              raise SystemExit(f"BRIDGE SESSION MISMATCH: {bridge.get('sessionDate')} expected={expected}")
          if str(sources.get('priceSessionAsOf') or '') != expected or str(sources.get('marketScanAsOf') or '') != expected:
              raise SystemExit(f"SOURCE SESSION MISMATCH: price={sources.get('priceSessionAsOf')} market={sources.get('marketScanAsOf')} expected={expected}")
          if price_audit.get('status') != 'PASS' or float(price_audit.get('coverage') or 0) < float(price_audit.get('requiredCoverage') or 1) or int(price_audit.get('mismatchCount') or 0) != 0:
              raise SystemExit(f"PRICE CROSS-SOURCE PROOF FAILED: {price_audit}")
          if status not in {'PASS','NOT_APPLICABLE_ALREADY_CURRENT'}:
              raise SystemExit(f"COMPLETED SESSION BRIDGE INVALID: {bridge}")
          if status == 'PASS':
              if bridge.get('completedSessionVerified') is not True or bridge.get('independentCloseConfirmed') is not True:
                  raise SystemExit(f"COMPLETED SESSION BRIDGE PROOF INCOMPLETE: {bridge}")
              if float(bridge.get('coverage') or 0) < float(bridge.get('minimumCoverage') or 1) or float(bridge.get('secondaryCoverage') or 0) < float(bridge.get('minimumSecondaryCoverage') or 1) or int(bridge.get('mismatchCount') or 0) != 0:
                  raise SystemExit(f"COMPLETED SESSION BRIDGE COVERAGE/DISAGREEMENT FAILED: {bridge}")
          PY
      - name: Audit every symbol and every target session
        run: python scripts/forecast_freshness_audit.py --output data/forecast-freshness-audit.json
      - name: Build tiered HOSE universe
        run: python financial-report/scripts/build_hose_universe.py
      - name: Persist the validated market snapshot
        if: github.event_name != 'pull_request'
        env:
          MAX_PUBLISH_ATTEMPTS: "4"
        run: |
          set -euo pipefail
          files=(
            data/forecast-freshness-audit.json
            data/v16-eod-refresh-cache.json.gz
            data/flow-v12.json
            data/flow-audit-v12.json
            data/release-audit-v20.json
            data/intelligence-sanitization-v20.json
            data/research-news.json
            data/research-news-v10.json
            data/fireant-intelligence-v18.json
            data/community-intelligence-live-v19.json
            financial-report/data/universe.json
            data/fund-holdings-history-v16.json
            data/forecast-dashboard-v12.json
            data/forecast-current-v12.json
            data/forecast-market-v13.json
          )
          candidate_root="/tmp/vmews-forecast-publish"
          rm -rf "$candidate_root"
          mkdir -p "$candidate_root"
          for path in "${files[@]}"; do
            mkdir -p "$candidate_root/$(dirname "$path")"
            cp "$path" "$candidate_root/$path"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in $(seq 1 "$MAX_PUBLISH_ATTEMPTS"); do
            echo "Atomic forecast publish attempt ${attempt}/${MAX_PUBLISH_ATTEMPTS}"
            git fetch --no-tags origin main
            git reset --hard origin/main

            set +e
            PUBLISHED_DASHBOARD="data/forecast-dashboard-v12.json" CANDIDATE_DASHBOARD="$candidate_root/data/forecast-dashboard-v12.json" python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime

          def parse_dt(value):
              try:
                  return datetime.fromisoformat(str(value).replace("Z", "+00:00"))
              except Exception:
                  return None

          candidate=json.load(open(os.environ["CANDIDATE_DASHBOARD"],encoding="utf-8"))
          try:
              published=json.load(open(os.environ["PUBLISHED_DASHBOARD"],encoding="utf-8"))
          except Exception:
              raise SystemExit(0)

          candidate_asof=str(candidate.get("asOf") or "")
          published_asof=str(published.get("asOf") or "")
          candidate_time=parse_dt(candidate.get("generatedAt"))
          published_time=parse_dt(published.get("generatedAt"))

          if published_asof > candidate_asof:
              print("Remote forecast is from a newer completed session; keep remote.")
              raise SystemExit(10)
          if published_asof == candidate_asof and candidate_time and published_time and published_time >= candidate_time:
              print("Remote forecast is same-session and same/newer generation; keep remote.")
              raise SystemExit(10)
          PY
            guard_rc=$?
            set -e
            if [ "$guard_rc" -eq 10 ]; then
              exit 0
            fi
            if [ "$guard_rc" -ne 0 ]; then
              echo "Forecast publish freshness guard failed."
              exit "$guard_rc"
            fi

            for path in "${files[@]}"; do
              cp "$candidate_root/$path" "$path"
            done
            git add "${files[@]}"
            if git diff --cached --quiet; then
              echo "No market-session change detected."
              exit 0
            fi
            git commit -m "Refresh validated HOSE forecast, dated VN30 leaders and verified market intelligence [data-only]"

            set +e
            push_output=$(git push origin HEAD:main 2>&1)
            push_rc=$?
            set -e
            printf '%s\n' "$push_output"
            if [ "$push_rc" -eq 0 ]; then
              echo "Validated forecast snapshot published by fast-forward."
              exit 0
            fi
            if printf '%s\n' "$push_output" | grep -Eqi 'non-fast-forward|fetch first|rejected'; then
              echo "main advanced during forecast publish; retrying from the new remote head without rebasing generated JSON."
              continue
            fi
            exit "$push_rc"
          done

          echo "main advanced through all bounded forecast publish attempts."
          exit 75
