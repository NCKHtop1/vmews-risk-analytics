name: Deploy VMEWS Pages

on:
  push:
    branches: [main]
    paths:
      - 'financial-report/**'
      - 'data/fund-holdings-history-v16.json'
      - 'data/forecast-dashboard-v12.json'
      - 'data/forecast-current-v12.json'
      - 'data/forecast-market-v13.json'
      - 'data/forecast-session-v21.json'
      - 'data/release-audit-v20.json'
      - 'forecast-*.html'
      - 'forecast-*.js'
      - 'forecast-*.css'
      - 'solution-ai-v17.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh FinQuery prices and company news', 'Refresh live HOSE Core + Liquid prices', 'Refresh live HOSE minute candles', 'Refresh market news stream', 'Refresh FinQuery macro snapshot', 'Refresh FinQuery market universe', 'Refresh financial reports for CDN', 'Refresh investment insights', 'Forecast V20.1 immutable-price audit and market intelligence', 'Forecast V21 guarded session overlay']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Successful deployments are verified by the FinQuery system contract against
  # deployment.json plus the public quote/strategy/risk generation.
  # Failed workflow_run events use a separate group, so a skipped failure-triggered
  # Pages run can never cancel a valid deployment started by a successful refresh.
  group: pages-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || 'success' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      code_sha: ${{ steps.revisions.outputs.code_sha }}
      financial_sha: ${{ steps.revisions.outputs.financial_sha }}
      insight_sha: ${{ steps.revisions.outputs.insight_sha }}
      market_sha: ${{ steps.revisions.outputs.market_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify report-to-forecast navigation and quote loading
        run: node scripts/forecast-navigation-test.cjs
      - name: Verify Strategy Intelligence core and frontend syntax
        run: |
          node --check financial-report/frontend/strategy-intelligence-core.js
          node --check financial-report/frontend/strategy-intelligence.js
          node --check financial-report/frontend/strategy-engine.js
          node --check financial-report/frontend/alert-center.js
          node --check financial-report/frontend/market.js
          node --check financial-report/frontend/risk-monitor.js
          node --check financial-report/frontend/research-agent.js
          node --check financial-report/frontend/research-ai.js
          node financial-report/scripts/test_strategy_intelligence.cjs
          node financial-report/scripts/test_research_agent_market_only.cjs
      - uses: actions/checkout@v4
        with:
          ref: financial-report-data
          path: _financial-data
          sparse-checkout: data
      - uses: actions/checkout@v4
        with:
          ref: financial-insights-data
          path: _insight-data
          sparse-checkout: data
      - uses: actions/checkout@v4
        with:
          ref: financial-market-data
          path: _market-data
          sparse-checkout: market
      - name: Capture exact build revisions
        id: revisions
        shell: bash
        run: |
          echo "code_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "financial_sha=$(git -C _financial-data rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "insight_sha=$(git -C _insight-data rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "market_sha=$(git -C _market-data rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Rebuild Technical Scanner from the published market snapshot
        run: python financial-report/scripts/refresh_market.py --output _market-data/market --mode scanner
      - name: Bootstrap Technical Scanner evidence from completed EOD history
        run: python financial-report/scripts/build_technical_evidence.py --output _market-data/market
      - name: Generate strategy indicator snapshot
        run: node financial-report/scripts/build_strategy_snapshot.cjs _market-data/market
      - name: Calibrate sector risk thresholds
        run: node financial-report/scripts/build_sector_risk_calibration.cjs _market-data/market
      - name: Calibrate and backtest market risk
        run: node financial-report/scripts/build_market_risk_calibration.cjs _market-data/market
      - name: Generate market risk snapshot
        run: node financial-report/scripts/build_risk_monitor.cjs _market-data/market
      - name: Validate main and market HOSE universe consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          main=json.loads(Path('financial-report/data/universe.json').read_text())
          market=json.loads(Path('_market-data/market/universe.json').read_text())
          quotes=json.loads(Path('_market-data/market/quotes.json').read_text())
          scanner=json.loads(Path('_market-data/market/technical-signals.json').read_text())
          strategy=json.loads(Path('_market-data/market/strategy-indicators.json').read_text())
          risk=json.loads(Path('_market-data/market/risk-monitor.json').read_text())
          market_cal=json.loads(Path('_market-data/market/market-risk-calibration.json').read_text())
          intraday=json.loads(Path('_market-data/market/intraday-status.json').read_text())
          macro=json.loads(Path('_market-data/market/macro.json').read_text())
          news_latest=json.loads(Path('_market-data/market/news-latest.json').read_text())
          company_news=json.loads(Path('_market-data/market/news-company-latest.json').read_text())
          news_stories=json.loads(Path('_market-data/market/news-stories.json').read_text())
          semantic_health=json.loads(Path('_market-data/market/news-semantic-health.json').read_text())
          mc=main.get('counts') or {}
          bc=market.get('counts') or {}
          assert main.get('version')==market.get('version'),(main.get('version'),market.get('version'))
          assert int(mc.get('core') or 0)==int(bc.get('core') or 0),(mc.get('core'),bc.get('core'))
          # Market universe is independent of forecast freshness. It may be one
          # completed trading session behind live quotes, but never older.
          from datetime import datetime,timedelta,timezone
          qraw=quotes.get('latestSourceTime') or quotes.get('checkedAt')
          qday=datetime.fromisoformat(str(qraw).replace('Z','+00:00')).astimezone(timezone(timedelta(hours=7))).date()
          minimum=qday-timedelta(days=1)
          while minimum.weekday()>=5:
              minimum-=timedelta(days=1)
          uday=datetime.fromisoformat(str(market.get('asOf'))[:10]).date()
          assert uday>=minimum,('stale market universe',market.get('asOf'),'minimum',minimum.isoformat())
          macro_day=datetime.fromisoformat(str(macro.get('checkedAt') or macro.get('generatedAt')).replace('Z','+00:00')).astimezone(timezone(timedelta(hours=7))).date()
          assert macro.get('status')=='ok' and macro_day>=qday,('stale macro',macro.get('checkedAt'),qday.isoformat())
          news_health=news_latest.get('sourceHealth') or {}
          assert news_latest.get('status')=='ok' and news_latest.get('selection')=='balanced_vietnam_global_sbv_impact' and 0<len(news_latest.get('items') or [])<=300,('invalid balanced news',news_latest.get('status'),news_latest.get('selection'),len(news_latest.get('items') or []))
          assert int(news_health.get('healthy') or 0)>=3,('news source health too low',news_health)
          luat=news_latest.get('luatVietnamDirect') or {}
          assert int(luat.get('expectedParsers') or 0)==4 and int(luat.get('parserHealthy') or 0)>=3 and luat.get('status')=='ok',('luatvietnam direct degraded',luat)
          invalid_luat_time=[x for x in (news_latest.get('items') or []) if x.get('source')=='Luật Việt Nam' and x.get('detailTimestampVerified') and x.get('timePrecision')!='minute']
          assert not invalid_luat_time,('invalid verified LuatVietnam timestamps',invalid_luat_time[:3])
          company_counts=company_news.get('companyCounts') or {}
          assert company_news.get('status')=='ok' and company_news.get('selection')=='per_symbol_latest' and int(company_news.get('perSymbolLimit') or 0)==15,('invalid company news',company_news.get('status'),company_news.get('selection'),company_news.get('perSymbolLimit'))
          assert int(company_news.get('companyCoverage') or 0)==len(company_counts) and len(company_counts)>0 and bool(company_news.get('items')),('company news coverage invalid',company_news.get('companyCoverage'),len(company_counts),len(company_news.get('items') or []))
          assert str(company_news.get('checkedAt') or '')==str(news_latest.get('checkedAt') or ''),('company news heartbeat mismatch',company_news.get('checkedAt'),news_latest.get('checkedAt'))
          assert news_latest.get('newsIntelligenceVersion')=='v2',('news intelligence version missing',news_latest.get('newsIntelligenceVersion'))
          assert news_stories.get('status')=='ok' and int(news_stories.get('storyCount') or 0)>0,('invalid news stories',news_stories.get('status'),news_stories.get('storyCount'))
          assert int(semantic_health.get('criticalViolations') or 0)==0,('semantic news violations',semantic_health.get('violations'))
          assert int(semantic_health.get('sourceLineageItems') or 0)>0,('missing news source lineage',semantic_health)
          intraday_expected=max(1,int(intraday.get('expected') or 0))
          intraday_required=max(1,int(intraday.get('required') or __import__('math').ceil(intraday_expected*.90)))
          intraday_success=int(intraday.get('success') or 0)
          session_expected=int(intraday.get('sessionExpected') or 0)
          session_required=int(intraday.get('sessionRequired') or (__import__('math').ceil(session_expected*.90) if session_expected else 0))
          session_fresh=int(intraday.get('sessionFresh') if intraday.get('sessionFresh') is not None else intraday_success)
          assert intraday.get('status')=='ok' and intraday_success>=intraday_required,('intraday fetch coverage',intraday_success,intraday_expected,intraday_required)
          assert not session_expected or session_fresh>=session_required,('intraday live-bar coverage',session_fresh,session_expected,session_required)
          now=datetime.now(timezone.utc); local=now.astimezone(timezone(timedelta(hours=7))); mins=local.hour*60+local.minute
          active=local.weekday()<5 and (540<=mins<=690 or 780<=mins<=885)
          if active:
              assert intraday.get('sessionExpected') is not None and intraday.get('sessionFresh') is not None,('intraday session freshness missing',intraday)
              intraday_checked=datetime.fromisoformat(str(intraday.get('checkedAt')).replace('Z','+00:00')).astimezone(timezone.utc)
              intraday_age=(now-intraday_checked).total_seconds()/60
              if intraday_age>25:
                  print({'warning':'intraday mirror heartbeat is stale; raw financial-market-data remains the production primary','ageMin':round(intraday_age,1),'checkedAt':intraday.get('checkedAt')})
          assert int(quotes.get('expected') or 0)==int(bc.get('liveMarket') or 0),(quotes.get('expected'),bc.get('liveMarket'))
          assert int(quotes.get('coverage') or 0)>=int(quotes.get('expected') or 0)*.90,(quotes.get('coverage'),quotes.get('expected'))
          assert int(scanner.get('universe') or 0)==int(bc.get('scannerEligible') or 0),(scanner.get('universe'),bc.get('scannerEligible'))
          assert int(scanner.get('coverage') or 0)>=int(scanner.get('universe') or 0)*.90,(scanner.get('coverage'),scanner.get('universe'))
          assert int(scanner.get('refreshEveryMinutes') or 0)==5,scanner.get('refreshEveryMinutes')
          scanner_live=[x for x in (scanner.get('symbols') or {}).values() if x.get('cadence')=='LIVE_15M']
          scanner_comparators=[x for x in scanner_live if isinstance(x.get('macdHistogram'),(int,float)) and isinstance(x.get('previousMacdHistogram'),(int,float)) and abs(float(x.get('macdHistogram'))-float(x.get('previousMacdHistogram')))>1e-9]
          assert len(scanner_live)<50 or len(scanner_comparators)>=5,(len(scanner_live),len(scanner_comparators))
          assert int(strategy.get('coverage') or 0)>=int(scanner.get('universe') or 0)*.90,(strategy.get('coverage'),scanner.get('universe'))
          strategy_live=[x for x in (strategy.get('symbols') or {}).values() if x.get('cadence')=='LIVE_15M']
          strategy_comparators=[x for x in strategy_live if isinstance((x.get('current') or {}).get('macdHistogram'),(int,float)) and isinstance((x.get('previous') or {}).get('macdHistogram'),(int,float)) and abs(float((x.get('current') or {}).get('macdHistogram'))-float((x.get('previous') or {}).get('macdHistogram')))>1e-9]
          assert len(strategy_live)<50 or len(strategy_comparators)>=5,(len(strategy_live),len(strategy_comparators))
          assert risk.get('status')=='ok',risk
          assert str(risk.get('sourceTime') or '')==str(quotes.get('latestSourceTime') or ''),(risk.get('sourceTime'),quotes.get('latestSourceTime'))
          assert risk.get('inputSignature'),('risk input signature missing',risk.get('version'))
          risk_day=qday.isoformat()
          eligible_risk=sum(
              1 for symbol,q in (quotes.get('quotes') or {}).items()
              if q.get('status')!='retained'
              and (strategy.get('symbols') or {}).get(symbol,{}).get('cadence')=='LIVE_15M'
              and str((strategy.get('symbols') or {}).get(symbol,{}).get('barDate') or '')==risk_day
              and isinstance(q.get('price'),(int,float)) and float(q.get('price') or 0)>0
              and isinstance(q.get('changePct'),(int,float))
          )
          assert int((risk.get('coverage') or {}).get('quotes') or 0)==eligible_risk,(risk.get('coverage'),eligible_risk)
          assert int((risk.get('coverage') or {}).get('quotes') or 0)>=int(quotes.get('expected') or 0)*.90,risk.get('coverage')
          assert 0<=float((risk.get('overall') or {}).get('score'))<=100,risk.get('overall')
          assert len(risk.get('timeline') or [])>=2,risk.get('timeline')
          assert (risk.get('trend') or {}).get('previousScore') is not None,risk.get('trend')
          assert len(risk.get('contributions') or [])==5,risk.get('contributions')
          sector_cal=risk.get('sectorCalibration') or {}
          assert sector_cal.get('status')=='ok' and int(sector_cal.get('totalSectors') or 0)>=8,sector_cal
          assert all('threshold' in x and 'alertEligible' in x and isinstance(x.get('memberRows'),list) for x in (risk.get('sectors') or [])),risk.get('sectors')
          assert str(risk.get('methodVersion') or '')=='FINQUERY-RISK-RULES-2.0',risk.get('methodVersion')
          assert market_cal.get('status')=='ok' and market_cal.get('forSession')==str(risk.get('sourceDate') or ''),(market_cal.get('status'),market_cal.get('forSession'),risk.get('sourceDate'))
          high=next((x for x in ((market_cal.get('backtest') or {}).get('thresholds') or []) if int(x.get('threshold') or 0)==85),None)
          assert high and bool((market_cal.get('backtest') or {}).get('stateValidated')) and int(high.get('signals') or 0)>=12 and 0.05<=float(high.get('signalRate') or 0)<=0.25 and float(high.get('currentStateGapPct') or 0)<=-0.40,high
          groups=risk.get('breadthGroups') or {}
          assert sum(len(groups.get(k) or []) for k in ('advancing','declining','unchanged'))==int((risk.get('coverage') or {}).get('quotes') or 0),groups
          assert all('advancePct' in x and 'declinePct' in x and isinstance(x.get('memberRows'),list) for x in (risk.get('sectors') or [])),risk.get('sectors')
          funds=risk.get('fundMonitor') or {}
          assert funds.get('status')=='ok' and int(funds.get('symbols') or 0)>0,funds
          assert funds.get('source')=='FMARKET',funds
          assert not funds.get('previousAsOf') or funds.get('comparisonMode')=='LAST_MEANINGFUL_HOLDING_CHANGE',funds
          print({'asOf':market.get('asOf'),'counts':bc,'quotes':quotes.get('coverage'),'scanner':scanner.get('coverage'),'strategy':strategy.get('coverage'),'risk':(risk.get('overall') or {}).get('score')})
          PY
      - name: Build site with same-origin financial and market data
        shell: bash
        run: |
          mkdir -p /tmp/main-insight-seed
          cp financial-report/data/broker-research.json /tmp/main-insight-seed/broker-research.json
          cp financial-report/data/corporate-events.json /tmp/main-insight-seed/corporate-events.json
          cp -f financial-report/data/business-plans.json /tmp/main-insight-seed/business-plans.json 2>/dev/null || true
          rsync -a _financial-data/data/ financial-report/data/
          for f in broker-research.json corporate-events.json insights-status.json event-status.json business-plans.json business-plan-status.json; do
            if [ -f "_insight-data/data/$f" ]; then cp "_insight-data/data/$f" "financial-report/data/$f"; fi
          done
          python financial-report/scripts/merge_insight_data.py --seed-dir /tmp/main-insight-seed --target-dir financial-report/data
          python financial-report/scripts/build_cdn.py
          grep -q 'FINQUERY-STRATEGY-INTELLIGENCE-1.0' financial-report/index.html
          grep -q '>AI Strategy Agent<' financial-report/index.html
          grep -q 'sai-top-strategies' financial-report/index.html
          ! grep -q 'src="strategy-intelligence-core.js"' financial-report/index.html
          ! grep -q 'src="strategy-intelligence.js"' financial-report/index.html
          mkdir -p _site
          rsync -a --exclude='_site' --exclude='_financial-data' --exclude='_insight-data' --exclude='_market-data' --exclude='.git' --exclude='.github' --exclude='api' --exclude='model' --exclude='docs' --exclude='*.md' ./ _site/
          mkdir -p _site/financial-report/market
          rsync -a _market-data/market/ _site/financial-report/market/
          python - <<'PY'
          from pathlib import Path
          import json, subprocess
          p=Path('_site/qtrr-final.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const API='/api/stocks2', VALIDATE_API='/api/validate';", "const API='https://vmews-risk-analytics-sojd.vercel.app/api/radar', VALIDATE_API='https://vmews-risk-analytics-sojd.vercel.app/api/validate2';")
          s=s.replace('Requesting current risk states from Vnstock…','Loading verified production risk data…')
          p.write_text(s,encoding='utf-8')
          p=Path('_site/financial-report/index.html')
          p.write_text(p.read_text().replace('<html lang="vi">','<html lang="vi" data-hosting="pages">'))
          revision=lambda directory: subprocess.check_output(['git','-C',directory,'rev-parse','HEAD'],text=True).strip()
          Path('_site/financial-report/deployment.json').write_text(json.dumps({'code':revision('.'),'financialData':revision('_financial-data'),'insightData':revision('_insight-data'),'marketData':revision('_market-data')}))
          Path('_site/.nojekyll').touch()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Dedicated automatic FinQuery Pages environment. The workflow itself is
    # restricted to main / successful main data refreshes, so releases do not
    # depend on a manual reviewer while the original github-pages protection stays intact.
    environment:
      name: github-pages-finquery-prod
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_CODE_SHA: ${{ needs.build.outputs.code_sha }}
      EXPECTED_FINANCIAL_SHA: ${{ needs.build.outputs.financial_sha }}
      EXPECTED_INSIGHT_SHA: ${{ needs.build.outputs.insight_sha }}
      EXPECTED_MARKET_SHA: ${{ needs.build.outputs.market_sha }}
    steps:
      - name: Verify deployed financial dashboard and critical datasets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nckhtop1.github.io/vmews-risk-analytics/financial-report'
          ready=0
          for attempt in 1 2 3 4 5 6 7 8; do
            token="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            if curl -fsSL --max-time 20 "$BASE/?symbol=FPT&mode=year&verify=$token#market" -o /tmp/page.html \
              && curl -fsSL --max-time 20 "$BASE/deployment.json?verify=$token" -o /tmp/deployment.json; then
              deployed_code="$(python -c "import json; print(json.load(open('/tmp/deployment.json')).get('code',''))" 2>/dev/null || true)"
              echo "pages-verify attempt=$attempt deployed=$deployed_code expected=$EXPECTED_CODE_SHA"
              if [ "$deployed_code" = "$EXPECTED_CODE_SHA" ]; then
                ready=1
                break
              fi
            fi
            sleep $((attempt * 3))
          done
          test "$ready" = 1
          grep -q 'DOLPHIN_V6' /tmp/page.html
          grep -q 'technical-scanner-access-code' /tmp/page.html
          grep -q 'investment-ideas' /tmp/page.html
          grep -q 'Giám sát rủi ro' /tmp/page.html
          grep -q 'Giám sát thị trường' /tmp/page.html
          grep -q 'data-platform-view="strategy"' /tmp/page.html
          grep -q '>AI Strategy Agent<' /tmp/page.html
          grep -q 'FINQUERY-STRATEGY-INTELLIGENCE-1.0' /tmp/page.html
          grep -q 'sai-top-strategies' /tmp/page.html
          grep -q 'Strategy Builder & Screener' /tmp/page.html
          grep -q 'openChart:openMarketChart' /tmp/page.html
          grep -q 'ensureGlobalAILayer' /tmp/page.html
          grep -q 'sai-action-status' /tmp/page.html
          ! grep -q 'src="strategy-intelligence-core.js"' /tmp/page.html
          ! grep -q 'src="strategy-intelligence.js"' /tmp/page.html
          grep -q 'news-company-latest.json' /tmp/page.html
          grep -q 'function newsTimeLabel(r)' /tmp/page.html
          python - <<'PY'
          from pathlib import Path
          page=Path('/tmp/page.html').read_text(encoding='utf-8')
          required=[r'\bomo\b',r'fpt\s+(?:retail|securities)\b','function strictCompanyNews(']
          missing=[x for x in required if x not in page]
          assert not missing,('deployed News bundle missing contract markers',missing)
          PY
          grep -q '>Investment Ideas<' /tmp/page.html
          grep -q '>Phân tích<' /tmp/page.html
          grep -q '>Vĩ mô<' /tmp/page.html
          grep -q '>Tổng quan<' /tmp/page.html
          grep -q '>Bảng số liệu<' /tmp/page.html
          ! grep -q 'personalization.css' /tmp/page.html
          ! grep -q 'personalization.js' /tmp/page.html
          ! grep -q 'google-auth-config.js' /tmp/page.html
          ! grep -q 'Danh sách theo dõi được lưu trên trình duyệt này.' /tmp/page.html
          ! grep -q 'Dữ liệu lịch sử: Vietcap, đồng bộ theo lịch 15 phút' /tmp/page.html
          ! grep -q 'Charts by TradingView Lightweight Charts' /tmp/page.html
          curl -fsSL --max-time 20 "$BASE/market/quotes.json?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o /tmp/quotes.json
          curl -fsSL --max-time 20 "$BASE/market/news-latest.json?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o /tmp/news.json
          curl -fsSL --max-time 20 "$BASE/market/news-company-latest.json?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o /tmp/company-news.json
          curl -fsSL --max-time 20 "$BASE/market/technical-signals.json?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o /tmp/scanner.json
          curl -fsSL --max-time 20 "$BASE/market/strategy-indicators.json?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o /tmp/strategy.json
          curl -fsSL --max-time 20 "$BASE/market/risk-monitor.json?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o /tmp/risk.json
          curl -fsSL --max-time 20 "$BASE/market/market-risk-calibration.json?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o /tmp/market-risk-calibration.json
          curl -fsSL --max-time 20 "$BASE/market/watch-today.json?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o /tmp/watch.json
          curl -fsSL --max-time 20 "$BASE/market/universe.json?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o /tmp/universe.json
