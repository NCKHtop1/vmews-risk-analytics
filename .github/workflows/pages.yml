name: Deploy VMEWS Pages (optional manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-manual
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static frontend wired to verified production APIs
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude='_site' --exclude='.git' --exclude='.github' --exclude='api' --exclude='model' --exclude='docs' --exclude='*.md' ./ _site/
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/qtrr-final.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const API='/api/stocks2', VALIDATE_API='/api/validate';", "const API='https://vmews-risk-analytics-sojd.vercel.app/api/radar', VALIDATE_API='https://vmews-risk-analytics-sojd.vercel.app/api/validate2';")
          s=s.replace('Requesting current risk states from Vnstock…','Loading verified production risk data…')
          p.write_text(s,encoding='utf-8')
          touch=Path('_site/.nojekyll'); touch.touch()
          PY
      - name: Detect optional GitHub Pages availability
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Explain unavailable optional Pages target
        if: steps.pages.outcome != 'success'
        run: |
          echo "GitHub Pages is not enabled/accessible for this repository token."
          echo "This is not a forecast publication failure: the audited production target is the exact-SHA CDN."
      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: needs.build.outputs.pages_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
