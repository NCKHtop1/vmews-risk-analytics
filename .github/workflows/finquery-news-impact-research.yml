name: FinQuery news impact evidence research (offline)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'financial-report/scripts/research_news_impact.py'
      - 'financial-report/tests/test_news_impact_research.py'
      - '.github/workflows/finquery-news-impact-research.yml'
      - 'docs/finquery-news-impact-research.md'

permissions:
  contents: read

concurrency:
  group: news-impact-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrospective-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout FinQuery research code and historical news archives
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout read-only market history and sector snapshot
        uses: actions/checkout@v4
        with:
          ref: financial-market-data
          path: _research_market
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            market/history
            market/risk-monitor.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure no live-alert policy regressions
        run: python financial-report/tests/test_news_impact_research.py
      - name: Audit historical impact patterns without live publication
        run: |
          python financial-report/scripts/research_news_impact.py \
            --news data/research-news-v10.json \
            --history _research_market/market/history \
            --sector _research_market/market/risk-monitor.json \
            --event-study data/news-event-study-v11.json \
            --event-intelligence data/event-intelligence-v12.json \
            --out _research_out/news-impact-retrospective.json
      - name: Assert research evidence cannot become an alert automatically
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('_research_out/news-impact-retrospective.json').read_text())
          assert data['status']=='RESEARCH_ONLY_NO_ALERTS'
          assert data['releaseGate']['liveSectorAlerts'] is False
          assert data['releaseGate']['liveTickerAlerts'] is False
          assert data['input']['histories']>=30
          assert data['quality']['all_news_rows']>=100
          print('FINQUERY NEWS IMPACT: OFFLINE / PROSPECTIVE GATE ENFORCED')
          PY
      - name: Archive preliminary diagnostics (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: news-impact-research-only
          path: _research_out/news-impact-retrospective.json
          retention-days: 14
