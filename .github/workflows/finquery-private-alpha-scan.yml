name: FinQuery Private Alpha scanner
on:
  pull_request:
    paths:
      - 'financial-report/scripts/scan_private_alpha.py'
      - 'financial-report/scripts/test_scan_private_alpha.py'
      - 'financial-report/frontend/alpha-radar.js'
      - 'financial-report/tests/alpha_radar.test.cjs'
      - '.github/workflows/finquery-private-alpha-scan.yml'
  push:
    branches: [main]
    paths:
      - 'financial-report/scripts/scan_private_alpha.py'
      - 'financial-report/scripts/test_scan_private_alpha.py'
      - 'financial-report/frontend/alpha-radar.js'
      - '.github/workflows/finquery-private-alpha-scan.yml'
  schedule:
    - cron: '*/5 2-8 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: finquery-private-alpha-market-data
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Formula privacy, freshness and signal-event tests (without credentials)
        run: |
          python -m unittest discover -s financial-report/scripts -p test_scan_private_alpha.py -v
          python -m py_compile financial-report/scripts/scan_private_alpha.py
          node --check financial-report/frontend/alpha-radar.js
          node --test financial-report/tests/alpha_radar.test.cjs
  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FINQUERY_ALPHA_RULES_JSON: ${{ secrets.FINQUERY_ALPHA_RULES_JSON }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Execute server-side scanner without exposing protected formulas
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FINQUERY_ALPHA_RULES_JSON" ]; then
            echo "::notice::Private Alpha rules are not configured; no signals published."
            exit 0
          fi
          git fetch origin financial-market-data
          git worktree add /tmp/finquery-alpha-data origin/financial-market-data
          git -C /tmp/finquery-alpha-data sparse-checkout set market
          ROOT=/tmp/finquery-alpha-data
          INPUT="$ROOT/market/strategy-indicators.json"
          OUTPUT="$ROOT/market/alpha-radar.json"
          test -f "$INPUT"
          python financial-report/scripts/scan_private_alpha.py --snapshot "$INPUT" --output "$OUTPUT"
          if [ ! -f "$OUTPUT" ]; then
            echo "::notice::No verified Alpha events from current market snapshot."
            exit 0
          fi
          git -C "$ROOT" add --sparse market/alpha-radar.json
          if git -C "$ROOT" diff --cached --quiet; then
            echo "Alpha feed is unchanged."
            exit 0
          fi
          git -C "$ROOT" config user.name 'github-actions[bot]'
          git -C "$ROOT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$ROOT" commit -m 'Update masked Alpha market events [data-only]'
          for n in 1 2 3; do
            git -C "$ROOT" fetch origin financial-market-data
            if git -C "$ROOT" rebase origin/financial-market-data && git -C "$ROOT" push origin HEAD:refs/heads/financial-market-data; then
              exit 0
            fi
            git -C "$ROOT" rebase --abort || true
            sleep 3
          done
          exit 1
