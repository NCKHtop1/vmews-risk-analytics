name: SoluTION.AI production browser smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy VMEWS Pages']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'solution-ai-v17.js'
      - 'forecast-final.html'
      - 'scripts/solution_ai_browser_smoke.mjs'
      - 'scripts/solution_ai_v17_test.mjs'
      - 'scripts/solution_ai_frontend_v17_test.mjs'
      - 'scripts/solution_ai_full_system_audit.mjs'
      - '.github/workflows/solution-ai-production-smoke.yml'

permissions:
  contents: read

concurrency:
  group: solution-ai-production-browser-smoke
  cancel-in-progress: true

jobs:
  browser:
    # Run even when an unrelated post-deploy verifier fails. This smoke verifies
    # whether SoluTION.AI production itself is actually available and correct.
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          timeout 8m npx playwright install chromium >/dev/null
      - name: Run SoluTION.AI unit and frontend contracts
        run: node --test scripts/solution_ai_v17_test.mjs scripts/solution_ai_frontend_v17_test.mjs
      - name: Wait for production Pages
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 20 'https://nckhtop1.github.io/vmews-risk-analytics/forecast-final.html?symbol=FPT' -o /tmp/solution-page.html; then
              if grep -Fq 'SoluTION.AI · LOCAL FIRST · GEMINI TÙY CHỌN' /tmp/solution-page.html \
                && grep -Fq 'id="primaryForecastLabel"' /tmp/solution-page.html \
                && grep -Fq 'forecast-final-v12.js?release=45.0' /tmp/solution-page.html \
                && grep -Fq 'solution-ai-v17.js?release=39.0' /tmp/solution-page.html; then
                exit 0
              fi
            fi
            sleep $((attempt * 5))
          done
          echo 'Production Pages has not reached the local-first SoluTION.AI release.' >&2
          exit 1
      - name: Exercise production SoluTION.AI across representative symbols
        env:
          SOLUTION_AI_BROWSER_URL: https://nckhtop1.github.io/vmews-risk-analytics/forecast-final.html?symbol=FPT
          SOLUTION_AI_SYMBOLS: FPT,ACB,HPG,VIC
        run: node scripts/solution_ai_browser_smoke.mjs
      - name: Audit all published symbols, UI flow, freshness and AI provider routes
        env:
          SOLUTION_AI_FULL_AUDIT_URL: https://nckhtop1.github.io/vmews-risk-analytics/forecast-final.html?symbol=FPT
        run: node scripts/solution_ai_full_system_audit.mjs
