name: Forecast V4 validation
on:
  push:
    branches: [feature/vmews-forecast-v4]
    paths:
      - 'scripts/forecast_v4_features.py'
      - 'scripts/train_forecast_v4.py'
      - '.github/workflows/forecast-v4-validation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vmews-forecast-v4
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy scikit-learn
      - name: Train and sealed-test pooled forecast
        run: python scripts/train_forecast_v4.py
      - name: Commit validated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast-model-v4.json forecast-validation-v4.json
          git diff --cached --quiet || git commit -m "Update validated forecast v4 model"
          git push origin HEAD:feature/vmews-forecast-v4
