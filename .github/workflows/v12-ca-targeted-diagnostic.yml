name: V12 targeted corporate-action diagnostic
on:
  workflow_dispatch:
  push:
    branches: [forecast-v12-methodfix]
    paths:
      - 'v12-ca-diagnostic-trigger.txt'
permissions:
  contents: read
  actions: read
concurrency:
  group: vmews-v12-ca-targeted-diagnostic
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V12_MIN_ROWS: '520'
      V12_VNSTOCK_INTERVAL: '3.25'
      V12_MAX_RAW_RETURN_GUARD: '0.12'
      V12_CROSS_SOURCE_MAD_LIMIT: '0.003'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-v12.txt
      - name: Install V12 source dependencies
        run: pip install --disable-pip-version-check -q -r requirements-v12.txt
      - name: Compile targeted CA diagnostic
        run: python -m py_compile scripts/v12_corporate_actions.py scripts/v12_source_capture.py scripts/v12_ca_targeted_diagnostic.py
      - name: Corporate-action regression
        run: PYTHONPATH=scripts python scripts/v12_corporate_actions_test.py
      - name: Audit only the 41 unresolved deep-history symbols
        run: PYTHONPATH=scripts python scripts/v12_ca_targeted_diagnostic.py
      - name: Upload targeted CA diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-ca-targeted-diagnostic-${{ github.run_id }}
          path: data/v12-ca-targeted-diagnostic.json
          if-no-files-found: error
          retention-days: 7
