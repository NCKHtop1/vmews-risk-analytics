name: V12 Actions status bridge
on:
  push:
    branches: [tmp-v12-detached-do-not-use]
    paths:
      - 'v12-actions-status-bridge-trigger.txt'
permissions:
  contents: write
  actions: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Query latest target source-freeze/full/release runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import json,os,urllib.parse,urllib.request
          token=os.environ['GH_TOKEN']
          repo='NCKHtop1/vmews-risk-analytics';branch='forecast-v12-methodfix'
          workflows=['v12-source-freeze-resilient.yml','v12-methodfix-full-hardened.yml','v12-release-final-hardened.yml','v12-ca-19-quota-probe.yml','v12-hardening-staging-test.yml']
          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'vmews-status-bridge'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          out={}
          for wf in workflows:
              b='tmp-v12-detached-do-not-use' if wf in {'v12-ca-19-quota-probe.yml','v12-hardening-staging-test.yml'} else branch
              url=f'https://api.github.com/repos/{repo}/actions/workflows/{urllib.parse.quote(wf,safe="")}/runs?branch={urllib.parse.quote(b)}&per_page=3'
              try:
                  z=get(url);runs=z.get('workflow_runs') or []
                  brief=[]
                  for r in runs:
                      item={k:r.get(k) for k in ['id','name','run_number','run_attempt','event','status','conclusion','head_sha','created_at','run_started_at','updated_at','html_url']}
                      if r.get('id'):
                          try:
                              jobs=get(f'https://api.github.com/repos/{repo}/actions/runs/{r["id"]}/jobs?per_page=100').get('jobs') or []
                              item['jobs']=[{'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion'),'started_at':j.get('started_at'),'completed_at':j.get('completed_at'),'steps':[{k:s.get(k) for k in ['name','status','conclusion','number']} for s in (j.get('steps') or [])]} for j in jobs]
                          except Exception as exc:item['jobsError']=f'{type(exc).__name__}: {exc}'
                      brief.append(item)
                  out[wf]=brief
              except Exception as exc:out[wf]={'error':f'{type(exc).__name__}: {exc}'}
          open('data/v12-actions-status-bridge.json','w',encoding='utf-8').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Commit status bridge result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v12-actions-status-bridge.json
          git commit -m 'Publish staging V12 Actions status bridge [no-full]'
          git push origin HEAD:tmp-v12-detached-do-not-use
