name: VMEWS live outcomes and PIT monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '5 0 * * 1-5'
    - cron: '20 10 * * 1-5'
  push:
    branches: [main, forecast-v6-research-grade, forecast-v10-release-final]
    paths:
      - 'data/market-scan.json'
      - 'data/pooled-hose/current-scores.json'
      - 'data/alert-policy.json'
      - 'data/forecast-model-v9.json'
      - 'data/forecast-model-v10.json'
      - 'data/sentiment-v8.json'
      - 'scripts/update_live_model_monitor.py'
      - 'scripts/run_forecast_v9_deployable.py'
      - 'scripts/run_forecast_v10_live.py'
      - '.github/workflows/live-model-monitor.yml'

permissions:
  contents: write

concurrency:
  group: vmews-data-writer-${{ github.ref_name }}
  queue: max

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install forecast monitor dependencies
        run: pip install numpy scipy scikit-learn
      - name: Archive aligned PIT snapshot and mature 20-session outcomes
        run: python scripts/update_live_model_monitor.py
      - name: Archive immutable V9 T+3/T+5 forecast state
        run: python scripts/run_forecast_v9_deployable.py --live
      - name: Archive immutable V10.1 T+3/T+5 forecast state
        run: python scripts/run_forecast_v10_live.py
      - name: Validate live-monitor governance
        run: |
          python - <<'PY'
          import json,pathlib
          t=json.load(open('data/live-track/track-record.json',encoding='utf-8'))
          q=json.load(open('data/live-track/integrity.json',encoding='utf-8'))
          f=json.load(open('data/forecast-live/integrity.json',encoding='utf-8'))
          e=json.load(open('data/forecast-live/evaluation.json',encoding='utf-8'))
          m=json.load(open('data/forecast-live/manifest.json',encoding='utf-8'))
          v10=json.load(open('data/forecast-live-v10/integrity.json',encoding='utf-8'))
          v10e=json.load(open('data/forecast-live-v10/evaluation.json',encoding='utf-8'))
          v10m=json.load(open('data/forecast-live-v10/manifest.json',encoding='utf-8'))
          assert t['version']=='VMEWS-LIVE-MONITOR-1.0.0',t['version']
          assert t['horizonSessions']==20,t
          assert '<= -12%' in t['eventDefinition'],t['eventDefinition']
          assert q['timeBasis']=='LATEST_COMPLETED_EOD_ONLY',q
          assert q['marketContextImputed'] is False,q
          assert q['status'] in {'PASS','WAITING_OR_REVIEW'},q
          if q['status']=='PASS':
              assert q['sameCompletedEod'] is True,q
              assert q['policyAligned'] is True,q
              assert q['pointInTimeReady'] is True,q
          assert f['version']=='VMEWS-FORECAST-LIVE-1.0.0' and f['status']=='PASS',f
          assert f['timeBasis']=='COMPLETED_EOD_ONLY',f
          assert m['count']>=1,m
          assert set(e['summary'])=={'3','5'},e['summary']
          assert v10['version']=='VMEWS-FORECAST-LIVE-10.0.0' and v10['status']=='PASS',v10
          assert v10['modelVersion']=='VMEWS-FORECAST-10.1.0',v10
          assert v10['timeBasis']=='COMPLETED_EOD_ONLY' and v10['symbols']>=200,v10
          assert v10m['count']>=1,v10m
          assert set(v10e['summary'])=={'3','5'},v10e['summary']
          for h in ('3','5'):
              assert v10e['summary'][h]['evidenceState'] in {'IMMATURE','EARLY','MATURE'},v10e['summary'][h]
          cal=t['calibrationLiveMonitor']
          assert cal['status'] in {'INSUFFICIENT_MATURED_LIVE_DATA','UNSTABLE_KEEP_WITHHELD','STABLE_REVIEW_ELIGIBLE'},cal
          assert 'manual' in cal['effect'].lower(),cal['effect']
          print(json.dumps({'riskIntegrity':q['status'],'v9Forecast':f['status'],'v10Forecast':v10['status'],'v10Archive':v10['archiveStatus'],'v10Symbols':v10['symbols'],'v10Snapshots':v10m['count'],'T3':v10e['summary']['3'],'T5':v10e['summary']['5']},indent=2))
          PY
      - name: Verify V9 forecast snapshot hashes
        run: python scripts/run_forecast_v9_deployable.py --verify-live
      - name: Commit immutable PIT archives and live track records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live-track data/forecast-live data/forecast-live-v10
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh VMEWS immutable PIT live monitors [data-only]'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo 'Could not persist live monitor data after retries' >&2
          exit 1
