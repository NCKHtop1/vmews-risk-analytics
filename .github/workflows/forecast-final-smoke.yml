name: Forecast V10 production smoke
on:
  push:
    branches: [main, forecast-v10-release-final]
    paths:
      - 'forecast-final.html'
      - 'forecast-final-v10.js'
      - 'forecast-v4-core.js'
      - 'data/forecast-model-v10.json'
      - 'data/research-news-v10.json'
      - 'data/sentiment-v10.json'
      - 'data/news-event-study.json'
      - 'scripts/forecast_v10_smoke_final.js'
      - '.github/workflows/forecast-final-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check forecast-v4-core.js
          node --check forecast-final-v10.js
          node --check scripts/forecast_v10_smoke_final.js
      - name: V10 production contract
        run: node scripts/forecast_v10_smoke_final.js
