name: Forecast V9 final smoke
on:
  push:
    branches: [forecast-v6-research-grade, main]
    paths:
      - 'forecast-final.html'
      - 'forecast-final-v5.js'
      - 'forecast-v4-core.js'
      - 'forecast-v4.css'
      - 'data/forecast-model-v9.json'
      - 'data/sentiment-v8.json'
      - 'scripts/forecast_final_dom_smoke.js'
      - '.github/workflows/forecast-final-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check forecast-v4-core.js
          node --check forecast-final-v5.js
      - name: Model contract
        run: |
          node -e "const m=require('./data/forecast-model-v9.json'); if(m.promotion.status!=='PASS'||m.universe.rows<80000) throw Error('bad v9 artifact'); for(const h of ['3','5']){const z=m.horizons[h];if(!z.gates.rankingApproved||!z.gates.directionApproved)throw Error('gate '+h);if(!z.calibrationBuckets||z.calibrationBuckets.length<6)throw Error('buckets '+h)}; console.log(m.version,m.universe)"
      - run: npm install --no-save jsdom@26
      - name: Browser DOM smoke
        run: node scripts/forecast_final_dom_smoke.js
