name: Forecast V9 final smoke
on:
  push:
    branches: [forecast-v6-research-grade, main]
    paths:
      - 'forecast-final.html'
      - 'forecast-final-v5.js'
      - 'forecast-v4-core.js'
      - 'forecast-v4.css'
      - 'data/forecast-model-v9.json'
      - 'data/sentiment-v8.json'
      - 'data/forecast-live/**'
      - 'data/live-track/**'
      - 'scripts/forecast_final_smoke.js'
      - 'scripts/forecast_final_dom_smoke.js'
      - '.github/workflows/forecast-final-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check forecast-v4-core.js
          node --check forecast-final-v5.js
          node --check scripts/forecast_final_smoke.js
          node --check scripts/forecast_final_dom_smoke.js
      - name: Production artifact contract
        run: node scripts/forecast_final_smoke.js
      - run: npm install --no-save jsdom@26
      - name: Browser DOM smoke
        run: node scripts/forecast_final_dom_smoke.js
