name: Refresh market news stream

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/market-news-live.yml'
      - '.github/workflows/market-realtime-guard.yml'
      - 'financial-report/scripts/refresh_market.py'
      - 'financial-report/scripts/news_intelligence.py'
      - 'financial-report/scripts/hybrid_news_impact.py'
      - 'financial-report/scripts/news_impact_prospective.py'
      - 'financial-report/data/news-economic-exposure-registry.json'
  schedule:
    # Redundant quarter-hour triggers enqueue the next collector while the
    # current 5-hour heartbeat remains active. Do NOT cancel an active publisher
    # just because a scheduled event arrived; that caused a noon data gap.
    # The independent market-realtime-guard still checks the actual snapshots.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  # Isolate Hybrid V2 from a superseded five-hour publisher. The prior
  # runner exits on its next main-code check; this group starts the new
  # receipt-aware collector immediately instead of waiting behind that run.
  group: market-news-hybrid-v2
  # Let the active publisher complete; keep a queued successor ready.
  # GitHub concurrency permits one pending run and replaces older pending
  # triggers, so repeated cron events cannot create an unbounded queue.
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: financial-report
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore latest market branch
        run: |
          git fetch origin financial-market-data
          git worktree add /tmp/market-news origin/financial-market-data
          git -C /tmp/market-news sparse-checkout set market
          mkdir -p /tmp/market-news/market
      - name: Maintain resilient news heartbeat
        shell: bash
        run: |
          set -uo pipefail
          superseded=0
          # Keep one publisher alive for about five hours. The hourly cron
          # normally hands ownership to a newer run, but a delayed/skipped GitHub
          # schedule must not create a multi-hour production news gap.
          for iteration in $(seq 1 20); do
            echo "=== News heartbeat $iteration/20 at $(date -u '+%H:%M:%S UTC') ==="
            # GitHub concurrency is the first line of defence, but a long-lived
            # runner must also refuse to publish with collector/workflow code
            # that has been superseded on main.
            if git fetch --quiet --no-tags origin main; then
              local_collector="$(git rev-parse "${GITHUB_SHA}:financial-report/scripts/refresh_market.py" 2>/dev/null || true)"
              main_collector="$(git rev-parse "origin/main:financial-report/scripts/refresh_market.py" 2>/dev/null || true)"
              local_intelligence="$(git rev-parse "${GITHUB_SHA}:financial-report/scripts/news_intelligence.py" 2>/dev/null || true)"
              main_intelligence="$(git rev-parse "origin/main:financial-report/scripts/news_intelligence.py" 2>/dev/null || true)"
              local_workflow="$(git rev-parse "${GITHUB_SHA}:.github/workflows/market-news-live.yml" 2>/dev/null || true)"
              main_workflow="$(git rev-parse "origin/main:.github/workflows/market-news-live.yml" 2>/dev/null || true)"
              if [ -z "$local_collector" ] || [ -z "$main_collector" ] || [ -z "$local_intelligence" ] || [ -z "$main_intelligence" ] || [ "$local_collector" != "$main_collector" ] || [ "$local_intelligence" != "$main_intelligence" ] || [ "$local_workflow" != "$main_workflow" ]; then
                echo "::notice::This News publisher is superseded by newer collector/workflow code on main; stopping before another publish."
                superseded=1
                break
              fi
            fi
            git -C /tmp/market-news fetch origin financial-market-data
            git -C /tmp/market-news reset --hard origin/financial-market-data
            git -C /tmp/market-news clean -fd

            if ! python -u financial-report/scripts/refresh_market.py --output /tmp/market-news/market --mode news; then
              echo "::warning::News collection failed; retrying on the next heartbeat."
            else
              if SNAPSHOT=/tmp/market-news/market/news.json python - <<'PY'
          import json, math, os
          from datetime import datetime, timezone
          from pathlib import Path
          data=json.loads(Path(os.environ['SNAPSHOT']).read_text())
          if data.get('status')!='ok':
              raise SystemExit('news.json status is not ok')
          checked=datetime.fromisoformat(str(data.get('checkedAt')).replace('Z','+00:00'))
          if checked.tzinfo is None:
              checked=checked.replace(tzinfo=timezone.utc)
          age=(datetime.now(timezone.utc)-checked.astimezone(timezone.utc)).total_seconds()
          if age>20*60:
              raise SystemExit(f'news snapshot stale: {age:.0f}s')
          if not data.get('items'):
              raise SystemExit('news snapshot has no items')
          print('NEWS OK',len(data.get('items') or []),data.get('checkedAt'))
          PY
              then
                git -C /tmp/market-news config user.name 'github-actions[bot]'
                git -C /tmp/market-news config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                git -C /tmp/market-news restore --worktree market/drivers.json || true
                test -s /tmp/market-news/market/news-latest.json
                test -s /tmp/market-news/market/news-company-latest.json
                test -s /tmp/market-news/market/news-stories.json
                test -s /tmp/market-news/market/news-semantic-health.json
                test -s /tmp/market-news/market/news-impact-shadow-v2.json || { echo '::warning::Impact research shadow missing'; continue; }
                test -s /tmp/market-news/market/news-impact-prospective-ledger-v2.json || { echo '::warning::Prospective evidence ledger missing'; continue; }
                if ! python - <<'PY'; then
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/market-news/market/news-impact-shadow-v2.json').read_text())
          if x.get('schema')!='FINQUERY_HYBRID_NEWS_IMPACT_SHADOW_V2':
              raise SystemExit('Hybrid news schema invalid')
          if (x.get('counts') or {}).get('eligibleNotifications')!=0:
              raise SystemExit('Unapproved news-impact alerts')
          if (x.get('publicationPolicy') or {}).get('killSwitch')!='LOCKED_OFF':
              raise SystemExit('Hybrid news impact kill switch unexpectedly open')
          ledger=json.loads(Path('/tmp/market-news/market/news-impact-prospective-ledger-v2.json').read_text())
          if ledger.get('schema')!='FINQUERY_NEWS_IMPACT_PROSPECTIVE_LEDGER_V2' or ledger.get('notificationsEnabled') is not False:
              raise SystemExit('Prospective ledger improperly configured')
          if ledger.get('eventCount')!=(x.get('counts') or {}).get('prospectiveLedgerRecords'):
              raise SystemExit('Hybrid shadow/ledger snapshots misaligned')
          print('HYBRID NEWS SHADOW FAIL-CLOSED',x.get('status'),(x.get('counts') or {}).get('classifiedEventStories',0),'ledger',ledger.get('eventCount'))
          PY
                  echo '::warning::Hybrid News shadow contract rejected; no data publication'
                  continue
                fi
                test -s /tmp/market-news/market/news-daily-brief.json
                test -s /tmp/market-news/market/news-viewpoint-sentiment.json
                git -C /tmp/market-news add --sparse market/news.json market/news-latest.json market/news-company-latest.json market/news-stories.json market/news-semantic-health.json market/news-impact-shadow-v2.json market/news-impact-prospective-ledger-v2.json market/news-daily-brief.json market/news-viewpoint-sentiment.json
                if ! git -C /tmp/market-news diff --cached --quiet; then
                  git -C /tmp/market-news commit -m 'Refresh market news stream [data-only]'
                  published=0
                  for attempt in 1 2 3; do
                    git -C /tmp/market-news fetch origin financial-market-data
                    if git -C /tmp/market-news rebase origin/financial-market-data && git -C /tmp/market-news push origin HEAD:refs/heads/financial-market-data; then
                      published=1
                      break
                    fi
                    git -C /tmp/market-news rebase --abort || true
                    sleep $((attempt * 2))
                  done
                  if [ "$published" -ne 1 ]; then
                    echo "::warning::Unable to publish this news heartbeat after retries."
                  else
                    # Pages serves a bundled copy of financial-market-data. A
                    # long-lived News runner does not complete after each 15m
                    # heartbeat, so workflow_run alone cannot keep the public
                    # UI fresh. Dispatch Pages immediately after a real data
                    # commit is published; pages.yml concurrency handles overlap.
                    if GH_TOKEN="${{ github.token }}" gh workflow run pages.yml --ref main; then
                      echo "Pages deploy requested for the new News snapshot."
                    else
                      echo "::warning::News data published but Pages dispatch failed; freshness guard/browser smoke will catch a stale public bundle."
                    fi
                  fi
                else
                  echo "No news changes to publish"
                fi
              else
                echo "::warning::News validation failed; stale data was not published."
              fi
            fi

            if [ "$iteration" -lt 20 ]; then
              sleep 900
            fi
          done

          if [ "$superseded" -eq 1 ]; then
            echo "Superseded News publisher exited cleanly; the newer main run owns the next heartbeat."
            exit 0
          fi

          # Warnings inside an iteration must never let an entirely stale remote
          # branch finish green. Re-read the published branch, not the worktree.
          git -C /tmp/market-news fetch origin financial-market-data
          git -C /tmp/market-news show origin/financial-market-data:market/news-latest.json > /tmp/remote-news-latest.json
          git -C /tmp/market-news show origin/financial-market-data:market/news-company-latest.json > /tmp/remote-news-company.json
          git -C /tmp/market-news show origin/financial-market-data:market/news-daily-brief.json > /tmp/remote-news-brief.json
          git -C /tmp/market-news show origin/financial-market-data:market/news-viewpoint-sentiment.json > /tmp/remote-news-sentiment.json
          REMOTE_NEWS=/tmp/remote-news-latest.json REMOTE_COMPANY=/tmp/remote-news-company.json REMOTE_BRIEF=/tmp/remote-news-brief.json REMOTE_SENTIMENT=/tmp/remote-news-sentiment.json python - <<'PY'
          import json, math, os
          from datetime import datetime, timezone
          from pathlib import Path
          data=json.loads(Path(os.environ['REMOTE_NEWS']).read_text())
          company=json.loads(Path(os.environ['REMOTE_COMPANY']).read_text())
          brief=json.loads(Path(os.environ['REMOTE_BRIEF']).read_text())
          sentiment=json.loads(Path(os.environ['REMOTE_SENTIMENT']).read_text())
          stamp=datetime.fromisoformat(str(data.get('checkedAt')).replace('Z','+00:00'))
          if stamp.tzinfo is None:
              stamp=stamp.replace(tzinfo=timezone.utc)
          age=(datetime.now(timezone.utc)-stamp.astimezone(timezone.utc)).total_seconds()/60
          if data.get('status')!='ok' or not data.get('items') or not (-5 <= age <= 30):
              raise SystemExit(f'remote news branch is stale/invalid: status={data.get("status")} age={age:.1f} items={len(data.get("items") or [])}')
          if int((data.get('sourceHealth') or {}).get('healthy') or 0)<3:
              raise SystemExit(f'Overall News independent sources below healthy floor: {data.get("sourceHealth")}')
          if int((data.get('sourceHealth') or {}).get('healthyProviderCount') or 0)<3:
              raise SystemExit(f'News independently healthy publisher count below three: {data.get("sourceHealth")}')
          if company.get('status')!='ok' or company.get('selection')!='per_symbol_latest' or not company.get('items') or not company.get('companyCounts'):
              raise SystemExit(f'company news index invalid: status={company.get("status")} coverage={company.get("companyCoverage")} items={len(company.get("items") or [])}')
          shadow=json.loads((__import__('subprocess').check_output(['git','-C','/tmp/market-news','show','origin/financial-market-data:market/news-impact-shadow-v2.json'])).decode())
          ledger=json.loads((__import__('subprocess').check_output(['git','-C','/tmp/market-news','show','origin/financial-market-data:market/news-impact-prospective-ledger-v2.json'])).decode())
          if ledger.get('schema')!='FINQUERY_NEWS_IMPACT_PROSPECTIVE_LEDGER_V2' or ledger.get('notificationsEnabled') is not False:
              raise SystemExit('Remote prospective evidence ledger invalid')
          if shadow.get('schema')!='FINQUERY_HYBRID_NEWS_IMPACT_SHADOW_V2' or shadow.get('checkedAt')!=data.get('checkedAt'):
              raise SystemExit('Live hybrid news impact shadow not aligned')
          if (shadow.get('counts') or {}).get('eligibleNotifications')!=0 or (shadow.get('publicationPolicy') or {}).get('killSwitch')!='LOCKED_OFF':
              raise SystemExit('Live hybrid news impact alert gate violated')
          if str(company.get('checkedAt'))!=str(data.get('checkedAt')):
              raise SystemExit('company news index is not aligned with latest news snapshot')
          if brief.get('status')!='ok' or str(brief.get('checkedAt'))!=str(data.get('checkedAt')) or not brief.get('topStories'):
              raise SystemExit(f'Daily Brief invalid or misaligned: {brief}')
          if sentiment.get('status')!='ok' or str(sentiment.get('checkedAt'))!=str(data.get('checkedAt')) or sentiment.get('separatedFromBreaking') is not True:
              raise SystemExit(f'Viewpoint sentiment invalid or misaligned: {sentiment}')
          luat=data.get('luatVietnamDirect') or {}
          if int(luat.get('expectedParsers') or 0)!=4 or int(luat.get('parserHealthy') or 0)<3:
              raise SystemExit(f'LuatVietnam direct parser contract failed: {luat}')
          if luat.get('status')!='ok':
              raise SystemExit(f'LuatVietnam direct source degraded/unavailable: {luat}')
          source_map={str(x.get('name') or ''):x for x in (data.get('sources') or [])}
          live24=source_map.get('24HMoney Live') or {}
          symbol24=source_map.get('24HMoney Symbol') or {}
          if live24.get('parser')!='24hmoney-live-v4':
              raise SystemExit(f'24HMoney Live parser version invalid: {live24.get("parser")}')
          if live24.get('status') not in ('ok','empty','degraded','error'):
              raise SystemExit(f'24HMoney Live status invalid: {live24.get("status")}')
          # Separate one unreliable vendor SSR feed from the verified News aggregate.
          # A single current SSR article can never make a mostly-stale feed green.
          if live24.get('status')=='ok':
              if live24.get('qualityChecked') is not True:
                  raise SystemExit('24HMoney Live OK without verified source-quality audit')
              dated=int(live24.get('datedUnique') or 0)
              fresh=int(live24.get('recentUnique') or 0)
              if fresh<=0 or (dated>=5 and fresh*4<dated):
                  raise SystemExit(f'24HMoney Live false healthy state: fresh={fresh} dated={dated}')
          if live24.get('status')=='empty' and int(live24.get('articleAnchors') or 0)>0 and int(live24.get('recentUnique') or 0)==0:
              raise SystemExit(f'24HMoney Live falsely empty with stale/undated anchors: {live24}')
          if live24.get('status') in ('degraded','error'):
              print('::warning::24HMoney Live isolated source degradation:',live24.get('statusReason') or live24.get('error'),'sourceMode',live24.get('sourceMode'),'fresh',live24.get('recentUnique'),'dated',live24.get('datedUnique'))
          if symbol24.get('status')=='error':
              print('::warning::24HMoney Symbol isolated provider failure:',symbol24.get('errors') or symbol24.get('error'))
          if symbol24.get('parser')!='24hmoney-symbol-v5':
              raise SystemExit(f'24HMoney Symbol parser version invalid: {symbol24.get("parser")}')
          attempted=max(1,int(symbol24.get('symbolsAttempted') or 0))
          reachable=int(symbol24.get('symbolsReachable') or 0)
          if reachable < math.ceil(attempted*.70):
              print('::warning::24HMoney Symbol isolated low reachability:',reachable,'/',attempted)
          print('REMOTE NEWS CONTRACT PASS',round(age,1),len(data.get('items') or []),'companyCoverage',company.get('companyCoverage'),'luat',luat,'24hmoney',{k:(source_map.get(k) or {}).get('items') for k in ('24HMoney Live','24HMoney Symbol')})
          PY
