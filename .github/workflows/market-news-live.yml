name: Refresh market news stream

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/market-news-live.yml'
      - '.github/workflows/market-realtime-guard.yml'
      - 'financial-report/scripts/refresh_market.py'
  schedule:
    # Primary publisher cadence: every 15 minutes, including evenings/weekends.
    # market-realtime-guard is a separate 5-minute recovery heartbeat because
    # GitHub scheduled events can occasionally be delayed or skipped.
    - cron: '12,27,42,57 * * * *'

permissions:
  contents: write

concurrency:
  group: market-news-live
  # News runs are short, but overlapping recovery/schedule triggers must not
  # cancel a publisher that is already validating/pushing a fresh snapshot.
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: financial-report
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore latest market branch
        run: |
          git fetch origin financial-market-data
          git worktree add /tmp/market-news origin/financial-market-data
          git -C /tmp/market-news sparse-checkout set market
          mkdir -p /tmp/market-news/market
      - name: Collect publisher headlines
        run: python -u financial-report/scripts/refresh_market.py --output /tmp/market-news/market --mode news
      - name: Validate news freshness
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          data=json.loads(Path('/tmp/market-news/market/news.json').read_text())
          if data.get('status')!='ok':
              raise SystemExit('news.json status is not ok')
          checked=datetime.fromisoformat(str(data.get('checkedAt')).replace('Z','+00:00'))
          if checked.tzinfo is None:
              checked=checked.replace(tzinfo=timezone.utc)
          age=(datetime.now(timezone.utc)-checked.astimezone(timezone.utc)).total_seconds()
          if age>20*60:
              raise SystemExit(f'news snapshot stale: {age:.0f}s')
          if not data.get('items'):
              raise SystemExit('news snapshot has no items')
          print('NEWS OK',len(data.get('items') or []),data.get('checkedAt'))
          PY
      - name: Publish news snapshot
        working-directory: /tmp/market-news
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # news.json is owned by this workflow; drivers.json is owned by the price workflow.
          # refresh_market.py recalculates drivers locally, so discard that unstaged change
          # before rebasing/publishing the news-only commit.
          git restore --worktree market/drivers.json || true
          git add --sparse market/news.json
          if git diff --cached --quiet; then
            echo "No news changes to publish"
            exit 0
          fi
          git commit -m 'Refresh market news stream [data-only]'
          for attempt in 1 2 3; do
            git fetch origin financial-market-data
            if git rebase origin/financial-market-data && git push origin HEAD:refs/heads/financial-market-data; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Unable to publish news snapshot after retries" >&2
          exit 1
