name: FinQuery Forecast Core production UX smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/forecast_core_real_browser_smoke.py'
      - '.github/workflows/finquery-forecast-core-production-smoke.yml'
  # Production checks run after verified Pages deployment. The Vercel
  # application intentionally requires Google login, so unauthenticated E2E
  # checks its auth redirect while the full browser regression uses the same
  # deployed code and real published market sources in an isolated preview.
  workflow_run:
    workflows: ['Deploy VMEWS Pages']
    branches: [main]
    types: [completed]
  schedule:
    # 10:10 and 17:10 Vietnam time, covering market opening and post-close.
    - cron: '10 3,10 * * 1-5'

permissions:
  contents: read

concurrency:
  # Production Pages jobs must not cancel a distinct pull-request E2E run.
  group: finquery-forecast-core-production-ux-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: true

jobs:
  forecast-ui:
    # PR checks the exact proposed branch; post-Pages checks the commit that
    # triggered deploy with the production data feed, without bypassing auth.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: pip install --disable-pip-version-check -q selenium==4.36.0
      # Use the same source commit on localhost in production because the
      # canonical FinQuery domain is Google-authenticated by design.
      - name: Start isolated forecast preview with published market data
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m http.server 8765 --bind 127.0.0.1 > /tmp/forecast-preview-http.log 2>&1 &
          for attempt in $(seq 1 15); do
            if curl --silent --show-error --fail http://127.0.0.1:8765/forecast-final.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/forecast-preview-http.log
          exit 1
      - name: Verify protected production route and real VN100 data publisher
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          STATUS_URL='https://raw.githubusercontent.com/NCKHtop1/vmews-risk-analytics/finquery-vn100-data/data/finquery-vn100-status.json'
          curl --retry 3 --retry-delay 2 -fsSL --max-time 20 "$STATUS_URL?check=$GITHUB_RUN_ID" -o /tmp/vn100-status.json
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          p=json.load(open('/tmp/vn100-status.json'))
          assert p.get('status')=='PASS' and p.get('symbols')==100 and p.get('horizons')==500,p
          stamp=datetime.fromisoformat(str(p.get('generatedAt') or '').replace('Z','+00:00'))
          assert stamp.tzinfo and stamp.astimezone(timezone.utc)<=datetime.now(timezone.utc),p
          print('AUTH_AWARE_FORECAST_SOURCE_PASS',p['generatedAt'],p.get('inputMode'),p['symbols'],p['horizons'])
          PY
          curl -sS --retry 3 --retry-delay 2 --max-time 20 -D /tmp/finquery-auth-headers.txt -o /dev/null \
            "https://finquery.info.vn/forecast-final.html?symbol=FPT"
          python - <<'PY'
          import re
          text=open('/tmp/finquery-auth-headers.txt').read()
          code=re.findall(r'^HTTP/\S+\s+(\d{3})',text,re.M)
          locations=re.findall(r'^location:\s*([^\r\n]+)',text,re.I|re.M)
          assert code and code[-1] in {'301','302','303','307','308'},(code,locations)
          assert locations and '/login' in locations[-1].lower(),(code,locations)
          print('AUTH_PROTECTED_FORECAST_PASS',code[-1])
          PY
      - name: Verify Forecast Core loads, refreshes intraday quotes and forecasts, changes nine VN100 symbols and works on mobile
        env:
          FINQUERY_FORECAST_URL: http://127.0.0.1:8765/forecast-final.html
        run: python scripts/forecast_core_real_browser_smoke.py
      - name: Preserve failure evidence only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: finquery-forecast-core-ux-failure
          path: forecast-core-browser-evidence/
          retention-days: 7
