name: Forecast V6 research audit
on:
  push:
    branches: [forecast-v6-research-grade]
    paths:
      - 'scripts/audit_vnstock_flow.py'
      - '.github/workflows/forecast-v6-research.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Audit vnstock market flow methods
        run: python scripts/audit_vnstock_flow.py
