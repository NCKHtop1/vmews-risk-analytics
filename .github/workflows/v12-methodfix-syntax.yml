name: V12 methodfix fast gate
on:
  workflow_dispatch:
  push:
    branches: [forecast-v12-methodfix]
    paths:
      - 'scripts/v12_train_parts/**'
      - 'scripts/v12_entity.py'
      - 'scripts/v12_acceptance.py'
      - 'scripts/v12_active_flow_acceptance.py'
      - 'scripts/v12_sector_acceptance.py'
      - 'scripts/v12_embargo_acceptance.py'
      - 'scripts/v12_method_unit_test.py'
      - 'scripts/v12_flow.py'
      - 'scripts/backfill_flow_v12.py'
      - 'scripts/train_forecast_v12.py'
      - '.github/workflows/v12-methodfix-syntax.yml'
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check -q numpy scipy scikit-learn lightgbm
      - name: Compile strict utilities and assembled V12 methodfix
        run: |
          python -m py_compile scripts/v12_acceptance.py scripts/v12_active_flow_acceptance.py scripts/v12_sector_acceptance.py scripts/v12_embargo_acceptance.py scripts/v12_method_unit_test.py scripts/v12_flow.py scripts/backfill_flow_v12.py scripts/train_forecast_v12.py
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          parts=sorted((Path('scripts')/'v12_train_parts').glob('*.pyinc'))
          code='\n'.join(p.read_text(encoding='utf-8') for p in parts)
          compiled=compile(code,'v12-methodfix-assembled.py','exec')
          ns={'__name__':'v12_structure_check','__file__':'scripts/train_forecast_v12.py'}
          exec(compiled,ns,ns)
          assert callable(ns.get('run_v12_pipeline')),'top-level run_v12_pipeline missing'
          names=set(ns['run_v12_pipeline'].__code__.co_names)
          for required in ['build_price_store','get_index_history','base_panel','prepare_articles','merge_evidence','fit_horizon','current_predictions','backtest_cases']:
              assert required in names,(required,sorted(names))
          assert 'sectorPIT' in ns['source_audit_summary']({},{}),'sector PIT audit injection missing'
          print('V12 METHODFIX ASSEMBLED STRUCTURE PASS',len(parts),[p.name for p in parts])
          PY
      - name: Runtime method-risk unit tests
        run: PYTHONPATH=scripts python scripts/v12_method_unit_test.py
      - name: Flow source-missingness unit regression
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from datetime import date,timedelta
          from v12_flow import FlowTimeline
          start=date(2026,1,1);rows=[]
          for i in range(50):
              d=(start+timedelta(days=i)).isoformat();r={'date':d,'foreignBuyValue':100+i,'foreignSellValue':80,'foreignNetValue':20+i}
              if i>=25:r.update({'propBuyValue':40,'propSellValue':30,'propNetValue':10})
              rows.append(r)
          d=(start+timedelta(days=50)).isoformat();rows.append({'date':d,'propBuyValue':45,'propSellValue':35,'propNetValue':10});z=FlowTimeline(rows).features(d);assert z['foreignAvailable']==0 and z['propAvailable']==1,z
          d0=(start+timedelta(days=51)).isoformat();rows.append({'date':d0,'foreignBuyValue':0,'foreignSellValue':0,'foreignNetValue':0,'propBuyValue':0,'propSellValue':0,'propNetValue':0});z=FlowTimeline(rows).features(d0);assert z['foreignAvailable']==1 and z['propAvailable']==1,z
          dm=(start+timedelta(days=52)).isoformat();z=FlowTimeline(rows).features(dm);assert z['foreignAvailable']==0 and z['propAvailable']==0,z
          print('V12 FLOW MISSINGNESS UNIT PASS')
          PY
      - name: Entity adversarial tests
        run: PYTHONPATH=scripts python scripts/v12_entity_test.py
