name: Legacy research news refresh (manual only)

# Gemini + Google Search grounding is the target external live news provider.
# Automatic Google News RSS refreshes are intentionally disabled.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-disabled:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Legacy RSS news refresh is disabled."
          echo "Use the server-side Gemini live provider after GEMINI_API_KEY is configured."
