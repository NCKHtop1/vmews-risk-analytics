name: Update research news

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_research_news.py'
      - '.github/workflows/update-research-news.yml'
      - '.news-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_research_news.py
      - name: Commit snapshot
        run: |
          git config user.name 'vmews-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/research-news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update research news snapshot [skip ci]'
          git push
