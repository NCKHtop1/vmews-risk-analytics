name: Refresh live HOSE Core + Liquid prices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/market-price-live.yml'
      - 'financial-report/scripts/refresh_market.py'
      - 'financial-report/scripts/build_technical_evidence.py'
      - 'financial-report/scripts/build_strategy_snapshot.cjs'
      - 'financial-report/scripts/build_risk_monitor.cjs'
      - 'financial-report/scripts/build_sector_risk_calibration.cjs'
      - 'data/fund-holdings-history-v16.json'
      - 'financial-report/scripts/live_session_publisher.sh'
      - 'financial-report/data/universe.json'
  workflow_run:
    # GitHub scheduled workflows can be delayed or occasionally skipped under load.
    # The continuously-running news publisher is an independent 15-minute heartbeat
    # that re-triggers prices during the VN trading window.
    workflows:
      - Refresh market news stream
    branches:
      - main
    types:
      - completed
  schedule:
    # Redundant session bootstraps. Scheduled events can be delayed, so the
    # long-lived publisher also receives workflow_run heartbeats above.
    - cron: '0 2 * * 1-5'   # 09:00 Vietnam
    - cron: '55 5 * * 1-5'  # 12:55 Vietnam
    # Backup cadence + close catches. Once one run starts, concurrency keeps it
    # alive and later triggers queue instead of cancelling the active publisher.
    - cron: '5,20,35,50 2-8 * * 1-5'

permissions:
  contents: write
  actions: write

concurrency:
  group: market-price-live
  # Scheduled/news heartbeats never interrupt the active session publisher.
  # A code push is the exception: hand over immediately so a repaired publisher
  # does not wait behind an hours-old run that is still executing old code.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  prices:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            financial-report
            data/fund-holdings-history-v16.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Vietnam trading window
        id: session
        shell: bash
        run: |
          hhmm=$(TZ=Asia/Ho_Chi_Minh date +%H%M)
          # During a live/close-catch window every trigger becomes a persistent
          # session publisher. This includes workflow_dispatch recoveries from
          # the freshness guard, so one recovery run cannot go stale again.
          if { [ "$hhmm" -ge 0900 ] && [ "$hhmm" -le 1140 ]; } || { [ "$hhmm" -ge 1255 ] && [ "$hhmm" -le 1505 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "oneshot=0" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "oneshot=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "oneshot=1" >> "$GITHUB_OUTPUT"
            echo "Outside VN trading refresh window: $hhmm"
          fi
      - name: Persist repaired derived snapshots after code push
        if: github.event_name == 'push' && steps.session.outputs.run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/market-derived
          rm -rf "$OUT"
          git fetch origin financial-market-data
          git worktree add "$OUT" origin/financial-market-data
          git -C "$OUT" sparse-checkout set market
          git -C "$OUT" config user.name 'github-actions[bot]'
          git -C "$OUT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python financial-report/scripts/refresh_market.py --output "$OUT/market" --mode scanner
          node financial-report/scripts/build_strategy_snapshot.cjs "$OUT/market"
          node financial-report/scripts/build_sector_risk_calibration.cjs "$OUT/market"
          node financial-report/scripts/build_risk_monitor.cjs "$OUT/market"

          SNAPSHOT_DIR="$OUT/market" python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['SNAPSHOT_DIR'])
          load=lambda name: json.loads((root/name).read_text())
          quotes=load('quotes.json')
          scanner=load('technical-signals.json')
          strategy=load('strategy-indicators.json')
          watch=load('watch-today.json')
          risk=load('risk-monitor.json')
          latest=str(quotes.get('latestSourceTime') or quotes.get('sourceTime') or '')
          assert latest, 'quotes sourceTime missing'
          assert str(scanner.get('sourceTime') or '')==latest,(scanner.get('sourceTime'),latest)
          assert str(strategy.get('sourceTime') or '')==latest,(strategy.get('sourceTime'),latest)
          assert watch.get('status')=='ok' and str(watch.get('sourceTime') or '')==latest,(watch.get('status'),watch.get('sourceTime'),latest)
          assert str(risk.get('sourceTime') or '')==latest,(risk.get('sourceTime'),latest)
          assert int(scanner.get('refreshEveryMinutes') or 0)==5,scanner.get('refreshEveryMinutes')
          live_scanner=[x for x in (scanner.get('symbols') or {}).values() if x.get('cadence')=='LIVE_15M']
          live_strategy=[x for x in (strategy.get('symbols') or {}).values() if x.get('cadence')=='LIVE_15M']
          scanner_cmp=[x for x in live_scanner if isinstance(x.get('macdHistogram'),(int,float)) and isinstance(x.get('previousMacdHistogram'),(int,float)) and abs(float(x['macdHistogram'])-float(x['previousMacdHistogram']))>1e-9]
          strategy_cmp=[x for x in live_strategy if isinstance((x.get('current') or {}).get('macdHistogram'),(int,float)) and isinstance((x.get('previous') or {}).get('macdHistogram'),(int,float)) and abs(float(x['current']['macdHistogram'])-float(x['previous']['macdHistogram']))>1e-9]
          assert len(live_scanner)<50 or len(scanner_cmp)>=5,(len(live_scanner),len(scanner_cmp))
          assert len(live_strategy)<50 or len(strategy_cmp)>=5,(len(live_strategy),len(strategy_cmp))
          assert str(risk.get('methodVersion') or '')=='FINQUERY-RISK-RULES-1.6',risk.get('methodVersion')
          print({'sourceTime':latest,'scannerLive':len(live_scanner),'scannerComparators':len(scanner_cmp),'strategyLive':len(live_strategy),'strategyComparators':len(strategy_cmp),'risk':(risk.get('overall') or {}).get('score')})
          PY

          git -C "$OUT" add --sparse market/technical-signals.json market/strategy-indicators.json market/watch-today.json market/sector-risk-calibration.json market/risk-monitor.json
          if git -C "$OUT" diff --cached --quiet; then
            echo "Derived market snapshots already current"
            exit 0
          fi
          git -C "$OUT" commit -m 'Repair derived FinQuery market snapshots [data-only]'
          for attempt in 1 2 3; do
            git -C "$OUT" fetch origin financial-market-data
            if git -C "$OUT" rebase origin/financial-market-data && git -C "$OUT" push origin HEAD:refs/heads/financial-market-data; then
              exit 0
            fi
            git -C "$OUT" rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Unable to publish repaired derived snapshots" >&2
          exit 1
      - name: Run resilient current-session publisher
        if: steps.session.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE_ONESHOT: ${{ steps.session.outputs.oneshot }}
          MARKET_LOOP_SECONDS: '300'
          MARKET_MAX_QUOTE_AGE_MINUTES: '18'
          MARKET_CLOSE_CATCH_MAX_AGE_MINUTES: '30'
        run: bash financial-report/scripts/live_session_publisher.sh
