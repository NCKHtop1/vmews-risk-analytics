name: FinQuery computed-color contrast browser gate

on:
  pull_request:
    paths:
      - 'financial-report/frontend/responsive-system.css'
      - 'forecast-portfolio-v14.css'
      - 'financial-report/tests/brand_contrast_browser.py'
      - '.github/workflows/finquery-contrast-browser.yml'
  push:
    branches: [main]
    paths:
      - 'financial-report/frontend/responsive-system.css'
      - 'forecast-portfolio-v14.css'
      - 'financial-report/tests/brand_contrast_browser.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate fixture syntax
        run: python -m py_compile financial-report/tests/brand_contrast_browser.py
      - name: Chrome-computed contrast for actual FinQuery CSS and real HTML
        run: |
          pip install --disable-pip-version-check -q selenium==4.36.0
          python financial-report/tests/brand_contrast_browser.py
