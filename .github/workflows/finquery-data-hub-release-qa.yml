name: FinQuery Data Hub release QA
on:
  pull_request:
    paths:
      - 'financial-report/data-hub.html'
      - 'financial-report/frontend/index.html'
      - 'financial-report/tests/data_hub.test.cjs'
      - '.github/workflows/finquery-data-hub-release-qa.yml'
  push:
    branches: [main]
    paths:
      - 'financial-report/data-hub.html'
      - 'financial-report/frontend/index.html'
      - 'financial-report/tests/data_hub.test.cjs'
      - '.github/workflows/finquery-data-hub-release-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finquery-data-hub-release-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hub-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Data Hub functional checks
        run: |
          node --test financial-report/tests/data_hub.test.cjs
      - name: Market data and risk regression
        run: |
          node --test financial-report/tests/market_data.test.cjs financial-report/tests/risk_monitor.test.cjs
      - name: Rebuild standalone production artifact and confirm route
        run: |
          python financial-report/scripts/build_cdn.py
          python - <<'PY'
          from pathlib import Path
          html=Path('financial-report/index.html').read_text(encoding='utf-8')
          hub=Path('financial-report/data-hub.html').read_text(encoding='utf-8')
          assert 'https://finquery.info.vn/financial-report/data-hub.html' in html
          assert 'https://raw.githubusercontent.com/NCKHtop1/vmews-risk-analytics/financial-market-data/market/' in hub
          assert '07/10/2026' in hub and 'Không lấy được manifest' in hub
          assert 'FINQUERY_SESSION_PEPPER' not in hub
          print('FinQuery Data Hub production bundle contract PASS')
          PY
