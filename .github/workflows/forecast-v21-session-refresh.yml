name: Forecast V21 guarded session overlay

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Forecast V20.1 immutable-price audit and market intelligence
      - Refresh live HOSE Core + Liquid prices
      - Refresh market news stream
    branches:
      - main
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - "data/forecast-dashboard-v12.json"
      - ".github/workflows/forecast-v21-session-refresh.yml"
      - "scripts/forecast_v21_session_snapshot.py"
      - "scripts/forecast_v21_publish_guard.py"
  schedule:
    # Recovery / pre-open / post-close safety runs (UTC; Vietnam = UTC+7).
    - cron: "47 20,22 * * *"
    - cron: "15 0 * * 1-5"
    - cron: "35 9 * * 1-5"
    # Intraday price/session overlay every 15 minutes.
    # 09:15-11:30 Vietnam time.
    - cron: "15,30,45 2 * * 1-5"
    - cron: "0,15,30,45 3 * * 1-5"
    - cron: "0,15,30 4 * * 1-5"
    # 13:00-14:45 Vietnam time.
    - cron: "0,15,30,45 6,7 * * 1-5"
  pull_request:
    paths:
      - ".github/workflows/forecast-v21-session-refresh.yml"
      - "scripts/forecast_v21_session_snapshot.py"
      - "scripts/forecast_v21_session_snapshot_test.py"
      - "scripts/forecast_v21_publish_guard.py"
      - "scripts/forecast_v21_publish_guard_test.py"

permissions:
  contents: write

# All production writers share one repository-wide lock. Pull-request verification
# remains isolated by SHA so it never blocks a production refresh.
concurrency:
  group: vmews-main-data-publisher-${{ github.event_name == 'pull_request' && github.sha || 'main' }}
  cancel-in-progress: false
  queue: max

jobs:
  test-session-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install --disable-pip-version-check -q pandas
      - name: Test coverage, freshness, audited horizon, defensive fallback and atomic publication
        run: |
          python scripts/forecast_v21_session_snapshot_test.py
          python scripts/forecast_v21_publish_guard_test.py

  refresh-session-overlay:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    needs: test-session-overlay
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate workflow heartbeat to Vietnam live session
        id: session
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A successful full Forecast core publication must rebuild V21 even
          # after market close. Bot-authored data commits do not start new push
          # workflows, so this workflow_run is the authoritative handoff.
          if [ "${{ github.event.workflow_run.name }}" = "Forecast V20.1 immutable-price audit and market intelligence" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Full Forecast core publisher completed; forcing V21 alignment refresh."
            exit 0
          fi
          hhmm=$(TZ=Asia/Ho_Chi_Minh date +%H%M)
          if { [ "$hhmm" -ge 0900 ] && [ "$hhmm" -le 1130 ]; } || { [ "$hhmm" -ge 1300 ] && [ "$hhmm" -le 1445 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Workflow heartbeat outside VN live session: $hhmm"
          fi
      - name: Install session quote provider
        if: steps.session.outputs.run == 'true'
        run: pip install --disable-pip-version-check -q pandas tradingview-screener==3.2.1
      - name: Build guarded session overlay
        if: steps.session.outputs.run == 'true'
        id: overlay
        run: python scripts/forecast_v21_session_snapshot.py
      - name: Explain retained last-known-good snapshot
        if: steps.session.outputs.run == 'true' && failure()
        run: |
          echo "Current session provider failed freshness/coverage/ranking gates."
          echo "No forecast-session-v21.json is overwritten; the last validated snapshot remains published."
      - name: Validate publishable overlay
        if: steps.session.outputs.run == 'true' && success()
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/forecast-session-v21.json',encoding='utf-8'))
          d=json.load(open('data/forecast-dashboard-v12.json',encoding='utf-8'))
          assert p['version']=='VMEWS-FORECAST-SESSION-21.4',p.get('version')
          assert p['status']=='PASS',p.get('status')
          assert p['coreForecastUnchanged'] is True
          promotion=d.get('promotion') or {}
          promoted={int(x) for x in promotion.get('directPriceHorizons') or []}
          preferred=int(promotion.get('preferredRankingHorizon') or 0)
          assert preferred in promoted,(preferred,promoted)
          assert int(p.get('rankingHorizon') or 0)==preferred,(p.get('rankingHorizon'),preferred)
          c=p['coverage']
          assert c['coverageRatio']>=0.90,c
          assert c['currentCoverageRatio']>=0.70,c
          assert c['cutoffFreshCoverageRatio']>=0.70,c
          alignment=p.get('forecastAlignment') or {}
          assert alignment.get('status') in {'PASS','STALE_CORE'},alignment
          ranking_eligible=alignment.get('rankingEligible') is True
          if ranking_eligible:
            assert len(p.get('leaders') or [])==10,p.get('leaders')
            assert all(int(x.get('rankingHorizon',0))==preferred for x in p.get('leaders') or []),p.get('leaders')
          else:
            assert p.get('mode')=='PRICE_ONLY_STALE_CORE',p.get('mode')
            assert not (p.get('leaders') or []),p.get('leaders')
            assert all(x.get('rankingHorizon') is None for x in p.get('symbols') or []),p.get('symbols')
          print(json.dumps({'session':p['session'],'coreAsOf':p['coreAsOf'],'rankingHorizon':preferred,'coverage':c,'leaders':[x['symbol'] for x in p['leaders']]},ensure_ascii=False,indent=2))
          PY
      - name: Persist only validated session overlay
        if: steps.session.outputs.run == 'true' && success()
        env:
          MAX_PUBLISH_ATTEMPTS: "4"
        run: |
          set -euo pipefail
          candidate="/tmp/forecast-session-v21.candidate.json"
          cp data/forecast-session-v21.json "$candidate"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in $(seq 1 "$MAX_PUBLISH_ATTEMPTS"); do
            echo "Atomic session publish attempt ${attempt}/${MAX_PUBLISH_ATTEMPTS}"
            git fetch --no-tags origin main
            git reset --hard origin/main

            set +e
            python scripts/forecast_v21_publish_guard.py \
              --candidate "$candidate" \
              --published data/forecast-session-v21.json \
              --dashboard data/forecast-dashboard-v12.json
            guard_rc=$?
            set -e

            if [ "$guard_rc" -eq 10 ]; then
              echo "A same/newer validated snapshot or newer core is already on main; keep it and finish green."
              exit 0
            fi
            if [ "$guard_rc" -ne 0 ]; then
              echo "Publish guard rejected an invalid candidate."
              exit "$guard_rc"
            fi

            cp "$candidate" data/forecast-session-v21.json
            git add data/forecast-session-v21.json
            if git diff --cached --quiet; then
              echo "No validated session change detected."
              exit 0
            fi
            git commit -m "Refresh validated forecast session overlay [data-only]"

            set +e
            push_output=$(git push origin HEAD:main 2>&1)
            push_rc=$?
            set -e
            printf '%s\n' "$push_output"
            if [ "$push_rc" -eq 0 ]; then
              echo "Validated session overlay published by fast-forward."
              exit 0
            fi

            if printf '%s\n' "$push_output" | grep -Eqi 'non-fast-forward|fetch first|rejected'; then
              echo "main advanced during publish; retrying from the new remote head without rebasing generated JSON."
              continue
            fi

            echo "git push failed for a reason other than a concurrent main advance."
            exit "$push_rc"
          done

          echo "main advanced through all bounded attempts; re-checking whether production is already same/newer."
          git fetch --no-tags origin main
          git reset --hard origin/main
          set +e
          python scripts/forecast_v21_publish_guard.py \
            --candidate "$candidate" \
            --published data/forecast-session-v21.json \
            --dashboard data/forecast-dashboard-v12.json
          final_guard_rc=$?
          set -e
          if [ "$final_guard_rc" -eq 10 ]; then
            echo "A same/newer validated snapshot or newer core won the race; finish green."
            exit 0
          fi
          if [ "$final_guard_rc" -eq 0 ]; then
            echo "Candidate is still newer but could not be published after bounded retries; fail visibly instead of hiding publication starvation."
            exit 75
          fi
          exit "$final_guard_rc"
