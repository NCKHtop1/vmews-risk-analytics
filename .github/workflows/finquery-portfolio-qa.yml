name: FinQuery Portfolio Intelligence QA
on:
  pull_request:
    paths:
      - 'financial-report/portfolio.*'
      - 'financial-report/scripts/build_portfolio_sector_rotation.py'
      - 'financial-report/tests/test_portfolio_sector_rotation.py'
      - 'financial-report/frontend/index.html'
      - 'financial-report/frontend/portfolio-intelligence.js'
      - 'financial-report/frontend/portfolio-rebalance-core.js'
      - 'financial-report/frontend/portfolio-policy-ui.js'
      - 'financial-report/tests/portfolio_rebalance.test.cjs'
      - 'financial-report/tests/portfolio_visual_browser.py'
      - 'finquery-access/migrations/004_portfolio_policy.sql'
      - 'financial-report/frontend/portfolio-intelligence.css'
      - 'financial-report/frontend/risk-monitor.js'
      - 'financial-report/frontend/app.js'
      - 'financial-report/tests/portfolio_intelligence.test.cjs'
      - 'financial-report/scripts/build_cdn.py'
      - 'finquery-access/api/index.js'
      - 'finquery-access/migrations/003_portfolio_ledger.sql'
      - '.github/workflows/finquery-portfolio-qa.yml'
  push:
    branches: [main]
    paths:
      - 'financial-report/portfolio.*'
      - 'finquery-access/api/index.js'
      - '.github/workflows/finquery-portfolio-qa.yml'
permissions:
  contents: read
jobs:
  portfolio-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check financial-report/frontend/portfolio-rebalance-core.js
          node --check financial-report/frontend/portfolio-policy-ui.js
          node --check financial-report/frontend/portfolio-intelligence.js
          node --check financial-report/frontend/risk-monitor.js
          node --check financial-report/frontend/app.js
          node --check finquery-access/api/index.js
      - name: Quant rotation unit tests
        run: python -m unittest discover -s financial-report/tests -p 'test_portfolio_sector_rotation.py'
      - name: Contract checks
        run: |
          node --test financial-report/tests/portfolio_intelligence.test.cjs
          node --test financial-report/tests/portfolio_rebalance.test.cjs
      - name: Frontend build still includes portfolio navigation
        run: |
          python financial-report/scripts/build_cdn.py
          python - <<'PY'
          from pathlib import Path
          page=Path('financial-report/index.html').read_text()
          assert 'href="#portfolio" data-platform-view="portfolio"' in page
          assert 'window.FinPortfolio=' in page
          assert 'portfolio-entry-form' in page
          assert 'id="portfolio-policy-cards"' in page
          assert 'FinPortfolioPolicy=' in page
          assert 'finquery:portfolio-render' in page
          assert 'portfolio-intelligence.css' not in page
          assert Path('financial-report/portfolio.html').exists()
          assert 'index.html#portfolio' in Path('financial-report/portfolio.html').read_text()
          print('FinQuery native Portfolio bundle OK')
          PY
