<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị | FinQuery</title><meta name="robots" content="noindex,nofollow"><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#253957;font:14px/1.5 system-ui,Arial}header{padding:22px 5%;background:white;border-bottom:1px solid #e4eaf3;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:25px}a{color:#3866bd;text-decoration:none}main{max-width:1120px;margin:30px auto;padding:0 20px}section{background:white;border:1px solid #e3eaf4;border-radius:16px;margin-bottom:20px;overflow:hidden}h2{font-size:17px;margin:0;padding:18px 20px;border-bottom:1px solid #edf1f6}.content{padding:16px 20px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:700px}th,td{padding:13px 8px;text-align:left;border-bottom:1px solid #edf0f5}th{color:#70819b;font-size:12px}button,select{border:1px solid #d9e4f2;border-radius:8px;background:white;padding:7px 10px;color:#314e7e;cursor:pointer}button:hover{background:#e8f2ff}.tag{display:inline-block;border-radius:9px;background:#eef4ff;padding:4px 9px}.pending{background:#fff0cd}.blocked{background:#ffe1e1}.actions{display:flex;flex-wrap:wrap;gap:5px}#message{padding:15px;color:#596d87}small{color:#7488a2}#events{font-size:13px;overflow-wrap:anywhere}
@media(max-width:760px){header{padding:14px;align-items:flex-start}header>div:last-child{display:flex;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:20px;line-height:1.3}main{margin:12px auto;padding:0 10px}section{border-radius:11px;margin-bottom:12px}h2{padding:12px;font-size:15px}.content{padding:10px;max-width:100%;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}table{min-width:690px}th,td{padding:9px 8px}button,select{min-height:40px;font-size:12px}.actions{gap:6px}#message{padding:10px}}
</style></head><body><header><div><h1>FinQuery · Quản trị hệ thống</h1><small>Kiểm soát tài khoản và quyền truy cập</small></div><div><a href="/financial-report/index.html">Quay lại FinQuery</a> &nbsp; <button onclick="signOut()">Đăng xuất</button></div></header><main><section><h2>Quản lý người dùng</h2><div id="message" role="status">Đang tải dữ liệu…</div><div class="content"><table><thead><tr><th>Tài khoản</th><th>Vai trò</th><th>Trạng thái</th><th>Đăng nhập gần nhất</th><th>Thao tác</th></tr></thead><tbody id="users"></tbody></table></div></section><section><h2>Nhật ký quản trị gần đây</h2><div class="content" id="events">Đang tải…</div></section></main><script>let me=null;const roleLabels={owner:'Chủ sở hữu',admin:'Quản trị viên',user:'Người dùng'};const statusLabels={pending:'Chờ duyệt',active:'Đang hoạt động',blocked:'Đã khóa'};function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n}function date(s){return s?new Date(s).toLocaleString('vi-VN'):'—'}async function api(path,opts){const r=await fetch(path,Object.assign({credentials:'same-origin',cache:'no-store'},opts||{}));const data=await r.json();if(!r.ok)throw Error(data.error||'Không thể thực hiện yêu cầu.');return data}async function update(id,action,role){if(['block','set_role'].includes(action)&&!confirm('Bạn có chắc muốn thay đổi quyền truy cập của tài khoản này?'))return;try{await api('/api/admin/user',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action,role})});await load()}catch(e){document.getElementById('message').textContent=e.message}}async function load(){try{const data=await api('/api/admin/users');me=data.self;const body=document.getElementById('users');body.replaceChildren();for(const u of data.users){let tr=el('tr');let who=el('td');who.append(el('strong',u.full_name||u.email),el('div',u.email));tr.append(who,el('td',roleLabels[u.role]||u.role),el('td',statusLabels[u.status]||u.status,u.status),el('td',date(u.last_login_at)));let controls=el('td');let box=el('div',undefined,'actions');if(u.role!=='owner'&&u.email!==me.email){function btn(title,action,role){const b=el('button',title);b.onclick=()=>update(u.id,action,role);box.append(b)}if(u.status==='pending')btn('Phê duyệt','approve');if(u.status==='active')btn('Khóa','block');if(u.status==='blocked')btn('Mở khóa','unblock');btn('Đăng xuất mọi thiết bị','revoke_sessions');if(me.role==='owner'){let select=el('select');for(const role of ['user','admin']){const opt=el('option',roleLabels[role]||role);opt.value=role;opt.selected=u.role===role;select.append(opt)}select.onchange=()=>update(u.id,'set_role',select.value);box.append(select)}}else box.append(el('small','Tài khoản được bảo vệ'));controls.append(box);tr.append(controls);body.append(tr)}document.getElementById('message').textContent='Đang hiển thị '+data.users.length+' tài khoản (tối đa 300).';const audit=await api('/api/admin/audit');const events=document.getElementById('events');events.replaceChildren();for(const e of audit.events){events.append(el('div',date(e.created_at)+' · '+e.actor_email+' · '+e.action+' · '+(e.target_email||'')));}if(!audit.events.length)events.textContent='Chưa có hoạt động quản trị nào.';}catch(e){document.getElementById('message').textContent=e.message;document.getElementById('events').textContent='Không thể tải nhật ký quản trị.'}}async function signOut(){await api('/api/auth/logout',{method:'POST'}).catch(()=>{});location.href='/login'}load();</script></body></html>
