<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị | FinQuery</title><link rel="icon" type="image/svg+xml" href="/financial-report/frontend/favicon.svg"><meta name="theme-color" content="#0A1B3D"><meta name="robots" content="noindex,nofollow"><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#253957;font:14px/1.5 system-ui,Arial}header{padding:22px 5%;background:white;border-bottom:1px solid #e4eaf3;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:25px}a{color:#3866bd;text-decoration:none}main{max-width:1120px;margin:30px auto;padding:0 20px}section{background:white;border:1px solid #e3eaf4;border-radius:16px;margin-bottom:20px;overflow:hidden}h2{font-size:17px;margin:0;padding:18px 20px;border-bottom:1px solid #edf1f6}.content{padding:16px 20px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:700px}th,td{padding:13px 8px;text-align:left;border-bottom:1px solid #edf0f5}th{color:#70819b;font-size:12px}button,select{border:1px solid #d9e4f2;border-radius:8px;background:white;padding:7px 10px;color:#314e7e;cursor:pointer}button:hover{background:#e8f2ff}.tag{display:inline-block;border-radius:9px;background:#eef4ff;padding:4px 9px}.pending{background:#fff0cd}.blocked{background:#ffe1e1}.actions{display:flex;flex-wrap:wrap;gap:5px}#message{padding:15px;color:#596d87}small{color:#7488a2}#events{font-size:13px;overflow-wrap:anywhere}
@media(max-width:760px){header{padding:14px;align-items:flex-start}header>div:last-child{display:flex;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:20px;line-height:1.3}main{margin:12px auto;padding:0 10px}section{border-radius:11px;margin-bottom:12px}h2{padding:12px;font-size:15px}.content{padding:10px;max-width:100%;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}table{min-width:690px}th,td{padding:9px 8px}button,select{min-height:40px;font-size:12px}.actions{gap:6px}#message{padding:10px}}

/* FinQuery Q-Data V2 admin visual identity; roles, tables, actions stay intact. */
:root{--fq-navy:#0A1B3D;--fq-blue:#245BFF;--fq-cyan:#22C7EB;--fq-line:#DFE8F4}
body{background:#F3F6FA;color:#172E4F;font-family:'Be Vietnam Pro','Segoe UI',system-ui,sans-serif}
header{
 background:linear-gradient(105deg,#07152D,#0A1B3D 76%,#143C6A);
 border-bottom:1px solid rgba(114,178,239,.23);
 box-shadow:0 7px 22px rgba(10,27,61,.08);
}
header>div:first-child{
 display:grid;grid-template-columns:45px minmax(0,1fr);grid-template-rows:auto auto;
 column-gap:13px;align-items:center;
}
header .fq-admin-mark{grid-column:1;grid-row:1 / span 2;display:grid;place-items:center}
header .fq-admin-symbol{width:42px;height:42px;display:block}
header h1{grid-column:2;grid-row:1;color:#fff;font-weight:800;letter-spacing:-.6px}
header small{grid-column:2;grid-row:2;color:#B6CEE9}
header a{color:#D5EDFF;font-weight:650}
header a:hover{color:#fff}
header button{
 background:rgba(255,255,255,.09);border-color:rgba(148,203,244,.27);
 color:#fff;min-height:40px;
}
header button:hover{background:rgba(36,91,255,.4)}
main{max-width:1120px}
section{background:#fff;border-color:var(--fq-line);border-radius:16px;box-shadow:0 4px 20px rgba(10,27,61,.035)}
h2{color:var(--fq-navy);font-weight:760;border-bottom-color:var(--fq-line)}
th{background:#F5F8FE;color:#516782;font-weight:750}
td{color:#263B57;border-bottom-color:#E8EEF7}
button,select{border-color:#D5E0EF;color:#184A9B}
button:hover{background:#EEF4FF}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--fq-blue);outline-offset:2px}
.tag{background:#EAF2FF;color:#184A9B}
.pending{background:#FFF0CD;color:#845B1D}
.blocked{background:#FFE1E1;color:#9D3746}
#message{color:#546C86}
@media(max-width:760px){
 header{padding:14px}
 header .fq-admin-symbol{width:34px;height:34px}
 header>div:first-child{grid-template-columns:38px minmax(0,1fr);column-gap:9px}
 header h1{font-size:19px}
 section{border-radius:12px}
}
</style></head><body><header><div><span class="fq-admin-mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" class="fq-admin-symbol" aria-hidden="true" focusable="false"><defs><linearGradient id="fqArc" x1="50" y1="10" x2="26" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#245BFF"/><stop offset=".5" stop-color="#1650F5"/><stop offset="1" stop-color="#08C8EB"/></linearGradient></defs><path d="M48.8 12.7C44.3 10.2 39.4 9 34.4 9 20.1 9 9.8 20.9 9.8 35.7c0 14.6 10.8 26.7 24.7 26.7 6.9 0 12.6-2.2 17.8-6.8" fill="none" stroke="url(#fqArc)" stroke-width="12.2" stroke-linecap="round"/><path d="M45 47.2h12.8L73 66.9H60.2Z" fill="#245BFF"/><rect x="57.5" y="7.7" width="10.1" height="10.1" rx="2.5" fill="#10C9EB"/><rect x="48.1" y="23.8" width="9.2" height="9.2" rx="2.2" fill="#245BFF"/><rect x="61.1" y="29.1" width="11.1" height="11.1" rx="2.7" fill="#22C5EB"/></svg></span><h1>FinQuery · Quản trị hệ thống</h1><small>Kiểm soát tài khoản và quyền truy cập</small></div><div><a href="/financial-report/index.html">Quay lại FinQuery</a> &nbsp; <button onclick="signOut()">Đăng xuất</button></div></header><main><section><h2>Quản lý người dùng</h2><div id="message" role="status">Đang tải dữ liệu…</div><div class="content"><table><thead><tr><th>Tài khoản</th><th>Vai trò</th><th>Trạng thái</th><th>Đăng nhập gần nhất</th><th>Thao tác</th></tr></thead><tbody id="users"></tbody></table></div></section><section><h2>Nhật ký quản trị gần đây</h2><div class="content" id="events">Đang tải…</div></section></main><script>let me=null;const roleLabels={owner:'Chủ sở hữu',admin:'Quản trị viên',user:'Người dùng'};const statusLabels={pending:'Chờ duyệt',active:'Đang hoạt động',blocked:'Đã khóa'};function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n}function date(s){return s?new Date(s).toLocaleString('vi-VN'):'—'}async function api(path,opts){const r=await fetch(path,Object.assign({credentials:'same-origin',cache:'no-store'},opts||{}));const data=await r.json();if(!r.ok)throw Error(data.error||'Không thể thực hiện yêu cầu.');return data}async function update(id,action,role){if(['block','set_role'].includes(action)&&!confirm('Bạn có chắc muốn thay đổi quyền truy cập của tài khoản này?'))return;try{await api('/api/admin/user',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action,role})});await load()}catch(e){document.getElementById('message').textContent=e.message}}async function load(){try{const data=await api('/api/admin/users');me=data.self;const body=document.getElementById('users');body.replaceChildren();for(const u of data.users){let tr=el('tr');let who=el('td');who.append(el('strong',u.full_name||u.email),el('div',u.email));tr.append(who,el('td',roleLabels[u.role]||u.role),el('td',statusLabels[u.status]||u.status,u.status),el('td',date(u.last_login_at)));let controls=el('td');let box=el('div',undefined,'actions');if(u.role!=='owner'&&u.email!==me.email){function btn(title,action,role){const b=el('button',title);b.onclick=()=>update(u.id,action,role);box.append(b)}if(u.status==='pending')btn('Phê duyệt','approve');if(u.status==='active')btn('Khóa','block');if(u.status==='blocked')btn('Mở khóa','unblock');btn('Đăng xuất mọi thiết bị','revoke_sessions');if(me.role==='owner'){let select=el('select');for(const role of ['user','admin']){const opt=el('option',roleLabels[role]||role);opt.value=role;opt.selected=u.role===role;select.append(opt)}select.onchange=()=>update(u.id,'set_role',select.value);box.append(select)}}else box.append(el('small','Tài khoản được bảo vệ'));controls.append(box);tr.append(controls);body.append(tr)}document.getElementById('message').textContent='Đang hiển thị '+data.users.length+' tài khoản (tối đa 300).';const audit=await api('/api/admin/audit');const events=document.getElementById('events');events.replaceChildren();for(const e of audit.events){events.append(el('div',date(e.created_at)+' · '+e.actor_email+' · '+e.action+' · '+(e.target_email||'')));}if(!audit.events.length)events.textContent='Chưa có hoạt động quản trị nào.';}catch(e){document.getElementById('message').textContent=e.message;document.getElementById('events').textContent='Không thể tải nhật ký quản trị.'}}async function signOut(){await api('/api/auth/logout',{method:'POST'}).catch(()=>{});location.href='/login'}load();</script></body></html>
